<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>uOS — Web Operating System</title>
<style>
/* ============ THEME TOKENS ============ */
:root{
  --accent:#0078d4;
  --accent-soft:rgba(0,120,212,.22);
  --accent-text:#fff;
  --radius:10px;
  --font:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Ubuntu,"Helvetica Neue",sans-serif;
  --mono:"Cascadia Code","Consolas","SFMono-Regular",Menlo,monospace;
  --tb-h:48px;
}
html[data-theme="dark"]{
  --bg:#0b0f17;
  --surface:rgba(28,32,42,.72);
  --surface-solid:#1c2029;
  --surface-2:#232833;
  --surface-3:#2b3140;
  --text:#f2f4f8;
  --text-dim:#a7b0c0;
  --border:rgba(255,255,255,.09);
  --shadow:0 24px 60px rgba(0,0,0,.55),0 4px 14px rgba(0,0,0,.4);
  --field:rgba(255,255,255,.06);
  --field-hover:rgba(255,255,255,.11);
}
html[data-theme="light"]{
  --bg:#eef1f6;
  --surface:rgba(252,253,255,.82);
  --surface-solid:#fbfcff;
  --surface-2:#f1f3f8;
  --surface-3:#e6e9f0;
  --text:#141821;
  --text-dim:#5a6373;
  --border:rgba(0,0,0,.1);
  --shadow:0 24px 60px rgba(20,30,60,.22),0 4px 14px rgba(20,30,60,.14);
  --field:rgba(0,0,0,.05);
  --field-hover:rgba(0,0,0,.09);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font);
  color:var(--text);
  overflow:hidden;
  background:#05070c;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:rgba(128,140,160,.45);border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(128,140,160,.75);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============ BOOT ============ */
#boot{
  position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;
  background:radial-gradient(circle at 50% 38%,#152036,#05070c 70%);
  color:#e9eefb;transition:opacity .5s ease,visibility .5s;
}
#boot.done{opacity:0;visibility:hidden}
.uos-logo{font-size:64px;font-weight:800;letter-spacing:-2px;display:flex;align-items:center;gap:0}
.uos-logo .u{color:var(--accent)}
.uos-logo .rest{background:linear-gradient(90deg,#fff,#8fb7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.boot-mark{width:76px;height:76px;filter:drop-shadow(0 8px 24px rgba(84,184,255,.4))}
#splash.rare,#lockSplash.rare,#aboutSplash.rare{color:#8fb7ff}
#splash{margin-top:-8px;max-width:min(600px,92vw);text-align:center;
  font-size:12.5px;font-weight:600;color:#c9a45f;letter-spacing:.15px;
  opacity:.9;transform:rotate(-2.5deg)}
.boot-mark svg{display:block;width:100%;height:100%}
#boot .sub{color:#93a2c4;font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-top:-14px}
.boot-bar{width:260px;height:5px;border-radius:99px;background:rgba(255,255,255,.13);overflow:hidden}
.boot-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#54b8ff);transition:width .25s ease}
#bootLog{font-family:var(--mono);font-size:11.5px;color:#6f83a8;height:70px;width:420px;text-align:left;overflow:hidden}

/* ============ DESKTOP ============ */
#desktop{
  position:fixed;inset:0 0 var(--tb-h) 0;
  background-size:cover;background-position:center;
  overflow:hidden;
}
#icons{position:absolute;inset:0;z-index:1;pointer-events:none}
.dicon{
  position:absolute;width:86px;padding:6px 3px 4px;border-radius:8px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:left .14s cubic-bezier(.2,.8,.2,1),top .14s cubic-bezier(.2,.8,.2,1),background .12s;
  cursor:default;pointer-events:auto;touch-action:none;
}
.dicon:active{cursor:grabbing}
.dicon:hover{background:rgba(255,255,255,.10)}
.dicon.sel{background:var(--accent-soft);outline:1px solid rgba(255,255,255,.25)}
.dicon-badge{position:absolute;top:1px;right:7px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;box-shadow:0 1px 5px rgba(0,0,0,.55);pointer-events:none}
.dicon .ico{font-size:32px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.dicon .lbl{font-size:11.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85);word-break:break-word;line-height:1.2;max-width:82px}
/* custom svg icons scale with font-size */
.ico svg,.tb-icon svg,.tico svg{width:1em;height:1em;display:block;pointer-events:none}
.tb-icon,.tico{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.tico{font-size:18px}
.tb-icon{font-size:16px}
.dicon .ico{font-size:40px}

#windows{position:absolute;inset:0;pointer-events:none}
#windows > .window{pointer-events:auto}

/* ============ WINDOW ============ */
.window{
  position:absolute;min-width:260px;min-height:150px;
  background:var(--surface);backdrop-filter:blur(26px) saturate(160%);
  -webkit-backdrop-filter:blur(26px) saturate(160%);
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);display:flex;flex-direction:column;
  overflow:hidden;animation:winIn .16s ease-out;
}
@keyframes winIn{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.window.active{border-color:rgba(255,255,255,.18);box-shadow:0 30px 70px rgba(0,0,0,.65),0 0 0 1px var(--accent-soft)}
.window.min{display:none}
.window.maximized{border-radius:0}
.window.maximized .rs{display:none}
.titlebar{
  height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:space-between;
  padding:0 4px 0 12px;gap:8px;cursor:grab;
}
.titlebar:active{cursor:grabbing}
.tb-left{display:flex;align-items:center;gap:9px;min-width:0}
.tb-icon{font-size:15px}
.tb-title{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-ctrls{display:flex;gap:2px}
.wc{width:38px;height:30px;border-radius:6px;display:grid;place-items:center;font-size:12px;color:var(--text-dim)}
.wc:hover{background:var(--field-hover);color:var(--text)}
.wc.close:hover{background:#e81123;color:#fff}
.win-body{flex:1;overflow:auto;position:relative;display:flex;flex-direction:column;background:var(--surface-solid)}
.rs{position:absolute;z-index:5}
.rs.n{top:0;left:8px;right:8px;height:6px;cursor:ns-resize}
.rs.s{bottom:0;left:8px;right:8px;height:6px;cursor:ns-resize}
.rs.e{right:0;top:8px;bottom:8px;width:6px;cursor:ew-resize}
.rs.w{left:0;top:8px;bottom:8px;width:6px;cursor:ew-resize}
.rs.ne{top:0;right:0;width:12px;height:12px;cursor:nesw-resize}
.rs.nw{top:0;left:0;width:12px;height:12px;cursor:nwse-resize}
.rs.se{bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize}
.rs.sw{bottom:0;left:0;width:14px;height:14px;cursor:nesw-resize}
#snapHint{position:fixed;border:2px solid var(--accent);background:var(--accent-soft);border-radius:6px;z-index:700;display:none;pointer-events:none}

/* ============ TASKBAR (Windows 10 style) ============ */
#taskbar{
  position:fixed;left:0;right:0;bottom:0;height:var(--tb-h);
  display:flex;align-items:stretch;gap:0;padding:0;
  background:var(--surface);backdrop-filter:blur(30px) saturate(150%);
  -webkit-backdrop-filter:blur(30px) saturate(150%);
  border-top:1px solid var(--border);z-index:500;
}
#startBtn{width:54px;display:grid;place-items:center;transition:background .12s;flex:0 0 auto}
#startBtn svg{width:28px;height:28px;display:block}
#startBtn:hover{background:var(--field-hover)}
#startBtn.open{background:var(--field)}
.tbicon{width:48px;display:grid;place-items:center;color:var(--text-dim);transition:background .12s;flex:0 0 auto}
.tbicon:hover{background:var(--field-hover);color:var(--text)}
.tbicon.on{background:var(--field);color:var(--text)}
.tbicon svg{width:23px;height:23px;display:block}
.tb-sep{width:1px;align-self:center;height:28px;background:var(--border);margin:0 6px;flex:0 0 auto}
#pinned,#taskItems{display:flex;align-items:center;gap:3px;min-width:0;align-self:center;height:calc(var(--tb-h) - 8px)}
#taskItems{overflow-x:auto;scrollbar-width:none;flex:0 1 auto}
#taskItems::-webkit-scrollbar{display:none}
.pin,.taskitem{
  height:100%;border-radius:5px;display:flex;align-items:center;gap:9px;padding:0 12px;
  background:none;color:var(--text);transition:background .1s;position:relative;max-width:220px;
}
.pin{width:52px;justify-content:center;padding:0}
.pin .tico,.taskitem .tico{font-size:25px;flex:0 0 auto}
.taskitem .tlabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.pin:hover,.taskitem:hover{background:var(--field-hover)}
.pin.active,.taskitem.active{background:var(--field)}
.pin::after,.taskitem::after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:1px;width:0;height:2.5px;border-radius:2px;background:var(--accent);transition:width .15s}
.pin.has-task::after,.taskitem.minimized::after{width:30%}
.pin.active::after,.taskitem.active::after{width:62%}
#tray{margin-left:auto;display:flex;align-items:center;gap:3px;padding:0 5px;flex:0 0 auto}
.traybtn{display:flex;align-items:center;gap:7px;height:38px;padding:0 9px;border-radius:7px;color:var(--text-dim);font-size:12px;transition:background .13s,color .13s}
.traybtn:hover{background:var(--field-hover);color:var(--text)}
.traybtn.on{background:var(--field);color:var(--text)}
.traybtn svg{width:20px;height:20px;display:block}
/* line-height is deliberately tight so the two-line clock stays inside its
   38px hover pill (a looser 1.3 pushed the text 2px past the top and bottom) */
#clock{flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.15;padding:0 12px;color:var(--text)}
#clock b{font-weight:400;font-size:12.5px}
#clock small{color:var(--text-dim);font-size:11.5px}
#showDesk{width:7px;height:38px;border-radius:7px;padding:0}
#showDesk:hover{background:var(--field-hover)}

/* ---- tray flyout ---- */
#flyout{
  position:fixed;right:10px;bottom:calc(var(--tb-h) + 8px);z-index:620;width:340px;
  background:var(--surface);backdrop-filter:blur(34px) saturate(160%);
  -webkit-backdrop-filter:blur(34px) saturate(160%);
  border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);
  padding:14px;display:none;flex-direction:column;gap:12px;max-height:70vh;
}
#flyout.open{display:flex}
/* ---- command palette ---- */
#palette{position:fixed;inset:0;z-index:960;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgba(6,9,14,.55)}
#palette.open{display:flex}
/* ---- touch mode: bigger targets for fingers ---- */
body.touch{--tb-h:56px}
body.touch .traybtn{height:46px;min-width:46px;justify-content:center;padding:0 12px}
body.touch .pin,body.touch .taskitem{min-width:50px;padding:0 14px}
body.touch .pin{width:56px}
body.touch .win-ctrls button{width:42px;height:34px}
body.touch .btn{padding:10px 15px;font-size:13px}
body.touch .dicon{width:100px}
body.touch .rs.n,body.touch .rs.s{height:16px;left:16px;right:16px}
body.touch .rs.e,body.touch .rs.w{width:16px;top:16px;bottom:16px}
body.touch .tb-sep{margin:0 10px}
body.touch button,body.touch .pin,body.touch .traybtn,body.touch .dicon{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* ---- virtual desktops ---- */
#deskPager{display:flex;align-items:center;gap:4px;padding:0 6px;flex:0 0 auto}
.desk-dot{width:22px;height:22px;border-radius:6px;font-size:11px;background:var(--field);color:var(--text-dim);display:grid;place-items:center;transition:background .12s,color .12s}
.desk-dot:hover{background:var(--field-hover);color:var(--text)}
.desk-dot.on{background:var(--accent);color:#fff}
.offdesk{display:none!important}
/* ---- snap layout picker ---- */
#snapPick{position:fixed;z-index:720;display:none;gap:10px;padding:10px;background:var(--surface);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
#snapPick.open{display:flex}
.snap-lay{display:grid;gap:4px;width:132px;height:84px;padding:4px;border-radius:8px;background:var(--field);position:relative}
.snap-zone{background:var(--field-hover);border-radius:5px;position:relative}
.snap-zone.on{background:var(--accent);outline:2px solid var(--accent)}
.snap-lay .cap{position:absolute;left:8px;bottom:4px;font-size:9.5px;color:var(--text-dim);pointer-events:none}
#palette .pal-box{width:100%;max-width:620px;background:var(--surface);backdrop-filter:blur(34px) saturate(160%);-webkit-backdrop-filter:blur(34px) saturate(160%);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
#palInput{width:100%;border:0;border-bottom:1px solid var(--border);background:none;color:var(--text);font-size:16px;padding:16px 18px;outline:none;font-family:inherit}
#palInput::placeholder{color:var(--text-dim)}
#palList{max-height:52vh;overflow:auto;padding:6px}
.pal-row{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;font-size:13px;cursor:default}
.pal-row.on{background:var(--accent-soft);outline:1px solid var(--accent)}
.pal-row .pi{font-size:19px;line-height:1;width:24px;text-align:center;flex:0 0 24px}
.pal-row .pt{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-row .ps{color:var(--text-dim);font-size:11px;white-space:nowrap}
.pal-hint{padding:9px 14px;border-top:1px solid var(--border);color:var(--text-dim);font-size:11px;display:flex;gap:12px}
.pal-empty{padding:16px;color:var(--text-dim);font-size:12.5px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa button{background:var(--field);border:1px solid var(--border);border-radius:6px;padding:11px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:var(--text)}
.qa button:hover{background:var(--field-hover)}
.qa button.on{background:var(--accent);color:#fff;border-color:transparent}
.qa svg{width:18px;height:18px}
.notif{display:flex;gap:10px;align-items:flex-start;background:var(--field);border-radius:6px;padding:9px 11px;font-size:12px}
.notif .tico{font-size:16px}
.qbtn{background:var(--field);border:1px solid var(--border);border-radius:6px;width:66px;padding:11px 4px;display:grid;place-items:center;color:var(--text)}
.qbtn:hover{background:var(--field-hover)}
.qbtn svg{width:18px;height:18px}
#flyout .sect,#taskview .sect{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-dim);font-weight:600}
#flyout .btn{align-self:flex-start}
#flyout .notif div{min-width:0}
#flyout .notif b{font-weight:600}
/* ---- tray flyouts: wi-fi / volume / battery rows ---- */
.tl-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.5px}
.tl-row .rng{flex:1;min-width:80px;width:auto}
.tl-app{display:flex;align-items:center;gap:8px;min-width:0}
.tl-app .tico{font-size:16px}
.tl-choice{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:7px;background:var(--field);border:1px solid transparent;font-size:12.5px;transition:background .12s,border-color .12s}
.tl-choice:hover{background:var(--field-hover)}
.tl-choice.on{border-color:var(--accent);background:var(--accent-soft)}
.tl-choice .tl-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);flex:0 0 auto;margin-top:1px}
.tl-choice.on .tl-dot{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--surface)}

/* ---- task view (Win10 Task View) ---- */
#taskview{
  position:fixed;inset:0 0 var(--tb-h) 0;z-index:640;display:none;
  background:rgba(8,10,16,.74);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px;
}
#taskview.open{display:flex}
.tv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;width:min(1100px,100%);max-height:70vh;overflow:auto}
.tv-card{background:var(--surface-solid);border:1px solid var(--border);border-radius:9px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;box-shadow:var(--shadow)}
.tv-card:hover{border-color:var(--accent)}
.tv-card .tico{font-size:26px}
#taskview h2{margin:0;color:#e7ecf5;font-weight:500;font-size:16px}

/* ---- desktop marquee selection ---- */
#selbox{position:absolute;border:1px solid var(--accent);background:var(--accent-soft);border-radius:2px;display:none;pointer-events:none;z-index:3}

/* ============ START MENU ============ */
#startMenu{
  position:fixed;left:6px;transform:translateY(18px);
  bottom:calc(var(--tb-h) + 8px);width:min(680px,calc(100vw - 12px));
  max-height:min(78vh,660px);z-index:600;
  background:var(--surface);backdrop-filter:blur(36px) saturate(165%);
  -webkit-backdrop-filter:blur(36px) saturate(165%);
  border:1px solid var(--border);border-radius:12px;box-shadow:0 30px 70px rgba(0,0,0,.5);
  padding:14px;display:flex;flex-direction:column;gap:10px;
  opacity:0;visibility:hidden;transition:opacity .16s,transform .16s,visibility .16s;
}
#startMenu.open{opacity:1;visibility:visible;transform:translateY(0)}
.sm-top{display:flex;align-items:center;gap:10px}
.sm-avatar{width:36px;height:36px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--accent),#7c5cff)}
.sm-search{
  flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:var(--field);
  border:1px solid var(--border);border-radius:9px;padding:9px 12px;transition:border-color .15s,box-shadow .15s;
}
.sm-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sm-search svg{width:15px;height:15px;color:var(--text-dim);flex:0 0 auto}
.sm-search input{background:none;border:none;outline:none;color:var(--text);font-size:13.5px;flex:1;min-width:0;font-family:inherit}
.sm-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--text-dim);padding:2px 2px 0}
.sm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:4px;overflow:auto;padding:2px}
.sm-app{
  padding:12px 6px 10px;border-radius:9px;display:flex;flex-direction:column;align-items:center;gap:7px;
  transition:background .12s,transform .12s;font-size:12px;text-align:center;
}
.sm-app:hover{background:var(--field-hover);transform:translateY(-1px)}
.sm-app .ico{font-size:32px;line-height:1}
.sm-app .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#smRecents{display:flex;flex-direction:column;gap:3px;overflow:auto}
.sm-recent{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:12.5px}
.sm-recent:hover{background:var(--field-hover)}
.sm-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:12px}
.sm-user{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;padding:6px 8px;border-radius:8px}
.sm-user:hover{background:var(--field-hover)}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7c5cff);display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.powerbtns{display:flex;gap:4px}
.powerbtns button{width:36px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:14px;color:var(--text-dim)}
.powerbtns button:hover{background:var(--field-hover);color:var(--text)}

/* ============ CONTEXT MENU ============ */
#ctxMenu{
  position:fixed;z-index:950;min-width:186px;padding:4px;
  background:var(--surface);backdrop-filter:blur(30px) saturate(160%);
  -webkit-backdrop-filter:blur(30px) saturate(160%);
  border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);
  display:none;flex-direction:column;gap:1px;
}
#ctxMenu.open{display:flex}
.ctx{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:5px;font-size:12px;line-height:1.25;text-align:left;width:100%}
.ctx:hover{background:var(--field-hover)}
.ctx.disabled{opacity:.4;pointer-events:none}
.ctx .k{margin-left:auto;color:var(--text-dim);font-size:11px}
.ctx-sep{height:1px;background:var(--border);margin:3px 4px}

/* ============ GENERIC UI ============ */
.btn{
  background:var(--field);border:1px solid var(--border);border-radius:7px;
  padding:7px 13px;font-size:12.5px;transition:background .12s;white-space:nowrap;
}
.btn:hover{background:var(--field-hover)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.danger:hover{background:#e81123;color:#fff;border-color:transparent}
.field{
  background:var(--field);border:1px solid var(--border);border-radius:7px;
  padding:8px 11px;color:var(--text);font-size:13px;outline:none;font-family:inherit;width:100%;
}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
input[type=range]{accent-color:var(--accent)}
label.rowlab{display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:13px;padding:9px 0}
.toolbar{display:flex;align-items:center;gap:6px;padding:8px;border-bottom:1px solid var(--border);flex-wrap:wrap;background:var(--surface-2)}
.toolbar .sep{width:1px;height:22px;background:var(--border);margin:0 3px}
.pad{padding:16px;display:flex;flex-direction:column;gap:14px}
h3.sect{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin:4px 0 0}
.muted{color:var(--text-dim)}
.empty{padding:40px;text-align:center;color:var(--text-dim);font-size:13px}

/* ============ AI CHAT ============ */
.aichat{flex:1;display:flex;flex-direction:column;min-height:0}
.ai-msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.ai-msg{display:flex;gap:10px;align-items:flex-start}
.ai-msg.user{flex-direction:row-reverse}
.ai-avatar{width:29px;height:29px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;font-size:15px;background:var(--surface-3);border:1px solid var(--border)}
.ai-msg.user .ai-avatar{background:var(--accent);border-color:transparent}
.ai-bubble{padding:11px 15px;border-radius:12px;font-size:13.5px;line-height:1.62;max-width:min(560px,84%);word-break:break-word;overflow-wrap:anywhere}
.ai-msg.user .ai-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.ai-msg.assistant .ai-bubble{background:var(--surface-2);border:1px solid var(--border);border-bottom-left-radius:4px}
.ai-bubble p{margin:0 0 .55em}
.ai-bubble p:last-child{margin-bottom:0}
.ai-bubble pre{background:rgba(0,0,0,.3);padding:11px;border-radius:8px;overflow:auto;font-family:var(--mono);font-size:12px;margin:.6em 0}
.ai-bubble code{font-family:var(--mono);font-size:12px;background:rgba(127,127,127,.2);padding:1px 5px;border-radius:4px}
.ai-bubble pre code{background:none;padding:0}
.ai-bubble .cursor{display:inline-block;width:7px;height:14px;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.ai-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);align-items:flex-end;background:var(--surface-2)}
.ai-input textarea{flex:1;resize:none;min-height:44px;max-height:150px;background:var(--field);border:1px solid var(--border);border-radius:9px;padding:11px 13px;color:var(--text);font-family:inherit;font-size:13.5px;line-height:1.5;outline:none}
.ai-input textarea:focus{border-color:var(--accent)}
.ai-setup{padding:24px;display:flex;flex-direction:column;gap:14px;max-width:540px;margin:auto}
.ai-status{font-size:12px;color:var(--text-dim);padding:8px 0}

/* ============ TOOLS / WIDGETS ============ */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;padding:9px 12px;color:var(--text-dim);font-weight:600;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface-2)}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--border)}
.tbl tr{cursor:default}
.tbl tbody tr:hover td{background:var(--field)}
.tbl tr.sel td{background:var(--accent-soft)}
.appcell{display:flex;align-items:center;gap:9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.field-label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);margin-bottom:5px;display:block;font-weight:600}
.chipbar{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:99px;background:var(--field);border:1px solid var(--border);font-size:12px}
.chip:hover{background:var(--field-hover)}
.chip.on{background:var(--accent);color:#fff;border-color:transparent}
.mono{font-family:var(--mono)}
.md-body{line-height:1.68;font-size:13.5px}
.md-body h1,.md-body h2,.md-body h3{margin:.7em 0 .35em;line-height:1.25}
.md-body code{background:var(--field);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:12px}
.md-body pre{background:var(--field);padding:12px;border-radius:8px;overflow:auto;font-family:var(--mono);font-size:12px}
.md-body blockquote{border-left:3px solid var(--accent);margin:.5em 0;padding:.15em 0 .15em 12px;color:var(--text-dim)}
.md-body ul,.md-body ol{padding-left:20px;margin:.35em 0}
.md-body a{color:var(--accent);text-decoration:none}
.md-body a:hover{text-decoration:underline}
.md-body hr{border:none;border-top:1px solid var(--border);margin:1em 0}
#notes{position:absolute;inset:0;pointer-events:none;z-index:2}
.stickynote{position:absolute;width:194px;min-height:152px;pointer-events:auto;border-radius:9px;box-shadow:0 12px 26px rgba(0,0,0,.34);display:flex;flex-direction:column;color:#2b2b2b}
.stickynote:hover{box-shadow:0 16px 34px rgba(0,0,0,.44)}
.stickynote .sn-bar{height:26px;display:flex;align-items:center;justify-content:flex-end;gap:2px;padding:0 4px;cursor:grab}
.stickynote .sn-bar:active{cursor:grabbing}
.stickynote .sn-btn{width:22px;height:20px;border-radius:5px;font-size:11px;color:#00000099;display:grid;place-items:center}
.stickynote .sn-btn:hover{background:#0000001c}
.stickynote textarea{flex:1;background:transparent;border:none;outline:none;resize:none;padding:0 12px 12px;font-family:var(--font);font-size:13px;color:#2b2b2b;line-height:1.45}
.pw-out{padding:14px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;font-family:var(--mono);font-size:17px;word-break:break-all;text-align:center;letter-spacing:.5px}
.meter{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.meter i{display:block;height:100%;width:0;transition:width .25s,background .25s}
.mono-area{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:var(--mono);font-size:12.5px;padding:12px;outline:none;resize:vertical;line-height:1.55}
.console{background:#0a0d14;border-radius:9px;padding:11px;font-family:var(--mono);font-size:12px;color:#c8ffd4;min-height:80px;max-height:190px;overflow:auto;white-space:pre-wrap;word-break:break-word}
/* ---- HTML Viewer: source | preview split ---- */
.hsplit{flex:1;display:flex;align-items:stretch;min-height:0}
.hsplit>textarea{flex:0 0 46%;min-width:120px;border-radius:0;border:0;height:auto;resize:none;padding:12px 12px 14px}
.hdiv{flex:0 0 7px;background:var(--field);border-left:1px solid var(--border);border-right:1px solid var(--border);cursor:col-resize;transition:background .12s}
.hdiv:hover,.hdiv.drag{background:var(--accent)}
.hprev{flex:1;min-width:0;position:relative;background:#fff}
.hprev iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#fff}
.hprev .hblank{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#7a8393;font-size:13px;text-align:center;padding:20px}
.hstat{display:flex;justify-content:space-between;gap:12px;padding:6px 10px;border-top:1px solid var(--border);background:var(--surface-2);font-size:11.5px}
/* ---- Arcade: menu grid + game stage ---- */
.arc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px;padding:14px;overflow:auto;flex:1;align-content:start}
.arc-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:5px;align-items:flex-start;text-align:left;transition:transform .12s,background .12s,border-color .12s}
.arc-card:hover{transform:translateY(-2px);background:var(--field-hover);border-color:var(--accent)}
.arc-card .ico{font-size:30px;line-height:1}
.arc-card .nm{font-size:13px;font-weight:600}
.arc-card .bl{font-size:11px;color:var(--text-dim);line-height:1.4}
.arc-card .bs{font-size:10.5px;color:var(--accent);margin-top:2px}
.arc-stage{position:relative;flex:1;min-height:0;background:#0b0f17;overflow:hidden}
.arc-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.arc-over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:22px;background:rgba(6,9,14,.76)}
.arc-over.on{display:flex}
.arc-over h3{margin:0 0 2px;font-size:19px}
#acCats{gap:6px}
.arc-note{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 14px 0;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);font-size:12px;color:var(--text-dim);line-height:1.5}
/* preview-only ("fullscreen") mode */
.hsplit.onlyprev>textarea,.hsplit.onlyprev .hdiv{display:none}
.hprev:fullscreen{background:#fff;border-radius:0}
.hv-exit{position:absolute;top:10px;right:10px;z-index:5;padding:7px 12px;border-radius:8px;border:1px solid rgba(0,0,0,.18);background:rgba(255,255,255,.94);color:#1c2029;font-size:12px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.28)}
.hv-exit:hover{background:#fff}
input[type=color]{-webkit-appearance:none;appearance:none;border:none;width:46px;height:34px;border-radius:8px;background:none;padding:0;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:1px solid var(--border);border-radius:8px}
.calhd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font-size:11px;color:var(--text-dim);text-align:center;margin-bottom:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .cd{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;font-size:12.5px;background:var(--surface-2);border:1px solid transparent;cursor:default}
.cal .cd:hover{background:var(--field-hover)}
.cal .cd.dim{opacity:.3}
.cal .cd.today{border-color:var(--accent)}
.cal .cd.has{background:var(--accent-soft);font-weight:700}
.cal .cd.sel{background:var(--accent);color:#fff}
video.cam{width:100%;border-radius:10px;background:#000;display:block}
.swatch-big{width:100%;height:96px;border-radius:11px;border:1px solid var(--border)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:12.5px;border-bottom:1px solid var(--border)}
.kv:last-child{border-bottom:none}

/* ============ FILES ============ */
.files{display:flex;flex:1;min-height:0}
.files-side{width:186px;flex:0 0 186px;background:var(--surface-2);border-right:1px solid var(--border);padding:8px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.fside{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:7px;font-size:12.5px;text-align:left;width:100%}
.fside:hover{background:var(--field-hover)}
.fside.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.files-main{flex:1;display:flex;flex-direction:column;min-width:0}
.crumbs{display:flex;align-items:center;gap:4px;padding:8px 12px;font-size:12.5px;color:var(--text-dim);border-bottom:1px solid var(--border);overflow:auto;white-space:nowrap}
.crumbs button{padding:3px 6px;border-radius:5px}
.crumbs button:hover{background:var(--field-hover);color:var(--text)}
.files-grid{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:6px;align-content:start}
.fitem{padding:12px 6px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;text-align:center;cursor:default}
.fitem:hover{background:var(--field-hover)}
.fitem.sel{background:var(--accent-soft)}
.fitem .ico{font-size:31px;line-height:1}
.fitem span{word-break:break-word;line-height:1.25;max-width:100%}
.statusbar{padding:5px 12px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-dim);background:var(--surface-2)}

/* ============ TERMINAL ============ */
.term{flex:1;background:#0a0d14;font-family:var(--mono);font-size:12.5px;color:#c8ffd4;padding:12px;overflow:auto;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.term .in{display:flex;gap:7px;align-items:baseline}
.term input{background:none;border:none;outline:none;color:#fff;font-family:var(--mono);font-size:12.5px;flex:1}
.term .p{color:#5eead4}
.term .err{color:#ff7b72}
.term .ok{color:#7ee787}

/* ============ NOTEPAD ============ */
.np-area{flex:1;width:100%;background:transparent;border:none;outline:none;resize:none;color:var(--text);font-family:var(--mono);font-size:13.5px;padding:14px;line-height:1.6}

/* ============ CALC ============ */
.calc{display:flex;flex-direction:column;height:100%;background:var(--surface-2)}
.calc-out{padding:22px 18px 14px;text-align:right}
.calc-out .expr{font-size:12px;color:var(--text-dim);min-height:16px;overflow:hidden}
.calc-out .val{font-size:40px;font-weight:300;overflow:hidden;text-overflow:ellipsis}
.calc-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border)}
.calc-grid button{background:var(--surface-solid);font-size:16px;transition:background .1s}
.calc-grid button:hover{background:var(--surface-3)}
.calc-grid button.op{color:#8ecbff}
.calc-grid button.eq{background:var(--accent);color:#fff}
.calc-grid button.eq:hover{filter:brightness(1.12)}

/* ============ SETTINGS / ACCENT PICKER ============ */
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;transition:transform .1s}
.sw:hover{transform:scale(1.12)}
.sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--surface-solid) inset}
.wallgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.wall{height:74px;border-radius:9px;border:2px solid transparent;background-size:cover;background-position:center;transition:transform .12s}
.wall:hover{transform:scale(1.03)}
.wall.on{border-color:var(--accent)}
.card{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:16px;display:flex;flex-direction:column;gap:6px}
.switch{width:42px;height:23px;border-radius:99px;background:var(--surface-3);position:relative;transition:background .15s;flex:0 0 42px;border:1px solid var(--border)}
.switch i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.switch.on{background:var(--accent)}
.switch.on i{transform:translateX(19px)}

/* ============ BROWSER ============ */
.brw{display:flex;flex-direction:column;flex:1;min-height:0}
.brw-frame{flex:1;border:none;background:#fff;width:100%}
.brw-home{flex:1;overflow:auto;display:flex;background:var(--surface-solid)}
.newtab{margin:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px;width:100%;max-width:640px}
.nt-clock{font-size:clamp(44px,9vw,68px);font-weight:300;letter-spacing:-2px;color:var(--text);font-variant-numeric:tabular-nums}
.nt-date{font-size:13.5px;color:var(--text-dim);margin-top:-12px}
.nt-search{display:flex;align-items:center;gap:10px;width:100%;background:var(--field);border:1px solid var(--border);border-radius:99px;padding:12px 18px;transition:border-color .15s,box-shadow .15s}
.nt-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.nt-search svg{width:18px;height:18px;color:var(--text-dim);flex:0 0 auto}
.nt-search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);font-size:14px;font-family:inherit}
.nt-links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.nt-link{padding:7px 15px;border-radius:99px;background:var(--field);border:1px solid var(--border);font-size:12.5px}
.nt-link:hover{background:var(--field-hover);border-color:var(--accent)}
.nt-note{margin-top:16px;font-size:11.5px;color:var(--text-dim);text-align:center;max-width:460px;line-height:1.55}
.brw-bar{display:flex;align-items:center;gap:10px;padding:6px 10px;font-size:11.5px;color:var(--text-dim);background:var(--surface-2);border-bottom:1px solid var(--border)}
.brw-bar .btn{margin-left:auto;padding:4px 10px;font-size:11.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.tile{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:16px;display:flex;flex-direction:column;gap:7px;align-items:flex-start;transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--accent)}
.tile .ico{font-size:24px}
.tile b{font-size:12.5px}
.tile small{color:var(--text-dim);font-size:11px}

/* ============ GAME HUB ============ */
.hub{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.hub-hero{background:linear-gradient(120deg,var(--accent),#7c5cff);border-radius:14px;padding:22px;color:#fff}
.hub-hero h1{margin:0 0 6px;font-size:24px}
.hub-hero p{margin:0;opacity:.9;font-size:13px}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gcard{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:9px;align-items:flex-start;transition:transform .12s,border-color .12s,box-shadow .12s}
.gcard:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 12px 28px rgba(0,0,0,.28)}
.gcard .ico{font-size:30px}
.gcard b{font-size:13.5px}
.gcard small{color:var(--text-dim);font-size:11px;line-height:1.4}

/* ============ PAINT ============ */
.paint{flex:1;display:flex;flex-direction:column;min-height:0}
.paint-canvas{flex:1;width:100%;cursor:crosshair;background:#fff;touch-action:none}
.swatchrow{display:flex;gap:5px;flex-wrap:wrap}
.csw{width:22px;height:22px;border-radius:5px;border:1px solid var(--border)}
.csw.on{outline:2px solid var(--accent);outline-offset:1px}

/* ============ SYNTH ============ */
.keys{display:flex;justify-content:center;gap:4px;padding:10px 14px 18px}
.key{width:44px;height:130px;background:linear-gradient(#fff,#e2e6ee);border-radius:7px;color:#333;font-size:11px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-weight:600;box-shadow:0 3px 0 #b9c0cd;transition:transform .05s}
.key:active,.key.on{transform:translateY(3px);box-shadow:0 0 0 #b9c0cd;background:linear-gradient(#d6e2ff,#b9ccf7)}
.key.black{background:linear-gradient(#2b2f3a,#111420);color:#ccc;height:82px;width:32px;margin:0 -18px;z-index:2}

/* ============ OVERLAY (shutdown) ============ */
#overlay{position:fixed;inset:0;z-index:8000;background:#05070c;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;color:#dfe6f5}
#overlay.on{display:flex}
.spinner{width:42px;height:42px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast-wrap{position:fixed;right:14px;bottom:calc(var(--tb-h) + 14px);z-index:950;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:10px;padding:11px 15px;font-size:12.5px;box-shadow:var(--shadow);animation:winIn .18s}
.toast b{color:var(--accent)}
.toast-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.toast-actions .btn{padding:5px 10px;font-size:11.5px}
/* ---- AI assistant privacy strip ---- */
.ai-privacy{display:flex;align-items:center;gap:10px;padding:7px 12px;border-top:1px solid var(--border);background:var(--surface-2);font-size:11.5px;color:var(--text-dim);line-height:1.45}

/* ============ CUSTOMISATION ============ */
body.no-acrylic .window,body.no-acrylic #taskbar,body.no-acrylic #startMenu,
body.no-acrylic #ctxMenu,body.no-acrylic .toast{
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:var(--surface-solid)
}
body.no-motion *,body.no-motion *::before,body.no-motion *::after{
  animation-duration:.001s!important;transition-duration:.001s!important
}
body.tb-top #taskbar{top:0;bottom:auto;border-top:none;border-bottom:1px solid var(--border)}
body.tb-top #desktop{inset:var(--tb-h) 0 0 0}
body.tb-top #taskview{inset:var(--tb-h) 0 0 0}
body.tb-top .toast-wrap{top:calc(var(--tb-h) + 14px);bottom:auto}
body.tb-top #startMenu{bottom:auto;top:calc(var(--tb-h) + 8px);transform:translateY(-20px)}
body.tb-top #startMenu.open{transform:translateY(0)}
body.tb-top #flyout{bottom:auto;top:calc(var(--tb-h) + 8px)}
body.icons-lg .dicon{width:100px}
body.icons-lg .dicon .ico{font-size:52px}
body.icons-lg .dicon .lbl{font-size:12.5px;max-width:96px}
body.icons-sm .dicon{width:72px;padding:5px 2px 3px}
body.icons-sm .dicon .ico{font-size:30px}
body.icons-sm .dicon .lbl{font-size:10.5px;max-width:68px}

/* ---- night light (warm screen tint) ---- */
body.night-light::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:linear-gradient(rgba(255,150,40,.30),rgba(255,120,0,.30));
  mix-blend-mode:multiply;
}
/* ---- compact density ---- */
body.compact .pad{padding:12px;gap:10px}
body.compact .card{padding:12px}
body.compact .toolbar{padding:5px 7px}
body.compact .sm-app{padding:10px 6px 8px}
body.compact .sm-app .ico{font-size:28px}
body.compact .dicon{padding:4px 3px 2px;gap:1px}
body.compact .files-grid{gap:3px;padding:8px}
body.compact .rowlab{padding:6px 0}
/* ---- high contrast ---- */
body.high-contrast{--border:rgba(255,255,255,.42);--text-dim:#e7edf8}
body[data-theme="light"].high-contrast{--border:rgba(0,0,0,.5);--text-dim:#333}
body.high-contrast .window{border-width:2px}
body.high-contrast .btn,body.high-contrast .field{border-color:rgba(255,255,255,.5)}
body.high-contrast .pin.active,body.high-contrast .taskitem.active{outline:2px solid var(--accent)}
/* ---- taskbar variants ---- */
body.tb-autohide #taskbar{transform:translateY(calc(100% - 3px));transition:transform .18s ease}
body.tb-autohide #taskbar:hover{transform:none}
body.tb-autohide.tb-top #taskbar{transform:translateY(calc(-100% + 3px))}
body.tb-autohide.tb-top #taskbar:hover{transform:none}
/* keep the bar fixed — position:relative here knocked it back into normal
   document flow, which parked it at the top of the page instead */
body.tb-center #taskbar{justify-content:center}
body.tb-center #tray{position:absolute;right:4px;top:0;bottom:0;margin-left:0}
body.tb-center #taskItems{flex:0 1 auto}
body.tb-nolabels .taskitem .tlabel{display:none}
body.tb-nolabels .taskitem{width:42px;padding:0;justify-content:center}
body.no-desktop-icons #icons{display:none}
/* ---- sharp corners (Personalization) ---- */
body.square .window,body.square #startMenu,body.square #flyout,body.square #taskview,
body.square .card,body.square .btn,body.square .field,body.square .sm-app,
body.square .chip,body.square .traybtn,body.square .pin,body.square .taskitem,
body.square .dicon,body.square .wall,body.square .console,body.square .term,
body.square .qa button{border-radius:2px!important}
/* ---- battery saver (Power modes): drop the expensive effects ---- */
body.power-saver #taskbar,body.power-saver .window,body.power-saver #startMenu,
body.power-saver #flyout,body.power-saver #taskview{
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:var(--surface-solid)
}
body.power-saver *{animation-duration:.001s!important;transition-duration:.001s!important;transition-property:none!important}
/* ---- wallpaper dim overlay (Personalization) ---- */
#desktop::after{
  content:'';position:absolute;inset:0;background:#000;pointer-events:none;z-index:0;
  opacity:var(--wall-dim,0);transition:opacity .25s
}
/* ---- range sliders (settings) ---- */
.rng{-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;background:var(--border);outline:none;cursor:pointer}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);border:2px solid var(--surface-2);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.rng::-moz-range-thumb{width:15px;height:15px;border:2px solid var(--surface-2);border-radius:50%;background:var(--accent);cursor:pointer}
.rng:focus-visible{box-shadow:0 0 0 3px var(--accent-soft)}
body.cursor-lg,body.cursor-lg *{
  cursor:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='30' height='30' viewBox='0 0 30 30'%3E%3Cpath d='M5 2l17 10.5-7 1.4L18 25l-3.8 1.4L10.6 15 5 20z' fill='white' stroke='black' stroke-width='1.6'/%3E%3C/svg%3E") 5 2,auto
}

/* ---- settings app (sidebar layout) ---- */
.settings-app{display:flex;flex:1;min-height:0}
.settings-nav{width:214px;flex:0 0 214px;background:var(--surface-2);border-right:1px solid var(--border);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.snav{text-align:left;padding:9px 12px;border-radius:7px;font-size:12.5px;color:var(--text);width:100%}
.snav:hover{background:var(--field-hover)}
.snav.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.settings-body{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:10px 0;border-bottom:1px solid var(--border)}
.srow:last-child{border-bottom:none}
.srow-l{font-size:13px}
.srow-h{font-size:11.5px;color:var(--text-dim);margin-top:2px;line-height:1.45}
.settings-body .card{gap:0}
.settings-body .card + .card{margin-top:2px}

/* ---- browser tabs ---- */
#bPages{flex:1;min-height:0;display:flex;flex-direction:column}
.tabpage{flex:1;min-height:0;display:none;flex-direction:column}
.tabpage.on{display:flex}
.tabstrip{display:flex;align-items:flex-end;gap:3px;padding:6px 6px 0;background:var(--surface-2);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabstrip::-webkit-scrollbar{display:none}
.btab{display:flex;align-items:center;gap:8px;max-width:200px;padding:7px 7px 7px 11px;border-radius:8px 8px 0 0;color:var(--text-dim);font-size:12px;white-space:nowrap;cursor:default;border:1px solid transparent;border-bottom:none}
.btab:hover{background:var(--field-hover)}
.btab.on{background:var(--surface-solid);color:var(--text);border-color:var(--border)}
.btab .t{overflow:hidden;text-overflow:ellipsis;max-width:140px}
.btab .x{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10px;color:var(--text-dim);flex:0 0 auto}
.btab .x:hover{background:#e81123;color:#fff}
.tabnew{width:30px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--text-dim);font-size:15px;margin-bottom:2px}
.tabnew:hover{background:var(--field-hover);color:var(--text)}

/* ---- Browser (legacy classes kept for the CDN loader) ---- */
/* ---- Local game loader ---- */
.drop-zone{margin-top:10px;padding:24px;border:2px dashed var(--border);border-radius:12px;text-align:center;font-size:12.5px;color:var(--text-dim);transition:border-color .15s,background .15s}
.drop-zone.over{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}

/* ---- desktop widgets ---- */
#widgets{position:absolute;inset:0;z-index:0;pointer-events:none}
.widget{position:absolute;pointer-events:auto;display:flex;flex-direction:column;overflow:hidden;
  background:var(--surface);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.34)}
.widget-bar{display:flex;align-items:center;gap:7px;padding:7px 7px 7px 11px;cursor:grab;border-bottom:1px solid var(--border);background:var(--surface-2)}
.widget-bar:active{cursor:grabbing}
.widget-ico{font-size:14px}
.widget-name{font-size:11.5px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.widget-x{width:20px;height:20px;border-radius:5px;font-size:11px;color:var(--text-dim);display:grid;place-items:center}
.widget-x:hover{background:#e81123;color:#fff}
.widget-body{flex:1;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.w-clock-time{font-size:34px;font-weight:300;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.w-clock-date{font-size:12px;color:var(--text-dim)}
.w-cal-head{font-size:12px;font-weight:600}
.w-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.w-cal-h{font-size:10px;color:var(--text-dim);text-align:center;padding:2px 0}
.w-cal-d{aspect-ratio:1;display:grid;place-items:center;border-radius:6px;font-size:11px}
.w-cal-d.today{background:var(--accent);color:#fff;font-weight:700}
.w-cal-d.dim{opacity:.3}
.w-note{flex:1;min-height:70px;background:var(--field);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);font-family:inherit;font-size:12.5px;resize:none;outline:none}
.w-todo{display:flex;flex-direction:column;gap:5px;flex:1;min-height:0;overflow:auto}
.w-todo-row{display:flex;align-items:center;gap:8px;font-size:12.5px}
.w-todo-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-todo-row.done span{text-decoration:line-through;color:var(--text-dim)}
.w-todo-row input{accent-color:var(--accent)}
.w-sys-row{display:flex;justify-content:space-between;font-size:12px}
.w-sys-row b{font-weight:600}
.w-quick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.w-quick button{background:var(--field);border:1px solid var(--border);border-radius:8px;padding:9px 6px;font-size:11.5px;color:var(--text)}
.w-quick button:hover{background:var(--field-hover);border-color:var(--accent)}
.w-ai-out{flex:1;min-height:56px;font-size:12px;background:var(--field);border-radius:8px;padding:8px;overflow:auto;line-height:1.5;white-space:pre-wrap}
.w-input{display:flex;gap:6px}
.w-input input{flex:1;min-width:0;background:var(--field);border:1px solid var(--border);border-radius:7px;padding:7px 9px;color:var(--text);font-size:12px;outline:none;font-family:inherit}

/* ---- Alt+Tab switcher ---- */
#alttab{position:fixed;inset:0 0 var(--tb-h) 0;z-index:700;display:none;align-items:center;justify-content:center;background:rgba(8,10,16,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#alttab.open{display:flex}
#alttab .alt-inner{display:flex;gap:12px;flex-wrap:wrap;max-width:82vw;justify-content:center}
.alt-card{display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:10px;background:var(--surface-solid);border:2px solid var(--border);color:var(--text);font-size:13px;box-shadow:var(--shadow)}
.alt-card.on{border-color:var(--accent);background:var(--surface-2);transform:scale(1.04)}
.alt-card .tico{font-size:22px}

/* ---- lock screen ---- */
#overlay .lockbox{display:flex;flex-direction:column;align-items:center;gap:16px}
#overlay .lockclock{font-size:52px;font-weight:300;letter-spacing:-1px}
#overlay .lockdate{color:#93a2c4;font-size:13px;margin-top:-12px}
#overlay .lockuser{display:flex;align-items:center;gap:10px;font-size:14px;color:#dfe6f5}

/* ---- first-run tour ---- */
#tour{position:fixed;inset:0;z-index:9600;display:none}
#tour.on{display:block}
#tourSpot{position:fixed;border-radius:10px;pointer-events:none;
  box-shadow:0 0 0 9999px rgba(4,7,14,.7),0 0 0 2px var(--accent);
  transition:left .24s cubic-bezier(.2,.8,.2,1),top .24s cubic-bezier(.2,.8,.2,1),
             width .24s cubic-bezier(.2,.8,.2,1),height .24s cubic-bezier(.2,.8,.2,1)}
#tourCard{position:fixed;width:min(370px,calc(100vw - 24px));padding:16px;
  background:var(--surface-solid);border:1px solid var(--border);border-radius:12px;
  box-shadow:0 24px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:9px;
  transition:left .22s ease,top .22s ease}
#tourCard h3{margin:0;font-size:15.5px}
#tourCard p{margin:0;font-size:12.5px;line-height:1.65;color:var(--text-dim)}
.tour-kicker{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--accent);font-weight:700}
#tourDots{display:flex;gap:5px;justify-content:center;padding:3px 0}
#tourDots i{width:6px;height:6px;border-radius:50%;background:var(--surface-3);display:block;transition:width .2s,background .2s}
#tourDots i.on{background:var(--accent);width:16px;border-radius:99px}
#tourBtns{display:flex;gap:8px;align-items:center}
#tourBtns .btn.primary{margin-left:auto}

@media (max-width:640px){
  .files-side{display:none}
  .dicon{width:78px}
  #tray .traybtn.hide-sm{display:none}
  #clock small{display:none}
  .key{width:34px;height:110px}
}
</style>
</head>
<body>

<!-- ================= BOOT ================= -->

  <div id="splash"></div>
  <div class="boot-bar"><i id="bootFill"></i></div>
  <div id="bootLog"></div>
</div>

<!-- ================= DESKTOP ================= -->

  <div id="widgets"></div>
  <div id="icons"></div>
  <div id="selbox"></div>
  <div id="notes"></div>
  <div id="windows"></div>
</div>
<div id="snapHint"></div>

<!-- ================= TASKBAR (Windows 10 style) ================= -->
<div id="taskbar">
  <button id="startBtn" title="Start"></button>
  <button class="tbicon" id="taskViewBtn" title="Task View"></button>
  <button class="tbicon" id="widgetsBtn" title="Widgets"></button>
  <div class="tb-sep"></div>
  <div id="pinned"></div>
  <div id="taskItems"></div>
  <div id="deskPager" title="Virtual desktops — Ctrl + Alt + 1…4"></div>
  <div id="tray">    <button class="traybtn" id="trayChevron" title="Show hidden icons"></button>
    <button class="traybtn hide-sm" id="trayNet" title="Network"></button>
    <button class="traybtn hide-sm" id="trayVol" title="Volume"></button>
    <button class="traybtn" id="trayBattery" title="Battery"></button>

</div>

  <h2>Task View</h2>

<!-- ================= START MENU ================= -->
<div id="startMenu">
  <div class="sm-top">
    <span class="sm-avatar" id="smAvatar">U</span>
    <div class="sm-search"><span id="smSearchIcon"></span><input id="smSearch" placeholder="Search apps, files and settings…" autocomplete="off" spellcheck="false"></div>
  </div>
  <div class="sm-head"><span id="smTitle">All apps</span><span class="muted" id="smCount"></span></div>

    <button class="sm-user"><span class="avatar" id="smAvatar">U</span><span id="smUser">User</span></button>

      <button id="btnLock" title="Lock">🔒</button>
      <button id="btnReboot" title="Restart">⟳</button>
      <button id="btnShutdown" title="Shut down">⏻</button>
    </div>
  </div>
</div>

<!-- ================= CONTEXT MENU ================= -->
<div id="ctxMenu"></div>

<div class="toast-wrap" id="toasts"></div>

<div id="overlay">
  <div class="spinner"></div>
  <div id="overlayText">Shutting down…</div>
  <button class="btn" id="overlayBack" style="display:none">Power on</button>
</div>

<!-- ================= COMMAND PALETTE (Ctrl+K) ================= -->
<div id="palette">
  <div class="pal-box">
    <input id="palInput" placeholder="Search apps, files, settings and commands…" autocomplete="off" spellcheck="false">
    <div id="palList"></div>
    <div class="pal-hint"><span>↑ ↓ choose</span><span>Enter run</span><span>Esc close</span><span style="margin-left:auto">Ctrl + K</span></div>
  </div>
</div>

<script>
/* =====================================================================
   uOS — a web operating system in one HTML file
   ===================================================================== */
'use strict';

/* ------------------------- tiny helpers ------------------------------ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function el(tag, attrs = {}, ...kids){
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)){
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
  }
  for (const kid of kids.flat()){
    if (kid === null || kid === undefined || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return n;
}
/* ------------------------- persistent storage ------------------------
   Everything is kept under "uos.<profile>.<key>" so profiles stay separate;
   which profile is active lives outside that namespace. Writes that fail
   (quota, private mode) are reported instead of vanishing silently.      */
const PROFILES_KEY = 'uos.__profiles';
const ACTIVE_KEY = 'uos.__active';
let __prefix = (function(){
  try { return 'uos.' + (localStorage.getItem(ACTIVE_KEY) || 'default') + '.'; }
  catch(e){ return 'uos.default.'; }
})();
const store = {
  ok: true,
  lastError: '',
  prefix(){ return __prefix; },
  useProfile(id){ __prefix = 'uos.' + id + '.'; try { localStorage.setItem(ACTIVE_KEY, id); } catch(e){} },
  key(k){ return __prefix + k; },
  profileId(){ return __prefix.replace(/^uos\./, '').replace(/\.$/, ''); },
  get(k, d){ try { const v = localStorage.getItem(store.key(k)); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){
    try { localStorage.setItem(store.key(k), JSON.stringify(v)); store.ok = true; return true; }
    catch(err){
      store.ok = false;
      store.lastError = (err && err.name) ? err.name : 'write failed';
      if (typeof onStorageFull === 'function') onStorageFull();
      return false;
    }
  }
};
/* ------- how much room uOS is using (the whole localStorage origin) ---- */
const STORAGE_BUDGET = 4.5 * 1024 * 1024;
function storageUsage(){
  let chars = 0, keys = 0;
  try { for (const k in localStorage) if (k.indexOf('uos.') === 0){ chars += (localStorage[k] || '').length; keys++; } } catch(e){}
  return { chars: chars, keys: keys, bytes: chars * 2 };
}
function storageFullness(){ return Math.max(0, Math.min(1, storageUsage().bytes / STORAGE_BUDGET)); }
function bytesText(n){ return n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(2) + ' MB'; }
function storageBreakdown(){
  const byName = {};
  try {
    for (const k in localStorage){
      if (k.indexOf('uos.') !== 0) continue;
      if (k === PROFILES_KEY || k === ACTIVE_KEY) continue;
      const m = k.match(/^uos\.([^.]+)\.(.+)$/);
      const name = m ? m[2] : k.replace(/^uos\./, '');
      byName[name] = (byName[name] || 0) + (localStorage[k] || '').length;
    }
  } catch(e){}
  return Object.keys(byName).map(name => ({ name: name, chars: byName[name] })).sort((a, b) => b.chars - a.chars);
}
function onStorageFull(){
  if (onStorageFull.raised) return;
  onStorageFull.raised = true;
  setTimeout(() => {
    notify('Storage full', 'uOS could not save your last change. Free some space or export a backup.', [
      { label: 'Open Storage settings', act: () => openApp('settings', { section: 'Storage' }) },
      { label: 'Export a backup', act: () => exportBackup() }
    ]);
  }, 60);
}
/* warn early, while there is still room to do something about it */
function storageCheck(){
  const f = storageFullness();
  if (f < 0.8) return;
  notify('Storage almost full', Math.round(f * 100) + '% of the room uOS can use is taken. Consider exporting a backup and clearing something.',
    [ { label: 'Storage settings', act: () => openApp('settings', { section: 'Storage' }) },
      { label: 'Export backup', act: () => exportBackup() } ]);
}
/* export everything as a JSON file (used by Settings and the warning above) */
function exportBackup(){
  const data = { uos: UOS_VERSION, at: new Date().toISOString(), profile: store.prefix(), settings: settings, fs: FS,
                 notes: store.get('stickies', []), calendar: store.get('calendar', {}),
                 clipboard: CLIPBOARD, trash: TRASH, apps: store.get('myapps', []), scores: store.get('arcadeScores', {}),
                 chips: chipsGet() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'uos-backup.json';
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('Backup', 'Exported uos-backup.json');
}

/* ---- one-time migration into the profile namespace -------------------
   Older builds stored everything as "uos.<key>". If that is all we find,
   copy it under the default profile so nothing appears to vanish.      */
function migrateProfiles(){
  let legacy = [];
  try {
    for (const k in localStorage){
      if (k.indexOf('uos.') !== 0) continue;
      if (k === PROFILES_KEY || k === ACTIVE_KEY) continue;

   zip name always follow the build. Bump this when you ship.

const UOS_VERSION = '3.1';
const UOS_REPO = 'mumbo235/uOS';
const UOS_RELEASES = 'https://github.com/' + UOS_REPO + '/releases';

function versionParts(v){ return String(v).replace(/^v/i, '').split('.').map(n => parseInt(n, 10) || 0); }
function versionNewer(candidate, current){
  const a = versionParts(candidate), b = versionParts(current);
  for (let i = 0; i < Math.max(a.length, b.length); i++){
    const x = a[i] || 0, y = b[i] || 0;
    if (x !== y) return x > y;
  }

}
async function fetchLatestRelease(){
  const r = await fetch('https://api.github.com/repos/' + UOS_REPO + '/releases/latest', {
    headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store'
  });
  if (!r.ok) throw new Error('GitHub returned ' + r.status);
  const d = await r.json();

}
/* result of the last check, for the About / Settings screens */
function updateStatus(){
  const at = store.get('updateCheckedAt', 0);
  if (!at) return { text: 'Not checked yet', newer: false };
  const when = new Date(at).toLocaleString();
  const err = store.get('updateError', '');
  if (err) return { text: 'Could not check (' + err + ') · ' + when, newer: false };
  const tag = store.get('updateLatest', '');
  if (!tag) return { text: 'Last checked ' + when, newer: false };
  if (versionNewer(tag, UOS_VERSION)) return { text: 'Update available: ' + tag + ' · checked ' + when, newer: true, tag: tag, url: UOS_RELEASES + '/tag/' + tag };
  return { text: 'Up to date — you have ' + UOS_VERSION + ' · checked ' + when, newer: false, tag: tag };
}
async function checkForUpdate(opts){

    const latest = await fetchLatestRelease();
    store.set('updateCheckedAt', Date.now());
    store.set('updateError', '');
    store.set('updateLatest', latest.tag);
    store.set('updateURL', latest.url);
    const newer = versionNewer(latest.tag, UOS_VERSION);
    if (newer){
      const seen = 'updateSeen-' + latest.tag;
      if (manual || !store.get(seen, false)){
        store.set(seen, true);
        notify('Update available', 'uOS ' + String(latest.tag).replace(/^v/i, '') + ' is out — you have ' + UOS_VERSION, [
          { label: 'Release notes ↗', act: () => window.open(latest.url, '_blank') }
        ]);
      }
      if (manual) window.open(latest.url, '_blank');
    } else if (manual){
      toast('Updates', 'uOS ' + UOS_VERSION + ' is the latest version');
    }
    return { ok: true, newer: newer, latest: latest };
  } catch (e){
    store.set('updateCheckedAt', Date.now());
    store.set('updateError', String((e && e.message) || e));
    if (manual) toast('Updates', 'Could not check — offline, or the request was blocked');
    return { ok: false, error: String((e && e.message) || e) };
  }
}

/* =====================================================================
   BIG-FILE VAULT (IndexedDB)
   localStorage only holds a few megabytes, so anything larger (a big
   single-file app, say) is kept here instead. Contents are held as plain
   text; nothing is uploaded anywhere.
   ===================================================================== */
const vault = {
  THRESHOLD: 1200000,           // characters that still fit comfortably in localStorage
  db: null,
  open(){
    if (vault.db) return Promise.resolve(vault.db);
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('no IndexedDB'));
      const rq = indexedDB.open('uosvault-' + store.profileId(), 1);
      rq.onupgradeneeded = () => { if (!rq.result.objectStoreNames.contains('files')) rq.result.createObjectStore('files'); };
      rq.onsuccess = () => { vault.db = rq.result; res(vault.db); };
      rq.onerror = () => rej(rq.error || new Error('indexedDB failed'));
    });
  },
  put(key, text){
    return vault.open().then(db => new Promise((res, rej) => {
      const tx = db.transaction('files', 'readwrite');
      tx.objectStore('files').put(text, key);
      tx.oncomplete = () => res(true);
      tx.onerror = () => rej(tx.error);
    }));
  },
  get(key){
    return vault.open().then(db => new Promise((res, rej) => {
      const rq = db.transaction('files', 'readonly').objectStore('files').get(key);
      rq.onsuccess = () => res(rq.result == null ? null : rq.result);
      rq.onerror = () => rej(rq.error);
    }));
  },
  del(key){
    return vault.open().then(db => new Promise(res => {
      const tx = db.transaction('files', 'readwrite');
      tx.objectStore('files').delete(key);
      tx.oncomplete = () => res(true);
      tx.onerror = () => res(false);
    })).catch(() => false);
  },
  keys(){
    return vault.open().then(db => new Promise(res => {
      const rq = db.transaction('files', 'readonly').objectStore('files').getAllKeys();
      rq.onsuccess = () => res(rq.result || []);
      rq.onerror = () => res([]);
    })).catch(() => []);
  }

  const next = Math.max(60, Math.min(160, (Number(settings.zoom) || 100) + delta));
  if (next === (Number(settings.zoom) || 100)) return;
  settings.zoom = next;
  saveSettings();
  toast('Zoom & scale', 'Interface scale ' + next + '%');
}
