  };
}
let FS = store.get('fs', null) || makeFS();
const saveFS = () => store.set('fs', FS);
function fsList(dir){
  const pre = dir === '/' ? '' : dir + '/';
  const seen = new Set(), out = [];
  for (const [path, node] of Object.entries(FS)){
    if (!path.startsWith(pre)) continue;
    const rest = path.slice(pre.length);
    if (!rest) continue;
    const seg = rest.split('/')[0];
    if (seen.has(seg)) continue;
    seen.add(seg);
    const isDir = rest.includes('/') || node.type === 'dir';
    out.push({ name: seg, type: isDir ? 'dir' : 'file', path: pre + seg });
  }
  return out.sort((a,b) => (a.type === b.type ? a.name.localeCompare(b.name) : a.type === 'dir' ? -1 : 1));
}
function fsExists(p){ return !!FS[p] || Object.keys(FS).some(k => k.startsWith(p + '/')); }
function fsWrite(p, content){ FS[p] = { type:'file', content }; saveFS(); }
function fsMkdir(p){ FS[p] = { type:'dir' }; saveFS(); }
function fsDelete(p){
  delete FS[p];
  for (const k of Object.keys(FS)) if (k.startsWith(p + '/')) delete FS[k];
  saveFS();
}
const fileIcon = (n, t) => t === 'dir' ? '📁' : /\.(png|jpe?g|gif|webp|svg)$/i.test(n) ? '🖼️'
  : /\.(mp3|wav|ogg)$/i.test(n) ? '🎵' : /\.(js|json|html|css)$/i.test(n) ? '📜' : '📄';

/* ---- interface scale helpers -------------------------------------------
   The Personalization "UI scale" multiplies every measured rectangle and the
   reported innerWidth/innerHeight, but windows, icons, widgets and menus are
   all positioned in unscaled CSS pixels. These helpers convert a measurement
   back into that space so nothing jumps or lands off-screen at zoom ≠ 100%. */
function zoomScale(){
  const z = parseFloat(document.documentElement.style.zoom);
  return z > 0 ? z : 1;
}
function VW(){ return innerWidth / zoomScale(); }
function VH(){ return innerHeight / zoomScale(); }
function cssRect(el){
  const r = el.getBoundingClientRect(), z = zoomScale();
  return { left: r.left / z, top: r.top / z, width: r.width / z, height: r.height / z,
           right: r.right / z, bottom: r.bottom / z };
}

/* ---------------- window memory + session restore -------------------
   Each app remembers where and how big its window was, and the set of
   open windows is saved so a reload can bring your session back.       */
let winMem = store.get('winMem', {}) || {};
/* geometry from the style where possible: an in-flight CSS animation can
   offset getBoundingClientRect, and style values are what we set anyway */
function winRect(win){
  if (win.maximized && win.prevRect) return { x: Math.round(win.prevRect.left), y: Math.round(win.prevRect.top), w: Math.round(win.prevRect.width), h: Math.round(win.prevRect.height) };
  const s = win.el.style;
  const x = parseFloat(s.left), y = parseFloat(s.top), w = parseFloat(s.width), h = parseFloat(s.height);
  if (isFinite(x) && isFinite(y) && isFinite(w) && isFinite(h)) return { x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(h) };
  const r = cssRect(win.el);
  return { x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height) };
}
function rememberWin(win){
  if (!win || !win.el || !win.el.isConnected) return;
  winMem[win.appId] = winRect(win);
  store.set('winMem', winMem);
  if (typeof saveSession === 'function') saveSession();
}
function smallArgs(args){
  if (!args) return null;
  const out = {};
  for (const k of Object.keys(args)){
    if (k.indexOf('__') === 0 || k === 'text') continue;     // never persist big payloads
    out[k] = args[k];
  }
  try { return JSON.stringify(out).length > 400 ? null : out; } catch(e){ return null; }
}
let __sessT = null;
function saveSession(now){
  const write = () => {
    const list = [];
    windows.forEach(w => {
      if (!w.el || !w.el.isConnected) return;
      list.push({ appId: w.appId, args: smallArgs(w.args), max: !!w.maximized, desk: deskOf(w), rect: winRect(w) });
    });
    store.set('session', list);
  };
  clearTimeout(__sessT);
  if (now){ write(); return; }
  __sessT = setTimeout(write, 350);          // debounce bursts of changes
}
/* a reload or a closed tab should still remember the session */
window.addEventListener('beforeunload', () => { try { saveSession(true); } catch(e){} });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden'){ try { saveSession(true); } catch(e){} } });
function restoreSession(){
  if (!settings.restoreSession) return;
  const sess = store.get('session', null);
  if (!sess || !sess.length) return;
  sess.forEach(s => {
    if (!s || !APPS[s.appId]) return;
    try {
      const box = openApp(s.appId, Object.assign({}, s.args || {}, { __rect: s.rect, __desk: s.desk }));
      if (box && s.max && !box.maximized) toggleMax(box);
    } catch(e){}
  });
}

/* ---------------- virtual desktops ----------------------------------
   Windows live on one of four desktops; only the current one is shown.
   Ctrl+Alt+1…4 switch, Ctrl+Alt+Shift+1…4 move the active window.      */
const DESK_COUNT = 4;
let curDesk = Math.max(0, Math.min(DESK_COUNT - 1, Number(store.get('deskIndex', 0)) || 0));
const deskOf = win => Math.max(0, Math.min(DESK_COUNT - 1, win && win.desk != null ? win.desk : 0));
function paintDesks(){
  windows.forEach(w => {
    const on = deskOf(w) === curDesk;
    if (w.el) w.el.classList.toggle('offdesk', !on);
    if (w.taskEl) w.taskEl.classList.toggle('offdesk', !on);
  });
  $$('#deskPager .desk-dot').forEach((d, i) => d.classList.toggle('on', i === curDesk));
}
function buildDeskPager(){
  const p = $('#deskPager');
  if (!p) return;
  p.innerHTML = '';
  for (let i = 0; i < DESK_COUNT; i++){
    const d = el('button', { class: 'desk-dot' + (i === curDesk ? ' on' : ''), title: 'Desktop ' + (i + 1) }, String(i + 1));
    d.onclick = () => switchDesk(i);
    p.append(d);
  }
}
function switchDesk(n){
  const next = Math.max(0, Math.min(DESK_COUNT - 1, n));
  if (next === curDesk) return;
  curDesk = next;
  store.set('deskIndex', curDesk);
  paintDesks();
  toast('Desktop', 'Desktop ' + (curDesk + 1));
}
function moveWinToDesk(win, n){
  if (!win) return;
  win.desk = Math.max(0, Math.min(DESK_COUNT - 1, n));
  paintDesks();
  saveSession(true);
  toast('Windows', (win.app && win.app.name ? win.app.name : 'Window') + ' → desktop ' + (win.desk + 1));
}
function moveMenu(win){
  showContext(showContext.lastX || 300, showContext.lastY || 300, [0,1,2,3].map(i => ({
    label: (deskOf(win) === i ? '✓ ' : '') + 'Desktop ' + (i + 1),
    act: () => moveWinToDesk(win, i)
  })));
}

/* ------------------------------ window manager ---------------------- */
const windows = new Map();      // id -> win
let activeWin = null, zTop = 100;

function createWindow(appId, app, args = {}){
  const id = uid();
  /* remembered geometry: an explicit restore wins, else the app's last size */
  const remembered = args.__rect || winMem[appId] || null;
  const win = {
    id, appId, app, args: args, el: null, body: null, taskEl: null, startedAt: Date.now(),
    cleanup: null, minimized: false, maximized: false, prevRect: null,
    desk: (args.__desk != null ? Math.max(0, Math.min(DESK_COUNT - 1, args.__desk)) : curDesk)
  };

  /* never open a window larger than the screen can show */
  const wantW = remembered && remembered.w ? remembered.w : (app.w || 720);
  const wantH = remembered && remembered.h ? remembered.h : (app.h || 500);
  const w = Math.max(300, Math.min(wantW, VW() - 16));
  const h = Math.max(220, Math.min(wantH, VH() - TB() - 16));
  const x = remembered
    ? clamp(Math.round(remembered.x), -80, Math.max(8, VW() - 80))
    : clamp(Math.round((VW() - w) / 2) + ((windows.size % 5) - 2) * 26, 8, Math.max(8, VW() - w - 8));
  const y = remembered
    ? clamp(Math.round(remembered.y), 0, Math.max(6, VH() - TB() - 60))
    : clamp(Math.round((VH() - TB() - h) / 2) + ((windows.size % 5) - 2) * 22, 6, Math.max(6, VH() - TB() - h - 6));

  const node = el('div', { class: 'window' });
  node.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:${++zTop}`;
  node.innerHTML = `
    <div class="titlebar">
      <div class="tb-left"><span class="tb-icon"></span><span class="tb-title"></span></div>
      <div class="win-ctrls">
        <button class="wc min" title="Minimize">&#8211;</button>
        <button class="wc max" title="Maximize">&#9723;</button>
        <button class="wc close" title="Close">&#10005;</button>
      </div>
    </div>
    <div class="win-body"></div>
    ${['n','s','e','w','ne','nw','se','sw'].map(d => `<div class="rs ${d}" data-dir="${d}"></div>`).join('')}
  `;
  $('.tb-icon', node).innerHTML = iconHTML(appId, app.icon);
  $('.tb-title', node).textContent = app.name;
  win.el = node;
  win.body = $('.win-body', node);
  $('#windows').append(node);

  // ----- events
  node.addEventListener('pointerdown', () => focusWin(win), true);
  $('.wc.min', node).addEventListener('click', () => minimizeWin(win));
  $('.wc.max', node).addEventListener('click', () => toggleMax(win));
  $('.wc.close', node).addEventListener('click', () => closeWin(win));
  $('.titlebar', node).addEventListener('dblclick', e => { if (!e.target.closest('.win-ctrls')) toggleMax(win); });
  makeDraggable(win);
  makeResizable(win);

  // ----- taskbar button (pinned apps reuse their pinned button)
  attachTaskEl(win);

  // ----- mount app
  try { win.cleanup = app.mount(win.body, win, args) || null; }
  catch (err){ win.body.innerHTML = '<div class="empty">App crashed: ' + err.message + '</div>'; console.error(err); }

  windows.set(id, win);
  focusWin(win);
  addRecent(appId);
  if (settings.openMaximised) toggleMax(win);
  uiSound('open');
  saveSession(true);
  return win;
}

function focusWin(win){
  if (activeWin === win && !win.minimized) return;
  if (activeWin) { activeWin.el.classList.remove('active'); activeWin.taskEl.classList.remove('active'); }
  activeWin = win;
  win.el.classList.add('active');
  win.taskEl.classList.add('active');
  win.el.style.zIndex = ++zTop;
  win.minimized = false;
  win.el.classList.remove('min');
  setTimeout(() => { try { if (win.body.__focus) win.body.__focus.focus(); } catch(e){} }, 0);
}
function minimizeWin(win){
  win.minimized = true;
  win.el.classList.add('min');
  win.el.classList.remove('active');
  win.taskEl.classList.remove('active');
  if (activeWin === win) activeWin = null;
  saveSession(true);
}
function restoreWin(win){
  win.minimized = false;
  win.el.classList.remove('min');
  focusWin(win);
  saveSession(true);
}
function toggleMax(win){
  if (win.maximized){
    const r = win.prevRect;
    Object.assign(win.el.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
    win.el.classList.remove('maximized');
    win.maximized = false;
  } else {
    const r = winRect(win);             // from the style: immune to animation offsets
    win.prevRect = { left: r.x, top: r.y, width: r.w, height: r.h };
    win.el.style.cssText = `left:0;top:0;width:100%;height:100%;z-index:${win.el.style.zIndex}`;
    win.el.classList.add('maximized');
    win.maximized = true;
  }
  if (win.onResize) win.onResize();
  saveSession(true);
}
function closeWin(win){
  try { if (win.cleanup) win.cleanup(); } catch(e){}
  const wasPin = win.taskEl && win.taskEl.classList.contains('pin');
  rememberWin(win);
  win.el.remove();
  windows.delete(win.id);
  saveSession(true);
  if (wasPin){
    win.taskEl.classList.remove('active');
    if (![...windows.values()].some(w => w.appId === win.appId)) win.taskEl.classList.remove('has-task');
  } else if (win.taskEl) win.taskEl.remove();
  if (activeWin === win) activeWin = null;
  uiSound('close');
}
function closeAll(){ [...windows.values()].forEach(closeWin); }

function makeDraggable(win){
  const bar = $('.titlebar', win.el);
  let snap = null;
  bar.addEventListener('pointerdown', e => {
    if (e.target.closest('.win-ctrls') || e.button !== 0) return;
    focusWin(win);
    if (win.maximized){
      // un-maximize: keep window under cursor proportionally
      const r = cssRect(win.el);
      const relX = (e.clientX - r.left) / r.width;
      toggleMax(win);
      const nr = cssRect(win.el);
      win.el.style.left = clamp(e.clientX - nr.width * relX, -nr.width + 100, VW() - 80) + 'px';
      win.el.style.top = Math.max(0, e.clientY - 19) + 'px';
    }
    const r = cssRect(win.el);
    const ox = e.clientX - r.left, oy = e.clientY - r.top;
    try { bar.setPointerCapture(e.pointerId); } catch(err){}
    const move = ev => {
      let nx = ev.clientX - ox, ny = ev.clientY - oy;
      nx = clamp(nx, -r.width + 90, VW() - 70);
      ny = clamp(ny, 0, VH() - 90);
      win.el.style.left = nx + 'px';
      win.el.style.top = ny + 'px';
      // edge snap hint
      const hint = $('#snapHint');
      snap = null;
      if (settings.snap){
        if (ev.clientY <= 4) snap = { x:0, y:0, w:VW(), h:VH() - TB() };
        else if (ev.clientX <= 4) snap = { x:0, y:0, w:VW() / 2, h:VH() - TB() };
        else if (ev.clientX >= VW() - 4) snap = { x:VW() / 2, y:0, w:VW() / 2, h:VH() - TB() };
      }
      if (snap){
        hint.style.display = 'block';
        Object.assign(hint.style, { left:snap.x + 'px', top:snap.y + 'px', width:snap.w + 'px', height:snap.h + 'px' });
      } else hint.style.display = 'none';
    };
    const up = () => {
      bar.removeEventListener('pointermove', move);
      bar.removeEventListener('pointerup', up);
      $('#snapHint').style.display = 'none';
      if (snap){
        win.prevRect = { left: r.left, top: r.top, width: r.width, height: r.height };
        win.el.style.cssText = `left:${snap.x}px;top:${snap.y}px;width:${snap.w}px;height:${snap.h}px;z-index:${win.el.style.zIndex}`;
        win.maximized = snap.w === VW() && snap.h === VH() - TB();
        win.el.classList.toggle('maximized', win.maximized);
        if (win.onResize) win.onResize();
      }
      rememberWin(win);
    };
    bar.addEventListener('pointermove', move);
    bar.addEventListener('pointerup', up);
  });
}
function makeResizable(win){
  $$('.rs', win.el).forEach(handle => {
    handle.addEventListener('pointerdown', e => {
      e.stopPropagation();
      if (win.maximized) return;
      focusWin(win);
      const dir = handle.dataset.dir;
      const r = cssRect(win.el);
      try { handle.setPointerCapture(e.pointerId); } catch(err){}
      const move = ev => {
        let { clientX: cx, clientY: cy } = ev;
        let L = r.left, T = r.top, W = r.width, H = r.height;
        if (dir.includes('e')) W = clamp(cx - r.left, 260, VW() - r.left);
        if (dir.includes('s')) H = clamp(cy - r.top, 150, VH() - TB() - r.top);
        if (dir.includes('w')){ W = clamp(r.right - cx, 260, r.right); L = r.right - W; }
        if (dir.includes('n')){ H = clamp(r.bottom - cy, 150, r.bottom); T = r.bottom - H; }
        Object.assign(win.el.style, { left:L + 'px', top:T + 'px', width:W + 'px', height:H + 'px' });
        if (win.onResize) win.onResize();
      };
      const up = () => { handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', up); rememberWin(win); };
      handle.addEventListener('pointermove', move);
      handle.addEventListener('pointerup', up);
    });
  });
}
/* Focus a container when clicked, and route arrow keys from scrolling */
function bindKeys(host, handler){
  host.tabIndex = 0;
  host.style.outline = 'none';
  host.__focus = host;
  host.addEventListener('keydown', e => {
    if (handler(e) === true){ e.preventDefault(); e.stopPropagation(); }
  });
  host.addEventListener('pointerdown', () => { try { host.focus({ preventScroll: true }); } catch(err){} });
}

APPS.files = {
  name: 'Files', icon: '📁', w: 800, h: 540,
  mount(body){
    let cwd = 'Desktop', selected = new Set(), lastIdx = null, order = [];
    body.innerHTML = `
      <div class="toolbar">
        <button class="btn" id="back">←</button><button class="btn" id="up">↑</button>
        <div class="sep"></div>
        <button class="btn" id="nFolder">＋ Folder</button>
        <button class="btn" id="nFile">＋ File</button>
        <div class="sep"></div>
        <button class="btn danger" id="del">🗑 Delete</button>
        <div class="sep"></div>
        <span class="muted" id="fInfo" style="font-size:12px"></span>
      </div>
      <div class="files">
        <div class="files-side" id="side"></div>
        <div class="files-main">
          <div class="crumbs" id="crumbs"></div>
          <div class="files-grid" id="grid"></div>
          <div class="statusbar" id="status"></div>
        </div>
      </div>`;
    const grid = $('#grid', body), history = [];

    const places = [['🖥️','This PC','/'],['🖥️','Desktop','Desktop'],['📄','Documents','Documents'],
      ['⬇️','Downloads','Downloads'],['🖼️','Pictures','Pictures'],['🎵','Music','Music'],['📦','Projects','Projects']];
    function side(){
      $('#side', body).innerHTML = places.map(([i, n, p]) =>
        `<button class="fside ${cwd === p ? 'active' : ''}" data-p="${p}"><span>${i}</span>${n}</button>`).join('');
      $$('.fside', body).forEach(b => b.onclick = () => go(b.dataset.p));
    }
    function crumbs(){
      const parts = cwd === '/' ? [] : cwd.split('/');
      const c = $('#crumbs', body);
      c.innerHTML = '';
      const root = el('button', {}, '🖥️ This PC'); root.onclick = () => go('/'); c.append(root);
      let acc = '';
      parts.forEach(p => {
        acc = acc ? acc + '/' + p : p;
        c.append(el('span', {}, '›'));
        const b = el('button', {}, p); b.onclick = () => go(acc); c.append(b);
      });
    }
    let itemCount = 0;
    /* repaint selection in place — never re-render here, or dblclick would never fire */
    function paintSelection(){
      $$('.fitem', grid).forEach(n => n.classList.toggle('sel', selected.has(n.dataset.path)));
      $('#status', body).textContent = itemCount + ' item(s)' + (selected.size ? ' — ' + selected.size + ' selected' : '');
    }
    function render(){
      side(); crumbs();
      const items = cwd === '/' ? places.slice(1).map(([i,n,p]) => ({ name:n, type:'dir', path:p })) : fsList(cwd);
      order = items.map(it => it.path);
      itemCount = items.length;
      grid.innerHTML = '';
      if (!items.length) grid.innerHTML = '<div class="empty">This folder is empty</div>';
      items.forEach((it, idx) => {
        const node = el('div', { class: 'fitem' + (selected.has(it.path) ? ' sel' : ''), 'data-path': it.path },
          el('div', { class: 'ico' }, fileIcon(it.name, it.type)),
          el('span', {}, it.name));
        node.addEventListener('click', e => {
          if (e.ctrlKey || e.metaKey){ selected.has(it.path) ? selected.delete(it.path) : selected.add(it.path); lastIdx = idx; }
          else if (e.shiftKey && lastIdx !== null){ selected = new Set(order.slice(Math.min(lastIdx, idx), Math.max(lastIdx, idx) + 1)); }
          else { selected = new Set([it.path]); lastIdx = idx; }
          paintSelection();
        });
        node.addEventListener('dblclick', e => { e.preventDefault(); open(it); });
        node.addEventListener('contextmenu', e => {
          e.preventDefault(); e.stopPropagation();
          if (!selected.has(it.path)) selected = new Set([it.path]);
          render();
          showContext(e.clientX, e.clientY, [
            { label: 'Open', act: () => open(it) },
            { label: 'Open with…', act: () => pickOpenWith(it.path) },
            { label: 'Set default app…', act: () => pickDefaultFor(it.path) },
            { sep: true },
            { label: 'Rename', act: () => {
                const nn = prompt('New name:', it.name); if (!nn) return;
                const np = (cwd === '/' ? '' : cwd + '/') + nn;
                FS[np] = FS[it.path]; delete FS[it.path];
                for (const k of Object.keys(FS)) if (k.startsWith(it.path + '/')){ FS[np + k.slice(it.path.length)] = FS[k]; delete FS[k]; }
                saveFS(); selected = new Set([np]); render();
              } },
            { sep: true },
            { label: selected.size > 1 ? 'Delete ' + selected.size + ' items' : 'Delete', danger: true,
              act: () => { selected.forEach(p => trashAdd(p)); selected = new Set(); render(); } }
          ]);
        });
        grid.append(node);
      });
      paintSelection();
      $('#fInfo', body).textContent = cwd;
    }
    function open(it){
      if (it.type === 'dir'){ go(it.path); return; }
      openPath(it.path);
    }
    function go(p){ if (cwd !== p || history.length === 0) history.push(cwd); cwd = p === '/' ? '/' : p.replace(/\/+$/,''); selected = new Set(); lastIdx = null; render(); }
    $('#back', body).onclick = () => { if (history.length) { cwd = history.pop(); selected = new Set(); lastIdx = null; render(); } };
    $('#up', body).onclick = () => { if (cwd === '/') return; go(cwd.includes('/') ? cwd.split('/').slice(0,-1).join('/') : '/'); };
    $('#nFolder', body).onclick = () => {
      const n = prompt('Folder name:'); if (!n) return;
      const p = (cwd === '/' ? '' : cwd + '/') + n; fsMkdir(p); render();
    };
    $('#nFile', body).onclick = () => {
      const n = prompt('File name:', 'untitled.txt'); if (!n) return;
      const p = (cwd === '/' ? '' : cwd + '/') + n; fsWrite(p, ''); selected = new Set([p]); render();
    };
    $('#del', body).onclick = () => {
      if (!selected.size) return toast('Files', 'Select something first.');
      const n = selected.size;
      selected.forEach(p => trashAdd(p));
      selected = new Set(); render();
      toast('Files', 'Moved ' + n + ' item(s) to Recycle Bin');
    };
    /* marquee drag-select inside the grid */
    grid.addEventListener('pointerdown', e => {
      if (e.button !== 0 || e.target !== grid) return;
      const additive = e.ctrlKey || e.metaKey || e.shiftKey;
      if (!additive) selected = new Set();
      const keep = new Set(selected);
      const box = el('div');
      box.style.cssText = 'position:fixed;border:1px solid var(--accent);background:var(--accent-soft);border-radius:2px;pointer-events:none;z-index:5';
      document.body.append(box);
      const sx = e.clientX, sy = e.clientY;
      const move = ev => {
        const x = Math.min(sx, ev.clientX), y = Math.min(sy, ev.clientY), w = Math.abs(ev.clientX - sx), h = Math.abs(ev.clientY - sy);
        Object.assign(box.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
        selected = new Set(keep);
        $$('.fitem', grid).forEach(node => {
          const b = node.getBoundingClientRect();
          if (!(b.right < x || b.left > x + w || b.bottom < y || b.top > y + h)) selected.add(node.dataset.path);
          node.classList.toggle('sel', selected.has(node.dataset.path));
        });
      };
      const up = () => {
        box.remove();
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        render();
      };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });
    grid.addEventListener('contextmenu', e => {
      if (e.target !== grid) return;
      e.preventDefault();
      showContext(e.clientX, e.clientY, [
        { label:'New folder', act: () => $('#nFolder', body).click() },
        { label:'New text file', act: () => $('#nFile', body).click() },
        { sep:true },
        { label:'Refresh', act: render }
      ]);
    });
    body.__refresh = render;
    render();
  }
};

APPS.calc = {
  name: 'Calculator', icon: '🧮', w: 320, h: 460, single: true,
  mount(body){
    body.innerHTML = `
      <div class="calc">
        <div class="calc-out"><div class="expr"></div><div class="val">0</div></div>
        <div class="calc-grid"></div>
      </div>`;
    const valEl = $('.val', body), exprEl = $('.expr', body), grid = $('.calc-grid', body);
    let cur = '0', prev = null, op = null, fresh = true;
    const keys = [
      ['C','op'],['±','op'],['%','op'],['÷','op'],
      ['7',''],['8',''],['9',''],['×','op'],
      ['4',''],['5',''],['6',''],['−','op'],
      ['1',''],['2',''],['3',''],['+','op'],
      ['0','span'],['.',''],['=','eq']
    ];
    const show = () => valEl.textContent = cur.length > 14 ? (+cur).toExponential(7) : cur;
    function press(k){
      const n = parseFloat(cur);
      if (/[0-9]/.test(k)){ cur = (fresh || cur === '0') ? k : cur + k; fresh = false; }
      else if (k === '.'){ if (!cur.includes('.')) cur += '.'; fresh = false; }
      else if (k === 'C'){ cur = '0'; prev = null; op = null; exprEl.textContent = ''; fresh = true; }
      else if (k === '±') cur = String(-n);
      else if (k === '%') cur = String(n / 100);
      else if (k === '='){
        if (op && prev !== null){ const r = compute(prev, n, op); exprEl.textContent = prev + ' ' + op + ' ' + n + ' ='; cur = fmt(r); prev = null; op = null; }
        fresh = true;
      } else { // operator
        if (op && prev !== null && !fresh){ const r = compute(prev, n, op); cur = fmt(r); prev = r; }
        else prev = n;
        op = k; fresh = true; exprEl.textContent = fmt(prev) + ' ' + op;
      }
      show();
    }
    const compute = (a,b,o) => o === '+' ? a+b : o === '−' ? a-b : o === '×' ? a*b : a/b;
    const fmt = r => !isFinite(r) ? 'Error' : String(Math.round(r * 1e12) / 1e12);
    keys.forEach(([k, cls]) => {
      const b = el('button', { class: cls }, k);
      if (k === '0') b.style.gridColumn = 'span 2';
      b.onclick = () => press(k);
      grid.append(b);
    });
    bindKeys(body, e => {
      const m = { '/':'÷', '*':'×', '-':'−', '+':'+', 'Enter':'=', '=':'=', 'Escape':'C', 'Backspace':'C', '%':'%', '.':'.' };
      if (/^[0-9]$/.test(e.key)) { press(e.key); return true; }
      if (m[e.key]) { press(m[e.key]); return true; }
      return false;
    });
    show();
  }
};

APPS.terminal = {
  name: 'Terminal', icon: '>_', w: 700, h: 460,
  mount(body, win){
    body.innerHTML = `<div class="term"><div class="out"></div><div class="in"><span class="p">user@uos:~$</span><input spellcheck="false" autocomplete="off"></div></div>`;
    const term = $('.term', body), out = $('.out', body), input = $('.in input', body);
    let cwd = '~';
    const home = '~';
    const abs = p => {
      if (!p) return cwd;
      if (p.startsWith('/')) return p.replace(/^\/+|\/+$/g,'') || '/';
      if (p === '~') return home;
      if (p.startsWith('~/')) p = p.slice(2);
      const base = cwd === '~' || cwd === '/' ? '' : cwd + '/';
      const out2 = [];
      for (const seg of (base + p).split('/')){
        if (!seg || seg === '.') continue;
        if (seg === '..') out2.pop(); else out2.push(seg);
      }
      return out2.join('/') || '/';
    };
    const prompt_ = () => cwd === '~' ? cwd : cwd;
    function line(text = '', cls = ''){ out.append(el('div', { class: cls }, text)); term.scrollTop = term.scrollHeight; }
    function banner(){
      line('uOS Terminal v1.0  —  type "help" for a list of commands', 'ok');
      line('');
    }
    const COMMANDS = {
      help(){ line('Available commands:');
        line('  help            this message');
        line('  ls [dir]        list files');
        line('  cd <dir>        change directory');
        line('  cat <file>      print a file');
        line('  echo <text>     print text');
        line('  mkdir <dir>     create a folder');
        line('  touch <file>    create an empty file');
        line('  write <f> <txt> write text to a file');
        line('  rm <path>       delete file/folder');
        line('  open <app>      launch an app (e.g. open snake)');
        line('  apps            list installed apps');
        line('  theme <d|l>     dark / light theme');
        line('  date, whoami, clear, neofetch');
      },
      ls(args){
        const p = abs(args[0]);
        const list = p === '/' ? fsList('/') : fsList(p);
        if (!list.length && !fsExists(p)) { line('ls: ' + p + ': no such directory', 'err'); return; }
        list.forEach(i => line('  ' + (i.type === 'dir' ? '📁 ' : '📄 ') + i.name));
      },
      cd(args){
        const p = abs(args[0]);
        if (p === home || fsExists(p) && (FS[p] ? FS[p].type === 'dir' : true)) cwd = p;
        else line('cd: ' + p + ': not a directory', 'err');
      },
      cat(args){
        if (!args[0]) return line('usage: cat <file>', 'err');
        const p = abs(args[0]);
        if (FS[p] && FS[p].type === 'file') line(FS[p].content || '(empty)');
        else line('cat: ' + p + ': no such file', 'err');
      },
      echo(args){ line(args.join(' ')); },
      mkdir(args){ if (!args[0]) return line('usage: mkdir <dir>', 'err'); fsMkdir(abs(args[0])); line('created ' + abs(args[0]), 'ok'); },
      touch(args){ if (!args[0]) return line('usage: touch <file>', 'err'); fsWrite(abs(args[0]), ''); line('created ' + abs(args[0]), 'ok'); },
      write(args){ const p = abs(args.shift()); if (!p) return line('usage: write <file> <text>', 'err'); fsWrite(p, args.join(' ')); line('wrote ' + p, 'ok'); },
      rm(args){
        if (!args[0]) return line('usage: rm <path>', 'err');
        const p = abs(args[0]);
        if (args.includes('-f')) { fsDelete(p); line('permanently removed ' + p, 'ok'); }
        else { trashAdd(p); line('moved to Recycle Bin: ' + p, 'ok'); }
      },
      open(args){
        const key = (args[0] || '').toLowerCase();
        const found = Object.keys(APPS).find(k => k === key) ||
          Object.keys(APPS).find(k => APPS[k].name.toLowerCase() === key);
        if (found){ openApp(found); line('launched ' + APPS[found].name, 'ok'); }
        else line('open: unknown app "' + key + '" (try: apps)', 'err');
      },
      apps(){ Object.entries(APPS).forEach(([k, a]) => line('  ' + a.icon + '  ' + k.padEnd(12) + a.name)); },
      theme(args){ settings.theme = args[0] === 'l' ? 'light' : 'dark'; saveSettings(); line('theme: ' + settings.theme, 'ok'); },
      date(){ line(new Date().toString()); },
      whoami(){ line(settings.user.toLowerCase()); },
      clear(){ out.innerHTML = ''; },
      neofetch(){
        line('        ██            ' + settings.user + '@uos', 'ok');
        line('      ██████          ----------');
        line('    ██████████        OS: uOS 1.0 (web)');
        line('   ██  ████  ██       Kernel: JavaScript');
        line('   ████████████      Uptime: ' + Math.floor(performance.now() / 1000) + 's');
        line('    ██████████        Shell: uosh');
        line('      ██████          Theme: ' + settings.theme);
        line('        ██            Resolution: ' + innerWidth + 'x' + innerHeight);
      }
    };
    function run(raw){
      line(prompt_() + ' ' + raw);
      const parts = raw.trim().split(/\s+/);
      const cmd = (parts.shift() || '').toLowerCase();
      if (!cmd) return;
      if (COMMANDS[cmd]) { try { COMMANDS[cmd](parts); } catch(e){ line(String(e), 'err'); } }
      else line('uosh: command not found: ' + cmd, 'err');
      line('');
    }
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter'){ const v = input.value; input.value = ''; run(v); }
      else if (e.key === 'ArrowUp'){ e.preventDefault(); }
    });
    term.addEventListener('click', () => input.focus());
    body.__focus = input;
    banner(); line('');
    setTimeout(() => input.focus(), 60);
  }
};

    ];
    const tabs = [];
    let active = null, seq = 0;

    function toUrl(v){
      v = (v || '').trim();
      if (!v) return null;
      if (/^https?:\/\//i.test(v)) return v;
      if (/^[\w-]+(\.[\w-]+)+([/?#].*)?$/.test(v)) return 'https://' + v;
      return 'https://www.bing.com/search?q=' + encodeURIComponent(v);
    }
    function hostOf(u){ try { return new URL(u).hostname.replace(/^www\./, ''); } catch(e){ return String(u); } }

    /* ------------------------------- tabs --------------------------- */
    function newTab(url){
      const id = 'bt' + (++seq);
      const page = el('div', { class: 'tabpage', 'data-id': id });
      const homeEl = el('div', { class: 'brw-home' });
      const frame = el('iframe', { class: 'brw-frame', style: 'display:none' });

      page.append(homeEl, frame);
      pages.append(page);

      const t = { id: id, page: page, home: homeEl, frame: frame, url: null, title: 'New tab', stack: [] };
      frame.addEventListener('load', function(){
        let title = t.url ? hostOf(t.url) : 'New tab';
        try { if (frame.contentDocument && frame.contentDocument.title) title = frame.contentDocument.title; } catch(e){}
        t.title = title || 'New tab';
        drawTabs();
      });

      tabs.push(t);
      buildHome(t);
      activate(id);
      if (url) navigateIn(t, url);
      else setTimeout(function(){ const i = t.home.querySelector('input'); if (i) i.focus(); }, 40);
      updateClocks();
      return t;
    }
    function buildHome(t){
      t.home.innerHTML = '';
      const clock = el('div', { class: 'nt-clock' }, '--:--');
      const date = el('div', { class: 'nt-date' }, '');
      const search = el('div', { class: 'nt-search' },
        el('span', { html: sysIcon('search') }),
        el('input', { placeholder: 'Search the web or type an address', spellcheck: 'false', autocomplete: 'off' }));
      const links = el('div', { class: 'nt-links' });
      LINKS.forEach(function(pair){
        const b = el('button', { class: 'nt-link' }, pair[0]);
        b.onclick = function(){ navigateIn(t, pair[1]); };
        links.append(b);
      });
      t.home.append(el('div', { class: 'newtab' }, clock, date, search, links,
        el('div', { class: 'nt-note' }, 'Searches use Bing, which allows embedding. Sites that block embedding (Google, YouTube…) stay blank in the frame — use “Open ↗” for those.')));
      const inp = search.querySelector('input');
      inp.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ const u = toUrl(inp.value); if (u) navigateIn(t, u); } });
    }
    function activate(id){
      const t = tabs.find(function(x){ return x.id === id; }) || tabs[0];
      if (!t) return;
      active = t;
      pages.querySelectorAll('.tabpage').forEach(function(p){ p.classList.toggle('on', p === t.page); });
      urlbar.value = t.url || '';
      warn.style.display = t.url ? 'flex' : 'none';
      drawTabs();
    }
    function navigateIn(t, v){
      const u = toUrl(v);
      if (!u) return;
      t.stack.push(u);
      t.url = u;
      urlbar.value = u;
      t.home.style.display = 'none';
      t.frame.style.display = 'block';
      t.frame.setAttribute('src', u);
      t.title = hostOf(u);
      warn.style.display = 'flex';
      drawTabs();
    }
    function goBack(t){
      if (t.stack.length < 2){
        t.stack = []; t.url = null;
        t.frame.removeAttribute('src');
        t.frame.style.display = 'none';
        t.home.style.display = 'flex';
        urlbar.value = '';
        warn.style.display = 'none';
        t.title = 'New tab';
        drawTabs();
        return;
      }
      t.stack.pop();
      const prev = t.stack[t.stack.length - 1];
      t.url = prev;
      urlbar.value = prev;
      t.frame.setAttribute('src', prev);
      t.title = hostOf(prev);
      drawTabs();
    }
    function closeTab(id){
      const i = tabs.findIndex(function(x){ return x.id === id; });
      if (i < 0) return;
      const t = tabs[i];
      const wasActive = active === t;
      t.page.remove();
      tabs.splice(i, 1);
      if (!tabs.length){ newTab(); return; }
      if (wasActive) activate(tabs[Math.max(0, i - 1)].id);
      else drawTabs();
    }
    function drawTabs(){
      strip.innerHTML = '';
      tabs.forEach(function(t){
        const b = el('div', { class: 'btab' + (active === t ? ' on' : ''), title: t.title });
        b.append(el('span', { class: 't' }, t.title));
        const x = el('button', { class: 'x', title: 'Close tab' }, '✕');
        x.onclick = function(e){ e.stopPropagation(); closeTab(t.id); };
        b.append(x);
        b.onclick = function(){ activate(t.id); };
        strip.append(b);
      });
      const plus = el('button', { class: 'tabnew', title: 'New tab' }, '＋');
      plus.onclick = function(){ newTab(); };
      strip.append(plus);
    }

    /* ----------------------------- toolbar -------------------------- */
    $('#bGo', body).onclick = function(){ if (active) navigateIn(active, urlbar.value); };
    urlbar.addEventListener('keydown', function(e){ if (e.key === 'Enter' && active) navigateIn(active, urlbar.value); });
    $('#bBack', body).onclick = function(){ if (active) goBack(active); };
    $('#bReload', body).onclick = function(){ if (active && active.url) active.frame.setAttribute('src', active.url); };
    const openReal = function(){ if (active && active.url) window.open(active.url, '_blank'); };
    $('#bExt', body).onclick = openReal;
    $('#bOpenTab', body).onclick = openReal;

    function updateClocks(){
      const d = new Date();
      const c = clockText(d);
      pages.querySelectorAll('.nt-clock').forEach(function(n){ n.textContent = c.time; });
      pages.querySelectorAll('.nt-date').forEach(function(n){ n.textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' }); });
    }
    updateClocks();
    const clockTimer = setInterval(updateClocks, 1000);

    newTab();
    return function(){ clearInterval(clockTimer); };
  }
};

    const cv = $('#pc', body), ctx = cv.getContext('2d');
    let color = '#000000', size = 6, erasing = false, drawing = false, last = null;
    function fit(){
      const r = cv.parentElement.getBoundingClientRect();
      const img = ctx.getImageData(0, 0, cv.width || 1, cv.height || 1);
      const w = Math.max(200, Math.floor(r.width)), h = Math.max(150, Math.floor(r.height) - 46);
      cv.width = w; cv.height = h;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);

      b.style.background = c;

      cw.append(b);
    });
    const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; };
    const stroke = (a, b) => {
      ctx.strokeStyle = erasing ? '#ffffff' : color;
      ctx.lineWidth = erasing ? size * 2.4 : size;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    };
    cv.addEventListener('pointerdown', e => { drawing = true; last = pos(e); try { cv.setPointerCapture(e.pointerId); } catch(err){}; stroke(last, last); });
    cv.addEventListener('pointermove', e => { if (!drawing) return; const p = pos(e); stroke(last, p); last = p; });
    cv.addEventListener('pointerup', () => drawing = false);
    cv.addEventListener('pointerleave', () => drawing = false);
    $('#size', body).oninput = e => { size = +e.target.value; $('#sizeV', body).textContent = size; };
    $('#eraser', body).onclick = () => { erasing = !erasing; toast('Paint', erasing ? 'Eraser on' : 'Brush on'); };

    $('#clear', body).onclick = () => { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height); };

    };
    setTimeout(fit, 30);
    return () => {};
  }
};

    const drawSw = () => {
      const ms = swElapsed + (swTimer ? Date.now() - swStart : 0);
      const m = Math.floor(ms / 60000), s = Math.floor(ms % 60000 / 1000), t = Math.floor(ms % 1000 / 100);

      tTimer = setInterval(() => {
        left -= 1000;
        if (left <= 0){ clearInterval(tTimer); tTimer = null; $('#tLeft', body).textContent = 'Time is up!'; $('#tGo', body).textContent = 'Start'; toast('⏰ Timer', 'Time is up!'); beepTwice(); return; }
        const s = Math.ceil(left / 1000);
        $('#tLeft', body).textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
      }, 1000);
    };
    function beepTwice(){
      const gv = outGain('clock');
      if (gv <= 0) return;
      try {
        const a = new (window.AudioContext||window.webkitAudioContext)();
        [0,.25].forEach(d => { const o=a.createOscillator(), g=a.createGain(); o.connect(g).connect(a.destination); o.frequency.value=880;
          g.gain.setValueAtTime(Math.max(.0001, .2 * gv),a.currentTime+d); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d+.2); o.start(a.currentTime+d); o.stop(a.currentTime+d+.22); });
      } catch(e){}
    }
    return () => { clearInterval(tick); clearInterval(swLoop); clearInterval(swTimer); clearInterval(tTimer); };
  }
};

APPS.colorpicker = {
  name: 'Color Picker', icon: '🎨', w: 520, h: 560, single: true,
  mount(body){
    body.innerHTML = `
      <div class="pad" style="overflow:auto">
        <div class="swatch-big" id="big"></div>
        <div style="display:flex;gap:10px;align-items:center">
          <input type="color" id="cp" value="#0078d4">
          <input class="field mono" id="chex" value="#0078d4" style="flex:1">
          <button class="btn" id="copy">Copy</button>
        </div>
        <div class="card">
          <div class="kv"><span>HEX</span><b class="mono" id="kHex"></b></div>
          <div class="kv"><span>RGB</span><b class="mono" id="kRgb"></b></div>
          <div class="kv"><span>HSL</span><b class="mono" id="kHsl"></b></div>
        </div>
        <h3 class="sect">Tints &amp; shades</h3>
        <div class="swatchrow" id="ramp"></div>
        <h3 class="sect">Harmony</h3>
        <div class="swatchrow" id="harmony"></div>
      </div>`;
    const clamp255 = n => Math.max(0, Math.min(255, Math.round(n)));
    const hexToRgb = h => { h = h.replace('#',''); if (h.length === 3) h = h.split('').map(c=>c+c).join(''); const n = parseInt(h,16); return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 }; };
    const rgbToHex = (r,g,b) => '#' + [r,g,b].map(v => clamp255(v).toString(16).padStart(2,'0')).join('');
    function rgbToHsl(r,g,b){
      r/=255; g/=255; b/=255;
      const mx = Math.max(r,g,b), mn = Math.min(r,g,b); let h = 0, s = 0; const l = (mx+mn)/2;
      if (mx !== mn){ const d = mx-mn; s = l > .5 ? d/(2-mx-mn) : d/(mx+mn);
        h = mx === r ? (g-b)/d + (g < b ? 6 : 0) : mx === g ? (b-r)/d + 2 : (r-g)/d + 4; h /= 6; }
      return { h: Math.round(h*360), s: Math.round(s*100), l: Math.round(l*100) };
    }
    let color = '#0078d4';
    function set(c, fromInput){
      color = c;
      const { r,g,b } = hexToRgb(c);
      const hsl = rgbToHsl(r,g,b);
      $('#big', body).style.background = c;
      $('#kHex', body).textContent = c.toLowerCase();
      $('#kRgb', body).textContent = `rgb(${r}, ${g}, ${b})`;
      $('#kHsl', body).textContent = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
      $('#chex', body).value = c.toLowerCase();
      if (!fromInput) $('#cp', body).value = c.toLowerCase();
      // ramps
      const ramp = $('#ramp', body); ramp.innerHTML = '';
      for (let i = 0; i <= 10; i++){
        const t = i/10;
        const mix = t < .5 ? { r: r + (255-r)*(1-t*2), g: g + (255-g)*(1-t*2), b: b + (255-b)*(1-t*2) }
                           : { r: r*(1-(t-.5)*2), g: g*(1-(t-.5)*2), b: b*(1-(t-.5)*2) };
        ramp.append(swatch(rgbToHex(mix.r,mix.g,mix.b)));
      }
      const har = $('#harmony', body); har.innerHTML = '';
      [0,30,120,180,240,300].forEach(dh => har.append(swatch(hslToHex((hsl.h+dh)%360, hsl.s, hsl.l))));
    }
    function hslToHex(h,s,l){
      s/=100; l/=100;
      const k = n => (n + h/30) % 12;
      const a = s * Math.min(l, 1-l);
      const f = n => l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
      return rgbToHex(f(0)*255, f(8)*255, f(4)*255);
    }
    function swatch(hex){
      const b = el('button', { class: 'csw', title: hex });
      b.style.background = hex;
      b.onclick = () => set(hex);
      return b;
    }
    $('#cp', body).addEventListener('input', e => set(e.target.value, true));
    $('#chex', body).addEventListener('input', e => { if (/^#?[0-9a-f]{3,6}$/i.test(e.target.value.trim())) set(e.target.value.trim().startsWith('#') ? e.target.value.trim() : '#' + e.target.value.trim(), true); });
    $('#copy', body).onclick = () => { copyText($('#chex', body).value); toast('Color Picker', 'Copied ' + $('#chex', body).value); };
    set(color);
  }
};

const NOTE_COLORS = ['#fef3a0','#ffd6e8','#cfe8ff','#d6f5d6','#e4d6ff'];
function renderNotes(){
  const layer = $('#notes'); if (!layer) return;
  layer.innerHTML = '';
  const notes = store.get('stickies', []);
  notes.forEach(n => {
    const persist = () => {
      const all = store.get('stickies', []);
      const i = all.findIndex(x => x.id === n.id);
      if (i >= 0) all[i] = n;
      store.set('stickies', all);
    };
    const el2 = el('div', { class: 'stickynote' });
    el2.style.left = n.x + 'px'; el2.style.top = n.y + 'px'; el2.style.background = n.color;
    const bar = el('div', { class: 'sn-bar' },
      el('button', { class: 'sn-btn', title: 'Colour', onclick: () => { n.color = NOTE_COLORS[(NOTE_COLORS.indexOf(n.color)+1) % NOTE_COLORS.length]; persist(); renderNotes(); } }, '🎨'),
      el('button', { class: 'sn-btn', title: 'Delete', onclick: () => { const a = store.get('stickies', []).filter(x => x.id !== n.id); store.set('stickies', a); renderNotes(); } }, '✕'));
    const ta = el('textarea', { spellcheck: 'false' });
    ta.value = n.text || '';
    ta.addEventListener('input', () => { n.text = ta.value; persist(); });
    el2.append(bar, ta);
    bar.addEventListener('pointerdown', e => {
      if (e.target.closest('.sn-btn')) return;
      const r = cssRect(el2);
      const ox = e.clientX - r.left, oy = e.clientY - r.top;
      const sx = n.x, sy = n.y;
      try { bar.setPointerCapture(e.pointerId); } catch(err){}
      const move = ev => {
        n.x = clamp(ev.clientX - ox, 0, VW() - 60);
        n.y = clamp(ev.clientY - oy, 0, VH() - 90);
        el2.style.left = n.x + 'px'; el2.style.top = n.y + 'px';
      };
      const up = () => {
        bar.removeEventListener('pointermove', move);
        bar.removeEventListener('pointerup', up);
        const spot = placeNoOverlap(el2, n.x, n.y, el2.offsetWidth, el2.offsetHeight, false);
        if (spot){ n.x = Math.round(spot.x); n.y = Math.round(spot.y); }
        else { n.x = sx; n.y = sy; }        // nowhere free — put it back
        el2.style.left = n.x + 'px'; el2.style.top = n.y + 'px';
        persist();
      };
      bar.addEventListener('pointermove', move); bar.addEventListener('pointerup', up);
    });
    layer.append(el2);
    // nudge a freshly rendered note off anything it would overlap
    const fit = placeNoOverlap(el2, n.x, n.y, el2.offsetWidth, el2.offsetHeight, false);
    if (fit && fit.moved){ n.x = Math.round(fit.x); n.y = Math.round(fit.y); el2.style.left = n.x + 'px'; el2.style.top = n.y + 'px'; persist(); }
  });
}

        <div class="hprev">
          <iframe id="hvFrame" title="Preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-pointer-lock"></iframe>
          <div class="hblank" id="hvBlank"><span>Press <b>▶ Run</b> to render your HTML</span></div>

    function run(){
      const code = ta.value;
      runNo++;
      if (code.length > 750000){
        /* very large pages: a blob URL costs far less than a srcdoc string */
        if (blobURL) URL.revokeObjectURL(blobURL);
        blobURL = URL.createObjectURL(new Blob([code], { type: 'text/html' }));
        frame.removeAttribute('srcdoc');
        frame.src = blobURL;
      } else {
        if (blobURL){ URL.revokeObjectURL(blobURL); blobURL = null; }
        frame.removeAttribute('src');
        /* trailing comment = a fresh srcdoc value, so the frame always reloads */
        frame.srcdoc = code + '\n<' + '!-- uOS run ' + runNo + ' --' + '>';
      }
      blank.style.display = 'none';
      info.textContent = 'Rendered at ' + new Date().toLocaleTimeString() + (code.length > 750000 ? ' · large page' : '');

    function load(text, name){
      ta.value = text;

    $('#hvOpen', body).onclick = () => picker.click();

    /* --- open / save in the uOS file system --- */
    $('#hvFromFS', body).onclick = () => {
      const files = Object.keys(FS).filter(k => FS[k] && FS[k].type === 'file' && /\.(html?|xhtml|svg|txt)$/i.test(k));
      if (!files.length) return toast('HTML Viewer', 'No HTML files in uOS Files yet');
      const p = prompt('Open from uOS Files:\n\n' + files.join('\n'), files[0]);
      if (!p) return;
      const key = FS[p] ? p : files.find(k => k.toLowerCase() === p.trim().toLowerCase());
      if (!key) return toast('HTML Viewer', 'No such file: ' + p);
      load(FS[key].content, key);
    };
    $('#hvToFS', body).onclick = () => {
      const p = prompt('Save to uOS Files as:', file && /\.html?$/i.test(file) ? file : 'Projects/page.html');
      if (!p) return;
      file = p.replace(/^\/+/, '');
      fsWrite(file, ta.value);
      setTitle(); toast('HTML Viewer', 'Saved ' + file);
    };

    /* --- out to the real machine --- */
    function fileName(){
      const base = file ? file.split('/').pop() : 'page.html';
      return /\.html?$/i.test(base) ? base : base.replace(/\.[^.]+$/, '') + '.html';
    }
    $('#hvDown', body).onclick = () => {
      const url = URL.createObjectURL(new Blob([ta.value], { type: 'text/html' }));
      const a = el('a', { href: url, download: fileName() });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      toast('HTML Viewer', 'Downloaded ' + fileName());
    };
    $('#hvTab', body).onclick = () => {
      const url = URL.createObjectURL(new Blob([ta.value], { type: 'text/html' }));
      if (!window.open(url, '_blank')) toast('HTML Viewer', 'The browser blocked the new tab');
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    };

    /* --- drag the divider --- */
    const split = $('#hvSplit', body), div = $('#hvDiv', body);
    let dragging = false;
    function resizeTo(clientX){
      const r = cssRect(split);                       // zoom-aware
      let pct = ((clientX - r.left) / r.width) * 100;
      ta.style.flexBasis = Math.max(15, Math.min(85, pct)) + '%';
    }
    div.addEventListener('pointerdown', e => {
      dragging = true; e.preventDefault();
      div.classList.add('drag');
      try { div.setPointerCapture(e.pointerId); } catch(err){}
    });
    div.addEventListener('pointermove', e => { if (dragging) resizeTo(e.clientX); });
    const stopDrag = () => { dragging = false; div.classList.remove('drag'); };
    div.addEventListener('pointerup', stopDrag);
    div.addEventListener('lostpointercapture', stopDrag);

    /* --- fullscreen preview -------------------------------------------
       Tries the real Fullscreen API first; if the browser refuses (no
       gesture, blocked), falls back to filling the window with the preview. */
    const prev = $('.hprev', body);
    const exitBtn = el('button', { class: 'hv-exit', title: 'Exit fullscreen (Esc)' }, '✕ Exit fullscreen');
    exitBtn.style.display = 'none';
    exitBtn.onclick = e => { e.stopPropagation(); leaveFull(); };
    prev.append(exitBtn);
    let expanded = false;

    function isFull(){ return document.fullscreenElement === prev; }
    function showExit(on){ exitBtn.style.display = on ? 'block' : 'none'; }
    function setExpanded(on){
      expanded = on;
      $('#hvSplit', body).classList.toggle('onlyprev', on);
      showExit(on || isFull());
    }
    function leaveFull(){
      if (expanded) setExpanded(false);
      if (isFull() && document.exitFullscreen){
        const p = document.exitFullscreen();
        if (p && p.catch) p.catch(() => {});
      }
    }
    function toggleFull(){
      if (isFull() || expanded){ leaveFull(); return; }
      /* the in-window mode always works, so do it first; then ask the browser
         for the real thing — if it refuses, we still end up with a big preview */
      setExpanded(true);
      if (prev.requestFullscreen){
        const p = prev.requestFullscreen();
        if (p && p.catch) p.catch(() => {});
      }
    }

    $('#hvFull', body).onclick = toggleFull;
    const onFsChange = () => showExit(isFull() || expanded);
    document.addEventListener('fullscreenchange', onFsChange);
    function localKeys(e){
      if (e.key === 'Escape' && (isFull() || expanded)){ e.stopPropagation(); leaveFull(); return; }
      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'f'){ e.preventDefault(); toggleFull(); }
    }
    /* listen on the whole window, not just the app body — Escape should work
       wherever the focus happens to be inside it */
    win.el.addEventListener('keydown', localKeys);

    /* handing the window back its clean state on close */
    return () => {
      document.removeEventListener('fullscreenchange', onFsChange);
      win.el.removeEventListener('keydown', localKeys);
      if (isFull() && document.exitFullscreen){ try { document.exitFullscreen(); } catch(e){} }
    };
  }
};

/* ------------------------------ My Apps -----------------------------
   A private shelf of single-file HTML apps. The files themselves live in the
   uOS file system (folder "Apps"), so they show up in Files, can be restored
   from the Recycle Bin, and open in the HTML Viewer — nothing leaves the
   browser and nothing is fetched from the network. */
APPS.myapps = {
  name: 'My Apps', icon: '🧩', w: 900, h: 610,
  mount(body, win){
    const DIR = 'Apps';
    const ICON_CHOICES = ['🎮','🌐','📝','🎨','🎵','🧮','📚','🧩','⚙️','📷','🗺️','💡'];
    let list = store.get('myapps', []).filter(a => a && a.file && (FS[a.file] || a.vault));
    const save = () => store.set('myapps', list);
    if (!FS[DIR]) FS[DIR] = { type: 'dir' };

    const NEW_APP = [
      '<!DOCTYPE html>',
      '<html lang="en">',
      '<head>',
      '<meta charset="utf-8">',
      '<title>New app</title>',
      '<style>',
      '  body { margin:0; padding:34px; font-family:system-ui,-apple-system,sans-serif;',
      '         background:linear-gradient(135deg,#0f172a,#1e3a8a); color:#eef2ff; }',
      '  h1 { margin:0 0 8px; font-size:26px; }',
      '  p  { margin:0; opacity:.85; line-height:1.5; }',
      '</style>',
      '</head>',
      '<body>',
      '  <h1>My new app</h1>',
      '  <p>Edit this in the HTML Viewer, then Run to see it. Save to Files keeps your changes.</p>',
      '</body>',
      '</html>'
    ].join('\n');

    body.innerHTML = `
      <div class="toolbar">
        <button class="btn primary" id="maAdd">＋ Add HTML file…</button>
        <button class="btn" id="maNew">New app</button>
        <div class="sep"></div>
        <input class="field" id="maSearch" placeholder="Filter…" style="max-width:190px">
        <span class="muted" style="font-size:12px;margin-left:auto" id="maInfo"></span>
      </div>
      <div class="pad" style="flex:1;min-height:0;overflow:auto" id="maHost"></div>`;

    const host = $('#maHost', body), search = $('#maSearch', body), info = $('#maInfo', body);

    /* ---- helpers ---- */
    function sizeText(n){ return n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(2) + ' MB'; }
    function sizeOf(a){ return a.vault ? (a.size || 0) : ((FS[a.file] && FS[a.file].content) || '').length; }
    function totalChars(){ return list.reduce((s, a) => s + sizeOf(a), 0); }
    function usedChars(){ let b = 0; try { for (const k in localStorage) if (k.startsWith('uos.')) b += (localStorage[k] || '').length; } catch(e){} return b; }
    function slug(n){
      let s = String(n).toLowerCase().replace(/[^a-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '');
      s = s.replace(/\.[^.]+$/, '');
      return (s || 'app') + '.html';
    }
    function taken(p){ return !!FS[p] || list.some(a => a.file === p); }
    function uniquePath(p){
      if (!taken(p)) return p;
      const base = p.replace(/\.html?$/i, ''), ext = (p.match(/\.html?$/i) || ['.html'])[0];
      let i = 2;
      while (taken(base + '-' + i + ext)) i++;
      return base + '-' + i + ext;
    }
    /* one reader, so the file system and the vault look the same to callers */
    async function readApp(a){
      if (FS[a.file]) return FS[a.file].content;
      if (a.vault) return await vaultGet(a.file);
      return null;
    }
    function guessIcon(name){
      const n = name.toLowerCase();
      if (/game|play|arcade|quest|adventure|snake|tetris|pong|rpg|zelda|mario/.test(n)) return '🎮';
      if (/note|todo|list|task/.test(n)) return '📝';
      if (/paint|draw|art|sketch/.test(n)) return '🎨';
      if (/music|sound|piano|drum/.test(n)) return '🎵';
      if (/calc|math|convert/.test(n)) return '🧮';
      if (/read|book|learn|study/.test(n)) return '📚';
      return '📄';
    }

    /* ---- actions ---- */
    function open(a){
      if (FS[a.file]) return openApp('htmlview', { file: a.file });
      if (a.vault){
        vaultGet(a.file).then(text => {
          if (text == null) return toast('My Apps', 'That app is missing from the vault');
          openApp('htmlview', { text: text, name: a.name });
        }).catch(() => toast('My Apps', 'Could not read that app'));
        return;
      }
      toast('My Apps', 'That file is missing');
      render();
    }
    async function openInBrowser(a){
      const text = await readApp(a);
      if (text == null) return toast('My Apps', 'That app is missing');
      const url = URL.createObjectURL(new Blob([text], { type: 'text/html' }));
      if (!window.open(url, '_blank')) toast('My Apps', 'The browser blocked the new tab');
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }
    function pickIcon(a, e){
      const items = ICON_CHOICES.map(ic => ({ label: ic, act: () => { a.icon = ic; save(); render(); } }));
      items.push({ sep: true });
      items.push({ label: 'Custom…', act: () => {
        const v = prompt('Icon — an emoji or 1–2 characters:', a.icon || '');
        if (v === null) return;
        const t = Array.from(v.trim()).slice(0, 2).join('');
        if (t) { a.icon = t; save(); render(); }
      } });
      showContext(e.clientX, e.clientY, items);
    }
    function menu(e, a){
      showContext(e.clientX, e.clientY, [
        { label: 'Open', act: () => open(a) },
        { label: 'Open in browser ↗', act: () => openInBrowser(a) },
        { sep: true },
        { label: 'Rename…', act: () => {
            const n = prompt('Name this app:', a.name);
            if (n === null) return;
            const t = n.trim().slice(0, 40);
            if (t) { a.name = t; save(); render(); }
          } },
        { label: 'Change icon…', act: () => pickIcon(a, e) },
        { label: 'Duplicate', act: async () => {
            const text = await readApp(a);
            if (text == null) return toast('My Apps', 'That app is missing');
            const p = uniquePath(DIR + '/' + slug(a.name + ' copy'));
            const e2 = { file: p, name: a.name + ' copy', icon: a.icon, added: Date.now() };
            if (text.length > vault.THRESHOLD){ e2.vault = true; e2.size = text.length; await vaultPut(p, text); }
            else fsWrite(p, text);
            list.push(e2); save(); render(); toast('My Apps', 'Duplicated');
          } },
        { sep: true },
        { label: 'Remove', act: async () => {
            if (!confirm('Remove "' + a.name + '"?\n\n' + (a.vault
              ? 'It is stored in the uOS vault, so this deletes it.'
              : 'The file goes to the Recycle Bin, so you can restore it.'))) return;
            if (a.vault) await vaultDel(a.file); else trashAdd(a.file);
            list = list.filter(x => x !== a);
            save(); render(); toast('My Apps', a.vault ? 'Removed from the vault' : 'Moved to Recycle Bin');
          } }
      ]);
    }

    /* ---- render ---- */
    function render(){
      host.innerHTML = '';
      search.value = search.value || '';
      const q = (search.value || '').trim().toLowerCase();
      const shown = list.filter(a => !q || a.name.toLowerCase().includes(q));
      info.textContent = list.length + (list.length === 1 ? ' app · ' : ' apps · ') + sizeText(totalChars()) + ' stored';

      if (!list.length){
        const card = el('div', { class: 'card', style: 'max-width:540px;margin:8px auto' },
          el('b', {}, 'No apps yet'),
          el('div', { class: 'muted', style: 'font-size:12.5px;line-height:1.55' },
            'Add a single HTML file from your computer — a game, a tool, a little page you wrote. ' +
            'It is stored inside uOS, so it opens offline and never leaves this browser. ' +
            'Small ones live in the file system; big ones (up to 64 MB) go to the vault.'),
          el('div', { style: 'display:flex;gap:8px;margin-top:6px' },
            el('button', { class: 'btn primary', onclick: () => picker.click() }, '＋ Add HTML file…'),
            el('button', { class: 'btn', onclick: () => makeNew() }, 'Start from a blank page')));
        host.append(card);
        return;
      }
      if (!shown.length){
        host.append(el('div', { class: 'muted', style: 'font-size:12.5px;padding:10px' }, 'Nothing matches “' + q + '”'));
        return;
      }
      const grid = el('div', { class: 'sm-grid', style: 'padding:0' });
      shown.forEach(a => {
        const t = el('button', { class: 'sm-app', title: a.file + '\nDouble-click to open  ·  right-click for options' },
          el('span', { class: 'ico' }, a.icon || '📄'),
          el('span', { class: 'lbl' }, a.name));
        t.addEventListener('dblclick', () => open(a));
        t.addEventListener('contextmenu', ev => { ev.preventDefault(); ev.stopPropagation(); menu(ev, a); });
        grid.append(t);
      });
      host.append(grid);
    }

    function importText(text, fileName){
      const name = String(fileName).replace(/\.[^.]+$/, '').slice(0, 40) || 'App';
      const path = uniquePath(DIR + '/' + slug(fileName));
      const entry = { file: path, name: name, icon: guessIcon(fileName), added: Date.now() };
      if (text.length > vault.THRESHOLD){
        /* too big for localStorage — keep it in the IndexedDB vault.
           Show it straight away, then roll back if the write fails. */
        entry.vault = true;
        entry.size = text.length;
        list.push(entry);
        save(); render();
        toast('My Apps', 'Added ' + fileName + ' · ' + sizeText(text.length) + ' (vault)');
        vaultPut(path, text).catch(() => {
          list = list.filter(x => x !== entry);
          save(); render();
          toast('My Apps', 'This browser would not store a file that big');
        });
        return;
      }
      fsWrite(path, text);
      list.push(entry);
      save(); render();
      toast('My Apps', 'Added ' + fileName);
    }
    function makeNew(){
      const path = uniquePath(DIR + '/new-app.html');
      fsWrite(path, NEW_APP);
      list.push({ file: path, name: 'New app', icon: '🧩', added: Date.now() });
      save(); render();
      openApp('htmlview', { file: path });
    }

    /* ---- file picker (from this computer) ---- */
    const picker = el('input', { type: 'file', accept: '.html,.htm,.xhtml,.svg,.txt,.md' });
    picker.style.display = 'none';
    picker.addEventListener('change', () => {
      const f = picker.files && picker.files[0];
      picker.value = '';
      if (!f) return;
      if (f.size > 64 * 1024 * 1024){ toast('My Apps', 'Too big — keep a single app under 64 MB'); return; }
      const fr = new FileReader();
      fr.onload = () => {
        const text = String(fr.result);
        /* only the localStorage path has a tight budget; the vault does not */
        if (text.length <= vault.THRESHOLD && usedChars() + text.length > 2000000){
          toast('My Apps', 'Not enough browser storage left — remove an app first');
          return;
        }
        importText(text, f.name);
      };
      fr.readAsText(f);
    });
    body.append(picker);

    $('#maAdd', body).onclick = () => picker.click();
    $('#maNew', body).onclick = makeNew;
    search.addEventListener('input', render);
    render();
  }
};

/* --------------------------- usage rate limits ---------------------- *
 * Client-side guard so one person can't burn the whole free quota.
 * Stored per browser — it stops casual overuse, not a determined user.  */
const AI_LIMITS_DEFAULT = { perMin: 20, perDay: 100 };
let AI_LIMITS = Object.assign({}, AI_LIMITS_DEFAULT, store.get('aiLimits', {}) || {});
function aiUsage(){
  const now = Date.now();
  let u = store.get('aiUsage', { t: [] });
  if (!u || !Array.isArray(u.t)) u = { t: [] };
  u.t = u.t.filter(x => typeof x === 'number' && now - x < 86400000);
  return u;
}
function aiRemaining(){ return Math.max(0, AI_LIMITS.perDay - aiUsage().t.length); }
function aiCheckLimit(){
  const now = Date.now(), t = aiUsage().t;
  const lastMin = t.filter(x => now - x < 60000).length;
  if (lastMin >= AI_LIMITS.perMin)
    return { ok: false, msg: 'Slow down — limit is ' + AI_LIMITS.perMin + ' messages per minute. Try again in a few seconds.' };
  if (t.length >= AI_LIMITS.perDay){
    const mins = Math.max(1, Math.round((86400000 - (now - t[0])) / 60000));
    const h = Math.floor(mins / 60), m = mins % 60;
    return { ok: false, msg: 'Daily limit reached (' + AI_LIMITS.perDay + ' messages/day). Resets in about ' + (h ? h + 'h ' : '') + m + 'm.' };
  }
  return { ok: true };
}
function aiRecord(){ const u = aiUsage(); u.t.push(Date.now()); store.set('aiUsage', u); }

function aiFormat(text){
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const blocks = [];
  let out = esc(text).replace(/```[a-zA-Z0-9]*\n?([\s\S]*?)```/g, (m, code) => {
    blocks.push('<pre><code>' + code.replace(/\n$/, '') + '</code></pre>');
    return '\u0000' + (blocks.length - 1) + '\u0000';
  });
  out = out.replace(/`([^`\n]+)`/g, '<code>$1</code>')
           .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
           .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
           .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  out = out.split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
  return out.replace(/\u0000(\d+)\u0000/g, (m, i) => blocks[+i]);
}

      busy = true;
      sendBtn.disabled = true;

        const headers = { 'Content-Type': 'application/json' };
        if (AI_KEY) headers.Authorization = 'Bearer ' + AI_KEY;

          method: 'POST',

        }
        aiRecord();
        setStatus(modelSel.value + ' · ' + aiRemaining() + ' left today');
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        for (;;){
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const parts = buf.split('\n');
          buf = parts.pop();
          for (const line of parts){
            const t = line.trim();
            if (!t.startsWith('data:')) continue;
            const data = t.slice(5).trim();
            if (data === '[DONE]') continue;
            try {
              const j = JSON.parse(data);
              const d = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
              if (d){ acc += d; paint(); }
            } catch(e){}
          }
        }
        out.innerHTML = aiFormat(acc || '(no response)');
        history.push({ role: 'assistant', content: acc });
        setStatus('Ready · ' + modelSel.value + ' · ' + aiRemaining() + ' left today');
      } catch (e){
        const msg = String(e && e.message || e);
        const cors = /failed to fetch|load failed|networkerror/i.test(msg);
        out.innerHTML = '<p style="color:#e81123">⚠ ' + msg + '</p>' + (cors

          : '');
        setStatus(cors ? 'Blocked (CORS)' : (/401|invalid|api key|incorrect/i.test(msg) ? 'Invalid key — open Settings' : 'Error'));
      } finally {
        busy = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.onclick = send;
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
    input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 150) + 'px'; });

};

function trashAdd(path){
  const entry = { id: uid(), path, at: Date.now(), node: FS[path] || null, children: {} };
  for (const k of Object.keys(FS)) if (k.startsWith(path + '/')) entry.children[k] = FS[k];
  TRASH.unshift(entry);
  TRASH = TRASH.slice(0, 200);
  store.set('trash', TRASH);
  fsDelete(path);
  trashChanged();
}
function trashRestore(id){
  const i = TRASH.findIndex(e => e.id === id);
  if (i < 0) return;
  const e = TRASH[i];
  if (e.node) FS[e.path] = e.node;
  for (const [k, v] of Object.entries(e.children)) FS[k] = v;
  saveFS();
  TRASH.splice(i, 1); store.set('trash', TRASH);
  trashChanged();
}
function trashRemove(id){ TRASH = TRASH.filter(e => e.id !== id); store.set('trash', TRASH); trashChanged(); }
function trashEmpty(){ TRASH = []; store.set('trash', TRASH); trashChanged(); }

/* ------------------------ file associations -------------------------
   Which app opens which extension. Settings > "Open with" can change it. */
const ASSOC_DEFAULT = {
  html: 'htmlview', htm: 'htmlview', xhtml: 'htmlview', svg: 'viewer',
  txt: 'notepad', log: 'notepad', md: 'notepad', csv: 'notepad',
  js: 'code', json: 'code', css: 'code',
  png: 'viewer', jpg: 'viewer', jpeg: 'viewer', gif: 'viewer', webp: 'viewer',
  mp3: 'media', wav: 'media', ogg: 'media', mp4: 'media', webm: 'media'
};
const ASSOC_CHOICES = ['notepad', 'code', 'htmlview', 'viewer', 'media'];
function extOf(path){ const m = String(path).match(/\.([a-z0-9]+)$/i); return m ? m[1].toLowerCase() : ''; }
function assocMap(){ return Object.assign({}, ASSOC_DEFAULT, store.get('assoc', {}) || {}); }
function setAssoc(ext, appId){ const m = store.get('assoc', {}) || {}; m[ext] = appId; store.set('assoc', m); }
function appForPath(path){
  const ext = extOf(path);
  return ext ? (assocMap()[ext] || '') : '';
}
/* two-step pickers, used by the Files app */
function pickOpenWith(path){
  const a = appForPath(path);
  showContext(showContext.lastX || 200, showContext.lastY || 200, ASSOC_CHOICES.filter(id => APPS[id]).map(id => ({
    label: (id === a ? '✓ ' : '') + APPS[id].name, act: () => openApp(id, { file: path })
  })));
}
function pickDefaultFor(path){
  const ext = extOf(path);
  if (!ext) return toast('Files', 'That file has no extension');
  showContext(showContext.lastX || 200, showContext.lastY || 200, ASSOC_CHOICES.filter(id => APPS[id]).map(id => ({
    label: (appForPath(path) === id ? '✓ ' : '') + APPS[id].name,
    act: () => { setAssoc(ext, id); toast('Files', '.' + ext + ' now opens with ' + APPS[id].name); }
  })));
}
function openPath(path){
  const name = String(path).split('/').pop();
  const f = FS[path] || {};
  /* an assigned app wins; otherwise fall back to the built-in rules */
  const chosen = appForPath(path);
  if (chosen && APPS[chosen]) return openApp(chosen, { file: path });
  if (/^data:image/.test(f.content || '') || /\.(png|jpe?g|gif|webp|svg)$/i.test(name)) return openApp('viewer', { file: path });
  if (/\.(mp3|wav|ogg|mp4|webm)$/i.test(name)) return openApp('media', { });
  if (/\.(html?|xhtml)$/i.test(name)) return openApp('htmlview', { file: path });
  if (/\.(js|json|css)$/i.test(name)) return openApp('code', { file: path });
  if (/\.(txt|csv|md|log)$/i.test(name) || !f.type) return openApp('notepad', { file: path });
  return openApp('notepad', { file: path });
}

function renderWidgets(){
  const layer = $('#widgets'); if (!layer) return;
  layer.innerHTML = '';
  WIDGETS.forEach(wd => {
    const t = WIDGET_TYPES[wd.type]; if (!t) return;
    const card = el('div', { class: 'widget' });
    card.style.cssText = 'left:' + wd.x + 'px;top:' + wd.y + 'px;width:' + t.w + 'px;';
    const bar = el('div', { class: 'widget-bar' },
      el('span', { class: 'widget-ico' }, t.icon),
      el('span', { class: 'widget-name' }, t.name),
      el('button', { class: 'widget-x', title: 'Remove widget' }, '✕'));
    const bodyEl = el('div', { class: 'widget-body' });
    card.append(bar, bodyEl);
    $('.widget-x', bar).onclick = e => { e.stopPropagation(); removeWidget(wd.id); };
    bar.addEventListener('pointerdown', e => {
      if (e.target.closest('.widget-x')) return;
      const r = cssRect($('#desktop'));
      const sx = e.clientX, sy = e.clientY, ox = wd.x, oy = wd.y, w0 = card.offsetWidth, h0 = card.offsetHeight;
      try { bar.setPointerCapture(e.pointerId); } catch(err){}
      const move = ev => {
        wd.x = clamp(ox + ev.clientX - sx, 0, Math.max(0, r.width - w0));
        wd.y = clamp(oy + ev.clientY - sy, 0, Math.max(0, r.height - h0));
        card.style.left = wd.x + 'px'; card.style.top = wd.y + 'px';
      };
      const up = () => {
        bar.removeEventListener('pointermove', move);
        bar.removeEventListener('pointerup', up);
        const spot = placeNoOverlap(card, wd.x, wd.y, card.offsetWidth, card.offsetHeight, false);
        if (spot){ wd.x = Math.round(spot.x); wd.y = Math.round(spot.y); }
        else { wd.x = ox; wd.y = oy; }        // nowhere free — put it back
        card.style.left = wd.x + 'px';
        card.style.top = wd.y + 'px';
        saveWidgets();
      };
      bar.addEventListener('pointermove', move);
      bar.addEventListener('pointerup', up);
    });
    try { t.render(bodyEl, wd); } catch(e){ bodyEl.textContent = 'Widget error'; }
    layer.append(card);
    // whole-widget de-overlap (also tidies saved layouts)
    const fit = placeNoOverlap(card, wd.x, wd.y, card.offsetWidth, card.offsetHeight, false);
    if (fit && fit.moved){ wd.x = Math.round(fit.x); wd.y = Math.round(fit.y); card.style.left = wd.x + 'px'; card.style.top = wd.y + 'px'; saveWidgets(); }
  });
  try { tickWidgets(); } catch(e){}
}

/* non-streaming AI helper reused by the widget */
async function quickAsk(prompt){
  const lim = aiCheckLimit();
  if (!lim.ok) throw new Error(lim.msg);
  const headers = { 'Content-Type': 'application/json' };
  if (AI_KEY) headers.Authorization = 'Bearer ' + AI_KEY;
  const res = await fetch(AI_BASE + '/chat/completions', {
    method: 'POST', headers: headers,
    body: JSON.stringify({ model: store.get('aiModel', AI_MODELS[0]) || AI_MODELS[0],
      messages: [{ role: 'system', content: 'You are uOS Assistant. Be concise.' }, { role: 'user', content: prompt }] })
  });
  if (!res.ok){ const e = await res.json().catch(() => ({})); throw new Error((e.error && e.error.message) || ('HTTP ' + res.status)); }
  aiRecord();
  const j = await res.json();
  return (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '(no response)';
}
