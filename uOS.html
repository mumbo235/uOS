APPS.arcade = {
  name: 'Arcade', icon: '🎮', w: 1000, h: 700,
  mount(body, win){
    let scores = store.get('arcadeScores', {}) || {};
    let plays = store.get('arcadePlays', {}) || {};
    let cat = 'All', query = '';
    let run = null, raf = null, last = 0;

    body.innerHTML = `
      <div id="acMenu" style="display:flex;flex-direction:column;flex:1;min-height:0">
        <div class="toolbar">
          <input class="field" id="acSearch" placeholder="Search ${ARCADE_GAMES.length} games…" style="max-width:210px">
          <div class="chipbar" id="acCats"></div>
          <span class="muted" style="font-size:12px;margin-left:auto" id="acInfo"></span>
        </div>
        <div id="acNote" class="arc-note" style="display:none"></div>
        <div class="arc-grid" id="acGrid"></div>
      </div>
      <div id="acPlay" style="display:none;flex-direction:column;flex:1;min-height:0">
        <div class="toolbar">
          <button class="btn" id="acBack">← All games</button>
          <button class="btn" id="acAgain">↻ Restart</button>
          <button class="btn" id="acPause">⏸ Pause</button>
          <span class="muted" id="acHelp" style="font-size:12px"></span>
          <span class="muted" style="font-size:12px;margin-left:auto">Score <b id="acScore">0</b> · Best <b id="acBest">—</b></span>
        </div>
        <div class="arc-stage">
          <canvas id="acCanvas" tabindex="0"></canvas>
          <div class="arc-over" id="acOver"></div>
        </div>
      </div>`;

    const menu = $('#acMenu', body), playView = $('#acPlay', body);
    const grid = $('#acGrid', body), cats = $('#acCats', body), search = $('#acSearch', body), info = $('#acInfo', body);
    const cv = $('#acCanvas', body), over = $('#acOver', body);
    const scoreEl = $('#acScore', body), bestEl = $('#acBest', body), helpEl = $('#acHelp', body), pauseBtn = $('#acPause', body);
    const ctx = cv.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);

    const bestOf = d => (scores[d.id] == null ? null : scores[d.id]);
    const bestText = d => { const b = bestOf(d); return b == null ? '—' : String(b); };

    /* ---------------------------- the menu ---------------------------- */
    const CATS = ['All'].concat([...new Set(ARCADE_GAMES.map(g => g.cat))]);
    function paintMenu(){
      cats.innerHTML = '';
      CATS.forEach(name => {
        const b = el('button', { class: 'chip' + (cat === name ? ' on' : '') }, name);
        b.onclick = () => { cat = name; paintMenu(); };
        cats.append(b);
      });
      grid.innerHTML = '';
      const q = query.trim().toLowerCase();
      const list = ARCADE_GAMES.filter(g => (cat === 'All' || g.cat === cat) &&
        (!q || g.name.toLowerCase().includes(q) || g.cat.toLowerCase().includes(q) || g.blurb.toLowerCase().includes(q)));
      info.textContent = list.length + (list.length === 1 ? ' game' : ' games') + ' of ' + ARCADE_GAMES.length;
      const note = $('#acNote', body);
      if (cat === 'Casino'){
        note.style.display = 'flex';
        note.innerHTML = '';
        note.append(
          el('div', {}, el('b', {}, 'Play money only. '),
            'You have ' + chipsGet() + ' virtual chips. There is nothing to buy, deposit or cash out — it is a simulation.'),
          el('button', { class: 'btn', onclick: () => { chipsSet(CHIPS_START); toast('Arcade', 'Chips reset to ' + CHIPS_START); paintMenu(); } }, 'Reset chips'));
      } else note.style.display = 'none';
      if (!list.length){
        grid.append(el('div', { class: 'muted', style: 'font-size:12.5px;padding:10px' }, 'Nothing matches those words.'));
        return;
      }
      list.forEach(g => {
        const card = el('button', { class: 'arc-card', title: g.blurb },
          el('span', { class: 'ico' }, g.icon),
          el('span', { class: 'nm' }, g.name),
          el('span', { class: 'bl' }, g.blurb),
          el('span', { class: 'bs' }, bestOf(g) == null
            ? (plays[g.id] ? 'played ' + plays[g.id] + '×' : 'new')
            : (g.lower ? 'best ' + bestOf(g) + ' ' + g.score : 'best ' + bestOf(g) + ' ' + g.score)));
        card.onclick = () => play(g);
        grid.append(card);
      });
    }
    search.addEventListener('input', () => { query = search.value; paintMenu(); });

    /* ------------------------- the game host -------------------------- */
    function resizeCanvas(){
      const r = cssRect(cv);
      const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { w, h };
    }
    function makeApi(){
      const api = {
        ctx, w: 1, h: 1, score: 0, over: false, paused: false, best: 0,
        bank: chips,
        setScore(n){ api.score = Math.max(0, Math.round(n)); scoreEl.textContent = String(api.score); },
        add(n){ api.setScore(api.score + n); },
        end(){ if (api.over) return; api.over = true; finish(); },
        rnd(a, b){ return a + Math.random() * (b - a); },
        ri(a, b){ return Math.floor(a + Math.random() * (b - a + 1)); },
        clamp(v, a, b){ return Math.max(a, Math.min(b, v)); },
        resize(){ const s = resizeCanvas(); api.w = s.w; api.h = s.h; }
      };
      return api;
    }
    function stop(){
      if (raf) cancelAnimationFrame(raf);
      raf = null; run = null;
      over.classList.remove('on');
    }
    function toMenu(){
      stop();
      playView.style.display = 'none';
      menu.style.display = 'flex';
      paintMenu();
    }
    function frame(ts){
      if (!run) return;
      const dt = Math.min(0.05, Math.max(0, (ts - last) / 1000));
      last = ts;
      try {
        if (!run.api.paused && !run.api.over) run.inst.tick(dt);
        run.inst.draw();
      } catch (e){ crash(e); return; }
      raf = requestAnimationFrame(frame);
    }
    function crash(e){
      const def = run && run.def;
      const wasPaused = false;
      if (raf) cancelAnimationFrame(raf);
      raf = null;
      over.innerHTML = '';
      over.append(
        el('h3', {}, 'That game hit a snag'),
        el('div', { class: 'muted', style: 'font-size:12.5px' }, String((e && e.message) || e)),
        el('button', { class: 'btn primary', onclick: () => play(def) }, 'Restart'));
      over.classList.add('on');
      if (run) run.api.over = true;
    }
    function finish(){
      const def = run.def, s = run.api.score;
      const prev = scores[def.id];
      const better = prev == null || (def.lower ? s < prev : s > prev);
      if (better) scores[def.id] = s;
      plays[def.id] = (plays[def.id] || 0) + 1;
      store.set('arcadeScores', scores); store.set('arcadePlays', plays);
      bestEl.textContent = bestText(def);
      over.innerHTML = '';
      over.append(
        el('h3', {}, def.icon + '  Game over'),
        el('div', { class: 'muted', style: 'font-size:13px' },
          'Score ' + s + (better && prev != null ? ' · new best!' : ' · best ' + bestText(def))),
        el('div', { style: 'display:flex;gap:8px;margin-top:8px' },
          el('button', { class: 'btn primary', onclick: () => play(def) }, 'Play again'),
          el('button', { class: 'btn', onclick: toMenu }, 'All games')));
      over.classList.add('on');
    }
    function togglePause(){
      if (!run || run.api.over) return;
      run.api.paused = !run.api.paused;
      pauseBtn.textContent = run.api.paused ? '▶ Resume' : '⏸ Pause';
      if (run.api.paused){
        over.innerHTML = '';
        over.append(el('h3', {}, 'Paused'), el('button', { class: 'btn primary', onclick: togglePause }, 'Resume'));
        over.classList.add('on');
      } else over.classList.remove('on');
    }
    function play(def){
      stop();
      menu.style.display = 'none';
      playView.style.display = 'flex';
      helpEl.textContent = def.help || '';
      bestEl.textContent = bestText(def);
      pauseBtn.textContent = '⏸ Pause';
      over.innerHTML = '';
      const api = makeApi();
      api.best = bestOf(def);
      api.resize();
      run = { def, api, inst: def.make(api) };
      run.inst.reset();
      scoreEl.textContent = '0';
      cv.focus();
      last = performance.now();
      raf = requestAnimationFrame(frame);
    }
    $('#acBack', body).onclick = toMenu;
    $('#acAgain', body).onclick = () => { if (run) play(run.def); };
    pauseBtn.onclick = togglePause;

    /* ---- input ---- */
    function onKey(e){
      if (!run) return;
      if (e.key === 'Escape'){ e.stopPropagation(); toMenu(); return; }
      if (!e.ctrlKey && !e.altKey && !e.metaKey && e.key.toLowerCase() === 'p'){ e.preventDefault(); togglePause(); return; }
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      if (e.key === ' ' || e.key.indexOf('Arrow') === 0) e.preventDefault();
      if (run.inst.key) run.inst.key(e.key === ' ' ? ' ' : e.key.toLowerCase(), true);
    }
    function offKey(e){
      if (run && run.inst.key) run.inst.key(e.key === ' ' ? ' ' : e.key.toLowerCase(), false);
    }
    win.el.addEventListener('keydown', onKey);
    win.el.addEventListener('keyup', offKey);
    cv.addEventListener('pointerdown', e => {
      if (!run || run.api.over) return;
      cv.focus();
      const r = cssRect(cv);
      if (run.inst.tap) run.inst.tap(e.clientX - r.left, e.clientY - r.top);
    });
    cv.addEventListener('contextmenu', e => {
      if (!run) return;
      e.preventDefault();
      if (run.inst.flag){ const r = cssRect(cv); run.inst.flag(e.clientX - r.left, e.clientY - r.top); }
    });
    const onResize = () => { if (run){ run.api.resize(); try { run.inst.draw(); } catch(e){} } };
    window.addEventListener('resize', onResize);

    paintMenu();
    return () => {
      stop();
      win.el.removeEventListener('keydown', onKey);
      win.el.removeEventListener('keyup', offKey);
      window.removeEventListener('resize', onResize);
    };
  }
};

APPS.about = {

/* =====================================================================
   DESKTOP ICONS + START MENU
   ===================================================================== */
const DESKTOP_ICONS = ['trash','browser','files','arcade','ai','terminal','settings','about'];

/* Desktop shortcuts are only *shown* from this list — removing one never
   uninstalls the app, it just takes the icon off the desktop. Apps stay in
   the Start menu, search, Run dialog and everywhere else. */
function hiddenIcons(){ return store.get('hiddenIcons', []) || []; }   /* taken off the desktop */
function addedIcons(){ return store.get('addedIcons', []) || []; }     /* apps the user put on it */
function desktopIcons(){
  const h = hiddenIcons(), a = addedIcons();
  return DESKTOP_ICONS.filter(function(id){ return h.indexOf(id) < 0; })
    .concat(a.filter(function(id){ return APPS[id] && DESKTOP_ICONS.indexOf(id) < 0; }));
}
function onDesktop(id){
  const h = hiddenIcons(), a = addedIcons();
  return (DESKTOP_ICONS.indexOf(id) >= 0 && h.indexOf(id) < 0) || a.indexOf(id) >= 0;
}
function hideDesktopIcon(id){
  if (DESKTOP_ICONS.indexOf(id) >= 0){
    const h = hiddenIcons();
    if (h.indexOf(id) < 0){ h.push(id); store.set('hiddenIcons', h); }
  } else {
    store.set('addedIcons', addedIcons().filter(function(x){ return x !== id; }));
  }
  renderDesktopIcons();
}
function showDesktopIcon(id){
  if (DESKTOP_ICONS.indexOf(id) >= 0){
    store.set('hiddenIcons', hiddenIcons().filter(function(x){ return x !== id; }));
  } else {
    const a = addedIcons();
    if (a.indexOf(id) < 0){ a.push(id); store.set('addedIcons', a); }
  }
  renderDesktopIcons();
}
function restoreDesktopIcons(){
  store.set('hiddenIcons', []);
  store.set('addedIcons', []);
  store.set('iconPos', {});
  renderDesktopIcons();
  toast('Desktop', 'Desktop icons restored to default');
}

/* --------------------------- taskbar pinning ------------------------ */
const DEFAULT_PINS = ['browser', 'files', 'terminal', 'ai'];
let pinnedList = store.get('pinned', null);
/* one-time upgrade: anyone still on the old "Browser + Files" default picks up
   the new default instead; an already-customised set is left alone. */
if (!Array.isArray(pinnedList)) {
  pinnedList = DEFAULT_PINS.slice();
} else if (!store.get('pinsUpgraded', false)) {
  if (pinnedList.length === 2 && pinnedList[0] === 'browser' && pinnedList[1] === 'files') {
    pinnedList = DEFAULT_PINS.slice();
    store.set('pinned', pinnedList);
  }
  store.set('pinsUpgraded', true);
}
function isPinned(id){ return pinnedList.includes(id); }
function pinApp(id){ if (!isPinned(id)){ pinnedList = pinnedList.concat(id); store.set('pinned', pinnedList); rebuildTaskbar(); } }
function unpinApp(id){ pinnedList = pinnedList.filter(x => x !== id); store.set('pinned', pinnedList); rebuildTaskbar(); }

function renderPinned(){
  const host = $('#pinned'); if (!host) return;
  host.innerHTML = '';
  pinnedList.forEach(id => {
    const a = APPS[id]; if (!a) return;
    const b = el('button', { class: 'pin', 'data-app': id, title: a.name + ' — click to open, right-click for options' },
      el('span', { class: 'tico', html: iconHTML(id, a.icon) }));
    b.addEventListener('click', () => {
      const w = [...windows.values()].find(x => x.appId === id);
      if (!w) openApp(id);
      else if (w.minimized) restoreWin(w);
      else if (activeWin === w) minimizeWin(w);
      else focusWin(w);
    });
    b.addEventListener('contextmenu', e => {
      e.preventDefault(); e.stopPropagation();
      const w = [...windows.values()].find(x => x.appId === id);
      showContext(e.clientX, e.clientY, [
        { label: 'Open ' + a.name, act: () => openApp(id) },
        w ? { label: 'Close window', act: () => closeWin(w) } : null,
        { sep: true },
        { label: 'Unpin from taskbar', act: () => { unpinApp(id); toast('Taskbar', 'Unpinned ' + a.name); } }
      ].filter(Boolean));
    });
    host.append(b);
  });
}

function makeTaskItem(win){
  const ti = el('button', { class: 'taskitem', title: win.app.name },
    el('span', { class: 'tico', html: iconHTML(win.appId, win.app.icon) }),
    el('span', { class: 'tlabel' }, win.app.name));
  ti.addEventListener('click', () => {
    if (win.minimized) restoreWin(win);
    else if (activeWin === win) minimizeWin(win);
    else focusWin(win);
  });
  ti.addEventListener('contextmenu', e => {
    e.preventDefault(); e.stopPropagation();
    showContext(e.clientX, e.clientY, [
      { label: 'Pin to taskbar', act: () => { pinApp(win.appId); toast('Taskbar', 'Pinned ' + win.app.name); } },
      { label: 'Move to desktop…', act: () => moveMenu(win) },
      { sep: true },
      { label: 'Close window', act: () => closeWin(win) }
    ]);
  });
  return ti;
}
function attachTaskEl(win){
  if (win.taskEl && win.taskEl.classList.contains('taskitem') && !isPinned(win.appId)) return;
  if (win.taskEl && win.taskEl.classList.contains('taskitem')) win.taskEl.remove();
  const pin = isPinned(win.appId) ? $('#pinned .pin[data-app="' + win.appId + '"]') : null;
  if (pin){
    win.taskEl = pin;
    pin.classList.add('has-task');
    if (activeWin === win) pin.classList.add('active');
  } else {
    win.taskEl = makeTaskItem(win);
    $('#taskItems').append(win.taskEl);
  }
}
function rebuildTaskbar(){
  renderPinned();
  [...windows.values()].forEach(attachTaskEl);
  if (activeWin && activeWin.taskEl) activeWin.taskEl.classList.add('active');
}

const ICON_GRID = { w: 90, h: 96, pad: 10, gap: 2 };
function measureIconCell(){
  const probe = document.createElement('div');
  probe.className = 'dicon';
  probe.setAttribute('style', 'visibility:hidden;left:0;top:0');
  probe.innerHTML = '<div class="ico">' + iconHTML('files', '📁') + '</div><div class="lbl">Nova Browser</div>';
  $('#icons').append(probe);
  ICON_GRID.w = (probe.offsetWidth || 86) + ICON_GRID.gap;
  ICON_GRID.h = (probe.offsetHeight || 90) + ICON_GRID.gap;
  probe.remove();
}
function deskIconSlot(i, h){
  const rows = Math.max(1, Math.floor((h - ICON_GRID.pad) / ICON_GRID.h));
  return { x: ICON_GRID.pad + Math.floor(i / rows) * ICON_GRID.w, y: ICON_GRID.pad + (i % rows) * ICON_GRID.h };
}
/* snap an axis value to the icon grid, clamped so the icon stays fully on screen */
function snapAxis(v, cell, pad, max){
  const maxIdx = Math.max(0, Math.floor((max - pad) / cell));
  const idx = Math.max(0, Math.min(Math.round((v - pad) / cell), maxIdx));
  return pad + idx * cell;
}
/* pull every icon back on-screen (used after the window is resized) */
function clampIconsToScreen(){
  const rect = cssRect($('#desktop'));
  const save = store.get('iconPos', {}) || {};
  $$('.dicon').forEach(n => {
    const iw = n.offsetWidth || 86, ih = n.offsetHeight || 90;
    const x = snapAxis(parseFloat(n.style.left) || 0, ICON_GRID.w, ICON_GRID.pad, rect.width - iw);
    const y = snapAxis(parseFloat(n.style.top) || 0, ICON_GRID.h, ICON_GRID.pad, rect.height - ih);
    n.style.left = x + 'px'; n.style.top = y + 'px';
    save[n.dataset.app] = { x, y };
  });
  store.set('iconPos', save);
}
function autoArrangeIcons(){ store.set('iconPos', {}); renderDesktopIcons(); }

/* ---------------- stop desktop things overlapping each other -------- */
function deskArea(){ return cssRect($('#desktop')); }
function objectRects(exclude, noIcons){
  const d = deskArea();
  const out = [];
  $$(noIcons ? '.widget, .stickynote' : '.dicon, .widget, .stickynote').forEach(n => {
    if (n === exclude) return;
    if (exclude && exclude.contains && exclude.contains(n)) return;
    if (!n.isConnected) return;
    const r = cssRect(n);
    if (!r.width || !r.height) return;
    out.push({ x: r.left - d.left, y: r.top - d.top, w: r.width, h: r.height });
  });
  return out;
}
function hitsAny(r, list, pad){
  pad = pad || 0;
  for (let i = 0; i < list.length; i++){
    const o = list[i];
    if (!(r.x + r.w + pad <= o.x || r.x >= o.x + o.w + pad || r.y + r.h + pad <= o.y || r.y >= o.y + o.h + pad)) return true;
  }
  return false;
}
/* nearest free spot anywhere on the desktop (rects move in 12px steps) */
function freeSpot(x, y, w, h, list, area, step){
  step = step || 12;
  const maxX = Math.max(0, area.width - w), maxY = Math.max(0, area.height - h);
  const at = function(px, py){
    px = Math.min(Math.max(0, px), maxX); py = Math.min(Math.max(0, py), maxY);
    return hitsAny({ x: px, y: py, w: w, h: h }, list, 0) ? null : { x: px, y: py };
  };
  let hit = at(x, y); if (hit) return hit;
  for (let ring = 1; ring <= 40; ring++){
    for (let dx = -ring; dx <= ring; dx++) for (let dy = -ring; dy <= ring; dy++){
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== ring) continue;
      hit = at(x + dx * step, y + dy * step);
      if (hit) return hit;
    }
  }
  return null;
}
/* same, but locked to the icon grid */
function freeIconSpot(cx, cy, w, h, list, area){
  const maxCX = Math.max(0, Math.floor((area.width - ICON_GRID.pad - w) / ICON_GRID.w));
  const maxCY = Math.max(0, Math.floor((area.height - ICON_GRID.pad - h) / ICON_GRID.h));
  const at = function(a, b){
    if (a < 0 || b < 0 || a > maxCX || b > maxCY) return null;
    const px = ICON_GRID.pad + a * ICON_GRID.w, py = ICON_GRID.pad + b * ICON_GRID.h;
    return hitsAny({ x: px, y: py, w: w, h: h }, list, 0) ? null : { x: px, y: py };
  };
  let hit = at(cx, cy); if (hit) return hit;
  for (let ring = 1; ring <= 25; ring++){
    for (let dx = -ring; dx <= ring; dx++) for (let dy = -ring; dy <= ring; dy++){
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== ring) continue;
      hit = at(cx + dx, cy + dy);
      if (hit) return hit;
    }
  }
  return null;
}
function iconCellOf(node){
  return {
    cx: Math.round(((parseFloat(node.style.left) || 0) - ICON_GRID.pad) / ICON_GRID.w),
    cy: Math.round(((parseFloat(node.style.top) || 0) - ICON_GRID.pad) / ICON_GRID.h)
  };
}
function placeNoOverlap(node, x, y, w, h, isIcon){
  const others = objectRects(node);
  if (!hitsAny({ x: x, y: y, w: w, h: h }, others, 0)) return { x: x, y: y, moved: false };
  const spot = isIcon
    ? freeIconSpot(Math.round((x - ICON_GRID.pad) / ICON_GRID.w), Math.round((y - ICON_GRID.pad) / ICON_GRID.h), w, h, others, deskArea())
    : freeSpot(x, y, w, h, others, deskArea());
  return spot ? { x: spot.x, y: spot.y, moved: true } : null;
}
function renderDesktopIcons(){
  const host = $('#icons');
  host.innerHTML = '';
  const rect = cssRect($('#desktop'));
  measureIconCell();
  const saved = store.get('iconPos', {}) || {};
  desktopIcons().forEach((id, i) => {
    const a = APPS[id]; if (!a) return;
    const n = el('div', { class: 'dicon', 'data-app': id },
      el('div', { class: 'ico', html: iconHTML(id, a.icon) }),
      el('div', { class: 'lbl' }, a.name));
    /* long single-word names shrink to fit one line instead of splitting
       mid-word and spilling into the icon underneath */
    const lblEl = n.querySelector('.lbl');
    if (lblEl){
      if (!/\s/.test(a.name) && a.name.length > 10){
        lblEl.style.fontSize = Math.max(9, 12 - (a.name.length - 10) * 0.5).toFixed(1) + 'px';
        lblEl.style.whiteSpace = 'nowrap';
      }
      lblEl.style.lineHeight = '1.15';
    }
    if (id === 'trash' && typeof TRASH !== 'undefined' && TRASH.length){
      n.append(el('span', { class: 'dicon-badge' }, String(Math.min(99, TRASH.length))));
    }
    host.append(n);                      // measure it, then place it snapped on-grid
    const iw = n.offsetWidth || 86, ih = n.offsetHeight || 90;
    const src = saved[id] || deskIconSlot(i, rect.height);
    n.style.left = snapAxis(src.x || 0, ICON_GRID.w, ICON_GRID.pad, rect.width - iw) + 'px';
    n.style.top = snapAxis(src.y || 0, ICON_GRID.h, ICON_GRID.pad, rect.height - ih) + 'px';

    n.addEventListener('click', e => {
      if (n.__dragged){ n.__dragged = false; return; }
      if (e.ctrlKey || e.metaKey || e.shiftKey) n.classList.toggle('sel');
      else { $$('.dicon').forEach(x => x.classList.remove('sel')); n.classList.add('sel'); }
    });
    n.addEventListener('dblclick', () => { if (!n.__dragged) openApp(id); });
    n.addEventListener('contextmenu', e => {
      e.preventDefault(); e.stopPropagation();
      if (!n.classList.contains('sel')){ $$('.dicon').forEach(x => x.classList.remove('sel')); n.classList.add('sel'); }
      showContext(e.clientX, e.clientY, [
        { label: 'Open', act: () => openApp(id) },
        { sep: true },
        isPinned(id)
          ? { label: 'Unpin from taskbar', act: () => unpinApp(id) }
          : { label: 'Pin to taskbar', act: () => pinApp(id) },
        { sep: true },
        { label: 'Auto arrange icons', act: autoArrangeIcons },
        { label: 'Remove from desktop', act: () => {
            hideDesktopIcon(id);
            toast('Desktop', a.name + ' removed — still in the Start menu');
          } }
      ]);
    });

    /* ---- drag to move (moves the whole selection if several are selected) ---- */
    n.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      const drect = cssRect($('#desktop'));
      const sel = $$('.dicon.sel');
      const group = (n.classList.contains('sel') && sel.length > 1) ? sel : [n];
      const start = group.map(g => ({ node: g, x: parseFloat(g.style.left) || 0, y: parseFloat(g.style.top) || 0, w: g.offsetWidth || 92, h: g.offsetHeight || 96 }));
      const sx = e.clientX, sy = e.clientY;
      let moved = false;
      try { n.setPointerCapture(e.pointerId); } catch(err){}
      start.forEach(s => { s.node.style.transition = 'none'; });   // follow the cursor smoothly
      const move = ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!moved && Math.abs(dx) + Math.abs(dy) > 4) moved = true;
        if (!moved) return;
        start.forEach(s => {
          // free movement, but kept on-screen
          s.node.style.left = clamp(s.x + dx, 0, Math.max(0, drect.width - s.w)) + 'px';
          s.node.style.top = clamp(s.y + dy, 0, Math.max(0, drect.height - s.h)) + 'px';
        });
      };
      const up = () => {
        n.removeEventListener('pointermove', move);
        n.removeEventListener('pointerup', up);
        start.forEach(s => { s.node.style.transition = ''; });   // restore the CSS transition
        if (!moved) return;
        n.__dragged = true;
        const save = store.get('iconPos', {}) || {};
        start.forEach(s => {
          let x = snapAxis(parseFloat(s.node.style.left) || 0, ICON_GRID.w, ICON_GRID.pad, drect.width - s.w);
          let y = snapAxis(parseFloat(s.node.style.top) || 0, ICON_GRID.h, ICON_GRID.pad, drect.height - s.h);
          const spot = placeNoOverlap(s.node, x, y, s.w, s.h, true);
          if (spot){ x = spot.x; y = spot.y; }
          else { x = s.x; y = s.y; }          // nothing free — go back where it was
          void s.node.offsetWidth;           // reflow with the transition active…
          s.node.style.left = x + 'px';      // …then animate into the snapped slot
          s.node.style.top = y + 'px';
          save[s.node.dataset.app] = { x, y };
        });
        store.set('iconPos', save);
      };
      n.addEventListener('pointermove', move);
      n.addEventListener('pointerup', up);
    });
  });
  /* never let two icons share a grid cell */
  const usedCells = new Set();
  $$('.dicon').forEach(function(node){
    const w = node.offsetWidth || 86, h = node.offsetHeight || 90;
    const cur = iconCellOf(node);
    const key = cur.cx + ',' + cur.cy;
    if (!usedCells.has(key)){ usedCells.add(key); return; }
    const spot = freeIconSpot(cur.cx, cur.cy, w, h, objectRects(node), cssRect($('#desktop')));
    if (spot){
      node.style.left = spot.x + 'px';
      node.style.top = spot.y + 'px';
      usedCells.add(Math.round((spot.x - ICON_GRID.pad) / ICON_GRID.w) + ',' + Math.round((spot.y - ICON_GRID.pad) / ICON_GRID.h));
    }
  });
}
function renderStartMenu(filter = ''){
  const g = $('#smGrid');
  g.innerHTML = '';
  const q = filter.trim().toLowerCase();
  const entries = Object.entries(APPS).filter(([, a]) => !a.hidden && (!q || a.name.toLowerCase().includes(q) || a.icon.includes(q)));
  const fileHits = q ? Object.keys(FS).filter(k => FS[k] && FS[k].type === 'file' && k.toLowerCase().includes(q)).slice(0, 8) : [];
  $('#smTitle').textContent = q ? 'Results' : 'All apps';
  $('#smCount').textContent = q ? (entries.length + fileHits.length + ' found') : (Object.keys(APPS).length + ' apps');
  if (!entries.length && !fileHits.length){ g.innerHTML = '<div class="empty" style="grid-column:1/-1">No matches</div>'; return; }
  fileHits.forEach(p => {
    const b = el('button', { class: 'sm-app' },
      el('div', { class: 'ico', style: 'font-size:26px' }, fileIcon(p.split('/').pop(), 'file')),
      el('div', { class: 'lbl', title: p }, p.split('/').pop()));
    b.onclick = () => { openPath(p); toggleStart(false); };
    g.append(b);
  });
  entries.forEach(([id, a]) => {
    const b = el('button', { class: 'sm-app' }, el('div', { class: 'ico', html: iconHTML(id, a.icon) }), el('div', { class: 'lbl' }, a.name));
    b.onclick = () => { openApp(id); toggleStart(false); };
    b.addEventListener('contextmenu', e => {
      e.preventDefault(); e.stopPropagation();
      showContext(e.clientX, e.clientY, [
        { label: 'Open', act: () => { openApp(id); toggleStart(false); } },
        { sep: true },
        isPinned(id)
          ? { label: 'Unpin from taskbar', act: () => { unpinApp(id); toast('Taskbar', 'Unpinned ' + a.name); } }
          : { label: 'Pin to taskbar', act: () => { pinApp(id); toast('Taskbar', 'Pinned ' + a.name); } },
        { sep: true },
        onDesktop(id)
          ? { label: 'Remove from desktop', act: () => { hideDesktopIcon(id); toast('Desktop', a.name + ' removed from the desktop'); } }
          : { label: 'Add to desktop', act: () => { showDesktopIcon(id); toast('Desktop', a.name + ' added to the desktop'); } }
      ]);
    });
    g.append(b);
  });
}

/* ---------------------------- context menu -------------------------- */
function showContext(x, y, items){
  showContext.lastX = x; showContext.lastY = y;      // so a follow-up menu can reuse it
  const m = $('#ctxMenu');
  m.innerHTML = '';
  items.filter(Boolean).forEach(it => {
    if (it.sep){ m.append(el('div', { class: 'ctx-sep' })); return; }
    const b = el('button', { class: 'ctx' + (it.disabled ? ' disabled' : '') },
      it.icon ? el('span', { style: 'width:16px;display:inline-block;text-align:center' }, it.icon) : null,
      el('span', {}, it.label),

/* ---- desktop: click-and-drag rubber-band selection ---- */
const selbox = $('#selbox');
$('#desktop').addEventListener('pointerdown', e => {
  if (e.target === $('#desktop')) toggleStart(false);
  const empty = e.target === $('#desktop') || e.target === $('#icons') || e.target === selbox;
  if (!empty || e.button !== 0) return;
  const additive = e.ctrlKey || e.metaKey || e.shiftKey;
  const keep = additive ? $$('.dicon.sel') : [];
  if (!additive) $$('.dicon').forEach(x => x.classList.remove('sel'));
  const rect = cssRect($('#desktop'));
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  selbox.style.display = 'block';
  Object.assign(selbox.style, { left: sx + 'px', top: sy + 'px', width: '0px', height: '0px' });
  const move = ev => {
    const cx = ev.clientX - rect.left, cy = ev.clientY - rect.top;
    const x = Math.min(sx, cx), y = Math.min(sy, cy), w = Math.abs(cx - sx), h = Math.abs(cy - sy);
    Object.assign(selbox.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
    $$('.dicon').forEach(ic => {
      const b = cssRect(ic);
      const ix = b.left - rect.left, iy = b.top - rect.top;
      const hit = !(ix + b.width < x || ix > x + w || iy + b.height < y || iy > y + h);
      ic.classList.toggle('sel', hit || keep.includes(ic));
    });
  };
  const up = () => {
    selbox.style.display = 'none';
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
});

/* ---- live network information ---- */
function netInfo(){
  const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection || {};
  return { online: navigator.onLine, type: c.effectiveType || null,
           down: c.downlink, rtt: c.rtt, saveData: c.saveData };
}
async function netTest(out){
  out.textContent = 'Testing…';
  const url = CDN + 'npm/jquery@3.7.1/dist/jquery.min.js?_=' + Date.now();
  const t0 = performance.now();
  try {
    const res = await fetch(url, { cache: 'no-store' });
    const buf = await res.arrayBuffer();
    const ms = performance.now() - t0;
    const mbps = (buf.byteLength * 8 / 1e6) / (ms / 1000);
    out.textContent = 'Latency ' + Math.round(ms) + ' ms · ~' + mbps.toFixed(1) + ' Mbps · ' + Math.round(buf.byteLength / 1024) + ' KB';
  } catch(e){
    out.textContent = navigator.onLine ? 'Test failed — the request was blocked' : 'You appear to be offline';
  }
}

function batteryInfo(){
  const b = __battery; if (!b) return null;

    : (function(){ const m = Math.round(s / 60); return Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; })();
  return { pct: Math.round(b.level * 100), charging: !!b.charging,
           toFull: b.charging ? hm(b.chargingTime) : null,

}

      el('div', { id: 'lockSplash', style: 'font-size:12px;font-weight:600;color:#c9a45f;opacity:.9;transform:rotate(-2.5deg);max-width:360px;text-align:center' }, randSplash()),
      el('div', { id: 'lockPinRow', style: 'display:none;gap:8px;align-items:center' },
        el('input', { class: 'field', id: 'lockPinInput', type: 'password', placeholder: 'PIN', style: 'width:130px;text-align:center' }),
        el('button', { class: 'btn primary', id: 'lockPinGo' }, 'Unlock')));
    ov.append(box);
    $('#lockPinGo', ov).onclick = tryUnlock;
    $('#lockPinInput', ov).addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
  }
  box.style.display = 'flex';
  const ls = $('#lockSplash');
  if (ls) applySplash(ls);
  const pinRow = $('#lockPinRow', ov);

  } else {
    pinRow.style.display = 'none';
    back.style.display = 'inline-block'; back.textContent = 'Unlock';
  }
  updateClock();
}
function tryUnlock(){
  const inp = $('#lockPinInput');
  if (settings.lockPin && (!inp || inp.value !== settings.lockPin)){ toast('Lock screen', 'Incorrect PIN'); return; }
  unlockScreen();
}
function unlockScreen(){

/* idle -> auto lock */
let __lastAct = Date.now();

/* =====================================================================
   COMMAND PALETTE — Ctrl+K
   Apps, files, settings sections and quick commands in one box.
   ===================================================================== */
const PALETTE_COMMANDS = [
  { icon: '🌗', label: 'Toggle dark / light theme', run(){ settings.theme = settings.theme === 'dark' ? 'light' : 'dark'; saveSettings(); } },
  { icon: '🔒', label: 'Lock the screen', run(){ lockScreen(); } },
  { icon: '🎨', label: 'Cycle the wallpaper', run(){ settings.wallpaper = (settings.wallpaper + 1) % WALLPAPERS.length; settings.customWall = null; saveSettings(); } },
  { icon: '🌙', label: 'Toggle night light', run(){ settings.nightLight = !settings.nightLight; saveSettings(); } },
  { icon: '➕', label: 'Zoom in', run(){ zoomBy(10); } },
  { icon: '➖', label: 'Zoom out', run(){ zoomBy(-10); } },
  { icon: '🔄', label: 'Reset zoom to 100%', run(){ settings.zoom = 100; saveSettings(); } },
  { icon: '📌', label: 'Move the taskbar to the top / bottom', run(){ settings.tbPos = settings.tbPos === 'top' ? 'bottom' : 'top'; saveSettings(); } },
  { icon: '↔️', label: 'Switch taskbar alignment', run(){ settings.tbAlign = settings.tbAlign === 'center' ? 'left' : 'center'; saveSettings(); } },
  { icon: '🔊', label: 'Mute / unmute sound', run(){ settings.muted = !settings.muted; saveSettings(); applyVolumes(); } },
  { icon: '📶', label: 'Toggle Wi-Fi (simulated)', run(){ settings.wifi = !settings.wifi; saveSettings(); } },
  { icon: '🗑️', label: 'Empty the Recycle Bin', run(){ if (!TRASH.length) return toast('Recycle Bin', 'Already empty'); trashEmpty(); toast('Recycle Bin', 'Emptied'); } },
  { icon: '📋', label: 'Clear clipboard history', run(){ CLIPBOARD = []; store.set('clipboard', CLIPBOARD); toast('Clipboard', 'History cleared'); } },
  { icon: '🧹', label: 'Auto-arrange desktop icons', run(){ autoArrangeIcons(); toast('Desktop', 'Icons rearranged'); } },
  { icon: '📝', label: 'New sticky note', run(){ newStickyNote(); } },
  { icon: '💾', label: 'Export a backup', run(){ exportBackup(); } },
  { icon: '⬆️', label: 'Check for updates', run(){ checkForUpdate({ manual: true }); } },
  { icon: '💥', label: 'Reload uOS', run(){ saveSession(true); location.reload(); } }
];

let palOpen = false, palRows = [], palSel = 0;
/* used until the Settings app has been mounted once, then it publishes the real list */
const PALETTE_SETTINGS = ['Personalization','Display','Zoom & scale','Taskbar','Sound','Notifications','Date & time','Windows','Power','Accessibility','Storage','About & backup'];
function openSettingsSection(name){
  const ex = [...windows.values()].find(w => w.appId === 'settings');
  if (ex) closeWin(ex);                       // single:true would otherwise ignore the section
  openApp('settings', { section: name });
}

function paletteItems(query){
  const q = String(query || '').trim().toLowerCase();
  const all = [];
  const add = (icon, label, sub, group, run) => all.push({ icon: icon, label: label, sub: sub, group: group, run: run });
  PALETTE_COMMANDS.forEach(c => add(c.icon, c.label, 'Command', 'cmd', c.run));
  Object.keys(APPS).forEach(id => {
    const a = APPS[id];
    add(a.icon, a.name, 'App', 'app', () => openApp(id));
  });
  const settingsNames = (APPS.settings.sections && APPS.settings.sections.length) ? APPS.settings.sections : PALETTE_SETTINGS;
  settingsNames.forEach(name => add('⚙️', 'Settings · ' + name, 'Settings', 'set', () => openSettingsSection(name)));
  Object.keys(FS).forEach(path => {
    const f = FS[path];
    if (!f || f.type !== 'file') return;
    add(fileIcon(path, f.type), path.split('/').pop(), path, 'file', () => openPath(path));
  });
  if (!q){
    /* nothing typed: commands and apps are the useful defaults */
    const fav = all.filter(x => x.group === 'cmd' || x.group === 'app');
    return fav.slice(0, 12);
  }
  const hits = [];
  all.forEach(it => {
    const hay = (it.label + ' ' + it.sub).toLowerCase();
    const at = hay.indexOf(q);
    if (at < 0) return;
    let score = at + hay.length / 100;
    if (it.label.toLowerCase().indexOf(q) === 0) score -= 100;
    if (it.group === 'cmd') score -= 8;
    else if (it.group === 'app') score -= 5;
    else if (it.group === 'set') score -= 2;
    hits.push({ it: it, score: score });
  });
  return hits.sort((a, b) => a.score - b.score).slice(0, 12).map(h => h.it);
}
function renderPalette(q){
  palRows = paletteItems(q);
  palSel = 0;
  const list = $('#palList');
  list.innerHTML = '';
  if (!palRows.length){
    list.append(el('div', { class: 'pal-empty' }, 'Nothing matches that.'));
    return;
  }
  palRows.forEach((it, i) => {
    const row = el('div', { class: 'pal-row' + (i === palSel ? ' on' : ''), 'data-i': i },
      el('span', { class: 'pi' }, it.icon),
      el('span', { class: 'pt' }, it.label),
      el('span', { class: 'ps' }, it.sub));
    row.addEventListener('mousemove', () => { if (palSel !== i){ palSel = i; paintPaletteSel(); } });
    row.addEventListener('click', () => runPalette(i));
    list.append(row);
  });
}
function paintPaletteSel(){
  $$('#palList .pal-row').forEach((r, i) => r.classList.toggle('on', i === palSel));
  const on = $('#palList .pal-row.on');
  if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
}
function openPalette(){
  palOpen = true;
  $('#palette').classList.add('open');
  const inp = $('#palInput');
  inp.value = '';
  renderPalette('');
  setTimeout(() => inp.focus(), 20);
}
function closePalette(){ palOpen = false; $('#palette').classList.remove('open'); }
function runPalette(i){
  const it = palRows[i];
  if (!it) return;
  closePalette();
  try { it.run(); } catch(e){ toast('uOS', 'That did not work: ' + (e && e.message || e)); }
}
function paletteKey(e){
  if (!palOpen){
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'k'){ e.preventDefault(); openPalette(); }
    return;
  }
  if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); closePalette(); }
  else if (e.key === 'ArrowDown'){ e.preventDefault(); palSel = Math.min(palRows.length - 1, palSel + 1); paintPaletteSel(); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); palSel = Math.max(0, palSel - 1); paintPaletteSel(); }
  else if (e.key === 'Enter'){ e.preventDefault(); runPalette(palSel); }
}
document.addEventListener('keydown', paletteKey, true);
$('#palInput').addEventListener('input', e => renderPalette(e.target.value));
$('#palette').addEventListener('click', e => { if (e.target && e.target.id === 'palette') closePalette(); });

/* global shortcuts */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ toggleStart(false); hideContext(); }
  if (e.ctrlKey && e.altKey && /^[1-4]$/.test(e.key)){
    e.preventDefault();
    if (e.shiftKey && activeWin) moveWinToDesk(activeWin, +e.key - 1);
    else switchDesk(+e.key - 1);
    return;
  }
  if (e.ctrlKey && e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){
    e.preventDefault();
    const dir = e.key === 'ArrowRight' ? 1 : -1;
    const n = (curDesk + dir + DESK_COUNT) % DESK_COUNT;
    if (e.shiftKey && activeWin) moveWinToDesk(activeWin, n);
    else switchDesk(n);
    return;
  }
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 't'){ e.preventDefault(); openApp('terminal'); }
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'g'){ e.preventDefault(); openApp('arcade'); }
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'r'){ e.preventDefault(); openApp('run'); }
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 's'){ e.preventDefault(); openApp('settings'); }
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'l'){ e.preventDefault(); lockScreen(); }
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'c'){ e.preventDefault(); openApp('clipboard'); }
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'a'){ e.preventDefault(); openApp('ai'); }
  if (e.ctrlKey && e.altKey && (e.key === '=' || e.key === '+')){ e.preventDefault(); zoomBy(10); }
  if (e.ctrlKey && e.altKey && (e.key === '-' || e.key === '_')){ e.preventDefault(); zoomBy(-10); }
  if (e.ctrlKey && e.altKey && (e.key === '0' || e.key === ')')){ e.preventDefault(); settings.zoom = 100; saveSettings(); toast('Zoom & scale', 'Interface scale 100%'); }
});

/* --------------------------- first-run tour ------------------------- */
const TOUR_STEPS = [
  { title: 'Welcome to uOS', text: 'A quick one-minute tour of the main bits. Skip it any time \u2014 you can replay it later from Settings.', sel: null },
  { title: 'Your desktop', text: 'Double-click an icon to open an app. Drag icons to move them \u2014 they snap to a grid and never overlap.', sel: '.dicon', multi: true },
  { title: 'Right-click anywhere', text: 'Right-click the wallpaper for New folder, New text document, sticky notes, widgets and personalisation.', sel: null },
  { title: 'Start menu', text: 'Every app lives behind the Start button. Search apps, files and settings from here.', sel: '#startBtn' },
  { title: 'Taskbar', text: 'Pinned and running apps sit here. Right-click it for Task Manager, Task View and layout options.', sel: '#taskbar' },
  { title: 'System tray', text: 'Wi-Fi, volume, battery, notifications and the clock. The chevron opens quick actions.', sel: '#tray' },
  { title: 'Widgets & notes', text: 'The Widgets app \u2014 or the desktop right-click menu \u2014 drops live cards on your desktop: clock, calendar, to-do, Ask AI.', sel: null },
  { title: 'Keyboard shortcuts', text: 'Alt+Tab switches windows. Ctrl+Alt+T terminal \u00b7 A AI \u00b7 S settings \u00b7 L lock.', sel: null },
  { title: 'That\u2019s it!', text: 'Enjoy uOS. Replay this tour any time from Settings \u2192 About & backup.', sel: null }
];
let __tourEls = null, __tourStep = 0;
function tourEls(){
  if (__tourEls) return __tourEls;
  const wrap = el('div', { id: 'tour' });
  const spot = el('div', { id: 'tourSpot' });
  const card = el('div', { id: 'tourCard' });
  wrap.append(spot, card);
  document.body.append(wrap);
  __tourEls = { wrap: wrap, spot: spot, card: card };
  return __tourEls;
}
function tourTargetRect(step){
  if (!step.sel) return null;
  const nodes = $$(step.sel).filter(function(n){ return n.getBoundingClientRect().width; });
  if (!nodes.length) return null;
  if (step.multi){
    let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
    nodes.forEach(function(n){
      const q = cssRect(n);
      l = Math.min(l, q.left); t = Math.min(t, q.top); r = Math.max(r, q.right); b = Math.max(b, q.bottom);
    });
    return { left: l, top: t, right: r, bottom: b, width: r - l, height: b - t };
  }
  return cssRect(nodes[0]);
}
function renderTour(){
  const T = tourEls(), step = TOUR_STEPS[__tourStep];
  const pad = 6;
  const rect = tourTargetRect(step);
  if (rect){
    const l = Math.max(0, rect.left - pad), t = Math.max(0, rect.top - pad);
    T.spot.style.display = 'block';
    T.spot.style.left = l + 'px';
    T.spot.style.top = t + 'px';
    T.spot.style.width = Math.min(VW() - l, rect.width + pad * 2) + 'px';
    T.spot.style.height = Math.min(VH() - t, rect.height + pad * 2) + 'px';
  } else {
    T.spot.style.display = 'block';
    T.spot.style.left = '50%'; T.spot.style.top = '46%';
    T.spot.style.width = '0px'; T.spot.style.height = '0px';
  }
  T.card.innerHTML = '';
  T.card.append(
    el('div', { class: 'tour-kicker' }, 'Step ' + (__tourStep + 1) + ' of ' + TOUR_STEPS.length),
    el('h3', {}, step.title),
    el('p', {}, step.text)
  );
  const dots = el('div', { id: 'tourDots' });
  TOUR_STEPS.forEach(function(_, i){ dots.append(el('i', { class: i === __tourStep ? 'on' : '' })); });
  T.card.append(dots);
  const btns = el('div', { id: 'tourBtns' });
  btns.append(el('button', { class: 'btn', onclick: function(){ endTour(); } }, 'Skip'));
  if (__tourStep > 0) btns.append(el('button', { class: 'btn', onclick: function(){ __tourStep--; renderTour(); } }, 'Back'));
  btns.append(el('button', {
    class: 'btn primary',
    onclick: function(){
      if (__tourStep >= TOUR_STEPS.length - 1) endTour();
      else { __tourStep++; renderTour(); }
    }
  }, __tourStep >= TOUR_STEPS.length - 1 ? 'Done' : 'Next'));
  T.card.append(btns);
  // position the card next to the spotlight
  requestAnimationFrame(function(){
    const cw = T.card.offsetWidth, ch = T.card.offsetHeight;
    let left = VW() / 2 - cw / 2, top = VH() / 2 - ch / 2;
    if (rect && rect.width){
      const cx = rect.left + rect.width / 2;
      left = cx - cw / 2;
      top = (rect.bottom + ch + 24 < VH()) ? rect.bottom + 14 : Math.max(12, rect.top - ch - 14);
    }
    T.card.style.left = Math.max(12, Math.min(left, VW() - cw - 12)) + 'px';
    T.card.style.top = Math.max(12, Math.min(top, VH() - ch - 12)) + 'px';
  });
}
function startTour(from){
  __tourStep = from || 0;
  tourEls().wrap.classList.add('on');
  renderTour();
}
function endTour(){
  tourEls().wrap.classList.remove('on');
  store.set('tourDone', true);
}
function maybeTour(){
  if (settings.showTour === false) return;
  if (store.get('tourDone', false)) return;
  setTimeout(function(){ startTour(0); }, 900);
}
document.addEventListener('keydown', function(e){
  if (!__tourEls || !__tourEls.wrap.classList.contains('on')) return;
  if (e.key === 'Escape'){ endTour(); }
  else if (e.key === 'ArrowRight' || e.key === 'Enter'){ if (__tourStep >= TOUR_STEPS.length - 1) endTour(); else { __tourStep++; renderTour(); } }
  else if (e.key === 'ArrowLeft' && __tourStep > 0){ __tourStep--; renderTour(); }
});
