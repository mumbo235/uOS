APPS.terminal = {
  name: 'Terminal', icon: '>_', w: 700, h: 460,
  mount(body, win){
    body.innerHTML = `<div class="term"><div class="out"></div><div class="in"><span class="p">user@uos:~$</span><input spellcheck="false" autocomplete="off"></div></div>`;
    const term = $('.term', body), out = $('.out', body), input = $('.in input', body);
    let cwd = '~';
    const home = '~';
    const abs = p => {
      if (!p) return cwd;
      if (p.startsWith('/')) return p.replace(/^\/+|\/+$/g,'') || '/';
      if (p === '~') return home;
      if (p.startsWith('~/')) p = p.slice(2);
      const base = cwd === '~' || cwd === '/' ? '' : cwd + '/';
      const out2 = [];
      for (const seg of (base + p).split('/')){
        if (!seg || seg === '.') continue;
        if (seg === '..') out2.pop(); else out2.push(seg);
      }
      return out2.join('/') || '/';
    };
    const prompt_ = () => cwd === '~' ? cwd : cwd;
    function line(text = '', cls = ''){ out.append(el('div', { class: cls }, text)); term.scrollTop = term.scrollHeight; }
    function banner(){
      line('uOS Terminal v1.0  —  type "help" for a list of commands', 'ok');
      line('');
    }
    const COMMANDS = {
      help(){ line('Available commands:');
        line('  help            this message');
        line('  ls [dir]        list files');
        line('  cd <dir>        change directory');
        line('  cat <file>      print a file');
        line('  echo <text>     print text');
        line('  mkdir <dir>     create a folder');
        line('  touch <file>    create an empty file');
        line('  write <f> <txt> write text to a file');
        line('  rm <path>       delete file/folder');
        line('  open <app>      launch an app (e.g. open snake)');
        line('  apps            list installed apps');
        line('  theme <d|l>     dark / light theme');
        line('  date, whoami, clear, neofetch');
      },
      ls(args){
        const p = abs(args[0]);
        const list = p === '/' ? fsList('/') : fsList(p);
        if (!list.length && !fsExists(p)) { line('ls: ' + p + ': no such directory', 'err'); return; }
        list.forEach(i => line('  ' + (i.type === 'dir' ? '📁 ' : '📄 ') + i.name));
      },
      cd(args){
        const p = abs(args[0]);
        if (p === home || fsExists(p) && (FS[p] ? FS[p].type === 'dir' : true)) cwd = p;
        else line('cd: ' + p + ': not a directory', 'err');
      },
      cat(args){
        if (!args[0]) return line('usage: cat <file>', 'err');
        const p = abs(args[0]);
        if (FS[p] && FS[p].type === 'file') line(FS[p].content || '(empty)');
        else line('cat: ' + p + ': no such file', 'err');
      },
      echo(args){ line(args.join(' ')); },
      mkdir(args){ if (!args[0]) return line('usage: mkdir <dir>', 'err'); fsMkdir(abs(args[0])); line('created ' + abs(args[0]), 'ok'); },
      touch(args){ if (!args[0]) return line('usage: touch <file>', 'err'); fsWrite(abs(args[0]), ''); line('created ' + abs(args[0]), 'ok'); },
      write(args){ const p = abs(args.shift()); if (!p) return line('usage: write <file> <text>', 'err'); fsWrite(p, args.join(' ')); line('wrote ' + p, 'ok'); },
      rm(args){
        if (!args[0]) return line('usage: rm <path>', 'err');
        const p = abs(args[0]);
        if (args.includes('-f')) { fsDelete(p); line('permanently removed ' + p, 'ok'); }
        else { trashAdd(p); line('moved to Recycle Bin: ' + p, 'ok'); }
      },
      open(args){
        const key = (args[0] || '').toLowerCase();
        const found = Object.keys(APPS).find(k => k === key) ||
          Object.keys(APPS).find(k => APPS[k].name.toLowerCase() === key);
        if (found){ openApp(found); line('launched ' + APPS[found].name, 'ok'); }
        else line('open: unknown app "' + key + '" (try: apps)', 'err');
      },
      apps(){ Object.entries(APPS).forEach(([k, a]) => line('  ' + a.icon + '  ' + k.padEnd(12) + a.name)); },
      theme(args){ settings.theme = args[0] === 'l' ? 'light' : 'dark'; saveSettings(); line('theme: ' + settings.theme, 'ok'); },
      date(){ line(new Date().toString()); },
      whoami(){ line(settings.user.toLowerCase()); },
      clear(){ out.innerHTML = ''; },
      neofetch(){
        line('        ██            ' + settings.user + '@uos', 'ok');
        line('      ██████          ----------');
        line('    ██████████        OS: uOS 1.0 (web)');
        line('   ██  ████  ██       Kernel: JavaScript');
        line('   ████████████      Uptime: ' + Math.floor(performance.now() / 1000) + 's');
        line('    ██████████        Shell: uosh');
        line('      ██████          Theme: ' + settings.theme);
        line('        ██            Resolution: ' + innerWidth + 'x' + innerHeight);
      }
    };
    function run(raw){
      line(prompt_() + ' ' + raw);
      const parts = raw.trim().split(/\s+/);
      const cmd = (parts.shift() || '').toLowerCase();
      if (!cmd) return;
      if (COMMANDS[cmd]) { try { COMMANDS[cmd](parts); } catch(e){ line(String(e), 'err'); } }
      else line('uosh: command not found: ' + cmd, 'err');
      line('');
    }
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter'){ const v = input.value; input.value = ''; run(v); }
      else if (e.key === 'ArrowUp'){ e.preventDefault(); }
    });
    term.addEventListener('click', () => input.focus());
    body.__focus = input;
    banner(); line('');
    setTimeout(() => input.focus(), 60);
  }
};

APPS.browser = {
  name: 'Nova Browser', icon: '🌐', w: 980, h: 680,
  mount(body, win){
    body.innerHTML = `<div class="brw">
      <div class="tabstrip" id="brTabs"></div>
      <div class="toolbar">
        <button class="btn" id="bBack" title="Back">←</button>
        <button class="btn" id="bReload" title="Reload">⟳</button>
        <input class="field" id="bUrl" style="flex:1;min-width:120px" placeholder="Search or enter address" spellcheck="false" autocomplete="off">
        <button class="btn" id="bOpenTab" title="Open this page in your real browser">Open ↗</button>
        <button class="btn primary" id="bGo">Go</button>
      </div>
      <div class="brw-bar" id="bWarn" style="display:none">
        <span>Blank page? This site refuses to be embedded — open it in your real browser instead.</span>
        <button class="btn" id="bExt">Open ↗</button>
      </div>
      <div id="bPages"></div>
    </div>`;

    const strip = $('#brTabs', body), pages = $('#bPages', body), urlbar = $('#bUrl', body), warn = $('#bWarn', body);
    const LINKS = [
      ['Wikipedia', 'https://en.m.wikipedia.org'],
      ['Bing', 'https://www.bing.com'],
      ['Archive.org', 'https://archive.org'],
      ['jsDelivr', 'https://www.jsdelivr.com'],
      ['Maps', 'https://www.openstreetmap.org/export/embed.html?bbox=-0.25,51.42,0.05,51.58'],
      ['Example', 'https://example.com'],
      ['Random wiki', 'https://en.m.wikipedia.org/wiki/Special:Random']
    ];
    const tabs = [];
    let active = null, seq = 0;

    function toUrl(v){
      v = (v || '').trim();
      if (!v) return null;
      if (/^https?:\/\//i.test(v)) return v;
      if (/^[\w-]+(\.[\w-]+)+([/?#].*)?$/.test(v)) return 'https://' + v;
      return 'https://www.bing.com/search?q=' + encodeURIComponent(v);
    }
    function hostOf(u){ try { return new URL(u).hostname.replace(/^www\./, ''); } catch(e){ return String(u); } }

    /* ------------------------------- tabs --------------------------- */
    function newTab(url){
      const id = 'bt' + (++seq);
      const page = el('div', { class: 'tabpage', 'data-id': id });
      const homeEl = el('div', { class: 'brw-home' });
      const frame = el('iframe', { class: 'brw-frame', style: 'display:none' });
      frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads allow-presentation');
      page.append(homeEl, frame);
      pages.append(page);

      const t = { id: id, page: page, home: homeEl, frame: frame, url: null, title: 'New tab', stack: [] };
      frame.addEventListener('load', function(){
        let title = t.url ? hostOf(t.url) : 'New tab';
        try { if (frame.contentDocument && frame.contentDocument.title) title = frame.contentDocument.title; } catch(e){}
        t.title = title || 'New tab';
        drawTabs();
      });

      tabs.push(t);
      buildHome(t);
      activate(id);
      if (url) navigateIn(t, url);
      else setTimeout(function(){ const i = t.home.querySelector('input'); if (i) i.focus(); }, 40);
      updateClocks();
      return t;
    }
    function buildHome(t){
      t.home.innerHTML = '';
      const clock = el('div', { class: 'nt-clock' }, '--:--');
      const date = el('div', { class: 'nt-date' }, '');
      const search = el('div', { class: 'nt-search' },
        el('span', { html: sysIcon('search') }),
        el('input', { placeholder: 'Search the web or type an address', spellcheck: 'false', autocomplete: 'off' }));
      const links = el('div', { class: 'nt-links' });
      LINKS.forEach(function(pair){
        const b = el('button', { class: 'nt-link' }, pair[0]);
        b.onclick = function(){ navigateIn(t, pair[1]); };
        links.append(b);
      });
      t.home.append(el('div', { class: 'newtab' }, clock, date, search, links,
        el('div', { class: 'nt-note' }, 'Searches use Bing, which allows embedding. Sites that block embedding (Google, YouTube…) stay blank in the frame — use “Open ↗” for those.')));
      const inp = search.querySelector('input');
      inp.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ const u = toUrl(inp.value); if (u) navigateIn(t, u); } });
    }
    function activate(id){
      const t = tabs.find(function(x){ return x.id === id; }) || tabs[0];
      if (!t) return;
      active = t;
      pages.querySelectorAll('.tabpage').forEach(function(p){ p.classList.toggle('on', p === t.page); });
      urlbar.value = t.url || '';
      warn.style.display = t.url ? 'flex' : 'none';
      drawTabs();
    }
    function navigateIn(t, v){
      const u = toUrl(v);
      if (!u) return;
      t.stack.push(u);
      t.url = u;
      urlbar.value = u;
      t.home.style.display = 'none';
      t.frame.style.display = 'block';
      t.frame.setAttribute('src', u);
      t.title = hostOf(u);
      warn.style.display = 'flex';
      drawTabs();
    }
    function goBack(t){
      if (t.stack.length < 2){
        t.stack = []; t.url = null;
        t.frame.removeAttribute('src');
        t.frame.style.display = 'none';
        t.home.style.display = 'flex';
        urlbar.value = '';
        warn.style.display = 'none';
        t.title = 'New tab';
        drawTabs();
        return;
      }
      t.stack.pop();
      const prev = t.stack[t.stack.length - 1];
      t.url = prev;
      urlbar.value = prev;
      t.frame.setAttribute('src', prev);
      t.title = hostOf(prev);
      drawTabs();
    }
    function closeTab(id){
      const i = tabs.findIndex(function(x){ return x.id === id; });
      if (i < 0) return;
      const t = tabs[i];
      const wasActive = active === t;
      t.page.remove();
      tabs.splice(i, 1);
      if (!tabs.length){ newTab(); return; }
      if (wasActive) activate(tabs[Math.max(0, i - 1)].id);
      else drawTabs();
    }
    function drawTabs(){
      strip.innerHTML = '';
      tabs.forEach(function(t){
        const b = el('div', { class: 'btab' + (active === t ? ' on' : ''), title: t.title });
        b.append(el('span', { class: 't' }, t.title));
        const x = el('button', { class: 'x', title: 'Close tab' }, '✕');
        x.onclick = function(e){ e.stopPropagation(); closeTab(t.id); };
        b.append(x);
        b.onclick = function(){ activate(t.id); };
        strip.append(b);
      });
      const plus = el('button', { class: 'tabnew', title: 'New tab' }, '＋');
      plus.onclick = function(){ newTab(); };
      strip.append(plus);
    }

    /* ----------------------------- toolbar -------------------------- */
    $('#bGo', body).onclick = function(){ if (active) navigateIn(active, urlbar.value); };
    urlbar.addEventListener('keydown', function(e){ if (e.key === 'Enter' && active) navigateIn(active, urlbar.value); });
    $('#bBack', body).onclick = function(){ if (active) goBack(active); };
    $('#bReload', body).onclick = function(){ if (active && active.url) active.frame.setAttribute('src', active.url); };
    const openReal = function(){ if (active && active.url) window.open(active.url, '_blank'); };
    $('#bExt', body).onclick = openReal;
    $('#bOpenTab', body).onclick = openReal;

    function updateClocks(){
      const d = new Date();
      const c = clockText(d);
      pages.querySelectorAll('.nt-clock').forEach(function(n){ n.textContent = c.time; });
      pages.querySelectorAll('.nt-date').forEach(function(n){ n.textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' }); });
    }
    updateClocks();
    const clockTimer = setInterval(updateClocks, 1000);

    newTab();
    return function(){ clearInterval(clockTimer); };
  }
};

APPS.paint = {
  name: 'Paint', icon: '🎨', w: 820, h: 580,
  mount(body){
    const COLORS = ['#000000','#ffffff','#e81123','#f0932b','#f6d365','#00b894','#00cec9','#0078d4','#7c5cff','#e84393','#8b5a2b','#808080'];
    body.innerHTML = `
      <div class="paint">
        <div class="toolbar">
          <div class="swatchrow" id="colors"></div>
          <div class="sep"></div>
          <span class="muted" style="font-size:12px">Size</span>
          <input type="range" id="size" min="1" max="48" value="6" style="width:110px">
          <span class="muted" id="sizeV" style="font-size:12px;width:20px">6</span>
          <div class="sep"></div>
          <button class="btn" id="eraser">Eraser</button>
          <button class="btn" id="fill">Fill</button>
          <button class="btn" id="clear">Clear</button>
          <div class="sep"></div>
          <button class="btn primary" id="save">Save PNG</button>
        </div>
        <canvas class="paint-canvas" id="pc"></canvas>
      </div>`;
    const cv = $('#pc', body), ctx = cv.getContext('2d');
    let color = '#000000', size = 6, erasing = false, drawing = false, last = null;
    function fit(){
      const r = cv.parentElement.getBoundingClientRect();
      const img = ctx.getImageData(0, 0, cv.width || 1, cv.height || 1);
      const w = Math.max(200, Math.floor(r.width)), h = Math.max(150, Math.floor(r.height) - 46);
      cv.width = w; cv.height = h;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
      try { ctx.putImageData(img, 0, 0); } catch(e){}
    }
    const cw = $('#colors', body);
    COLORS.forEach((c, i) => {
      const b = el('button', { class: 'csw' + (i === 0 ? ' on' : '') });
      b.style.background = c;
      b.onclick = () => { color = c; erasing = false; $$('.csw', cw).forEach(x => x.classList.remove('on')); b.classList.add('on'); };
      cw.append(b);
    });
    const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; };
    const stroke = (a, b) => {
      ctx.strokeStyle = erasing ? '#ffffff' : color;
      ctx.lineWidth = erasing ? size * 2.4 : size;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    };
    cv.addEventListener('pointerdown', e => { drawing = true; last = pos(e); try { cv.setPointerCapture(e.pointerId); } catch(err){}; stroke(last, last); });
    cv.addEventListener('pointermove', e => { if (!drawing) return; const p = pos(e); stroke(last, p); last = p; });
    cv.addEventListener('pointerup', () => drawing = false);
    cv.addEventListener('pointerleave', () => drawing = false);
    $('#size', body).oninput = e => { size = +e.target.value; $('#sizeV', body).textContent = size; };
    $('#eraser', body).onclick = () => { erasing = !erasing; toast('Paint', erasing ? 'Eraser on' : 'Brush on'); };
    $('#fill', body).onclick = () => { ctx.fillStyle = color; ctx.fillRect(0, 0, cv.width, cv.height); };
    $('#clear', body).onclick = () => { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height); };
    $('#save', body).onclick = () => {
      const a = document.createElement('a'); a.download = 'uos-paint.png'; a.href = cv.toDataURL('image/png'); a.click();
    };
    setTimeout(fit, 30);
    return () => {};
  }
};

        <div style="display:flex;gap:8px;flex-wrap:wrap" id="songs"></div>
      </div>`;
    let ac = null, playing = null;
    const audio = () => ac || (ac = new (window.AudioContext || window.webkitAudioContext)());
    function beep(freq, dur = .35){
      const a = audio(); if (a.state === 'suspended') a.resume();
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(.0001, a.currentTime);
      g.gain.exponentialRampToValueAtTime(.22, a.currentTime + .02);
      g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);
      o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur + .05);
    }
    const keys = $('#keys', body);
    NOTES.forEach(([n, f], i) => {
      const k = el('button', { class: 'key' + ([1,3,6].includes(i) ? '' : '') }, n);
      k.onclick = () => { beep(f); };
      keys.append(k);
    });
    const keyMap = { a:0, s:1, d:2, f:3, g:4, h:5, j:6, k:7 };
    bindKeys(body, e => {
      const i = keyMap[e.key.toLowerCase()];
      if (i === undefined) return false;
      beep(NOTES[i][1]);
      const k = keys.children[i]; k.classList.add('on'); setTimeout(() => k.classList.remove('on'), 140);
      return true;
    });
    const SONGS = {
      'Twinkle': [['C',4],['C',4],['G',4],['G',4],['A',4],['A',4],['G',8],['F',4],['F',4],['E',4],['E',4],['D',4],['D',4],['C',8]],
      'Ode to Joy': [['E',4],['E',4],['F',4],['G',4],['G',4],['F',4],['E',4],['D',4],['C',4],['C',4],['D',4],['E',4],['E',8],['D',4],['D',8]],
      'Arpeggio': [['C',8],['E',8],['G',8],['C5',8],['G',8],['E',8],['C',8],['E',8],['G',8],['C5',8],['G',8],['E',8],['C',8],['G',4],['C',8]]
    };
    const songs = $('#songs', body);
    function stop(){ if (playing){ clearInterval(playing); playing = null; } }
    Object.entries(SONGS).forEach(([name, seq]) => {
      const b = el('button', { class: 'btn' }, '▶ ' + name);
      b.onclick = () => {
        stop();
        let i = 0;
        playing = setInterval(() => {
          if (i >= seq.length){ stop(); return; }
          const [n, d] = seq[i];
          const f = (NOTES.find(x => x[0] === n) || [, 440])[1];
          beep(f, 2000 / d);
          i++;
        }, 260);
      };
      songs.append(b);
    });
    songs.append(el('button', { class: 'btn danger', onclick: stop }, '■ Stop'));
    return () => stop();
  }
};

      $('#bigDate', body).textContent = d.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' });
    };
    upd(); const tick = setInterval(upd, 1000);

    // stopwatch
    let swStart = 0, swElapsed = 0, swTimer = null, laps = 0;
    const drawSw = () => {
      const ms = swElapsed + (swTimer ? Date.now() - swStart : 0);
      const m = Math.floor(ms / 60000), s = Math.floor(ms % 60000 / 1000), t = Math.floor(ms % 1000 / 100);
      $('#sw', body).textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0') + '.' + t;
    };
    const swLoop = setInterval(drawSw, 60);
    $('#swGo', body).onclick = e => {
      if (swTimer){ clearInterval(swTimer); swTimer = null; swElapsed += Date.now() - swStart; e.target.textContent = 'Start'; }
      else { swStart = Date.now(); swTimer = setInterval(drawSw, 60); e.target.textContent = 'Pause'; }
    };
    $('#swLap', body).onclick = () => {
      const ms = swElapsed + (swTimer ? Date.now() - swStart : 0);
      $('#laps', body).prepend(el('div', {}, 'Lap ' + (++laps) + ': ' + (ms/1000).toFixed(2) + 's'));
    };
    $('#swReset', body).onclick = () => { clearInterval(swTimer); swTimer = null; swElapsed = 0; laps = 0; $('#laps', body).innerHTML = ''; drawSw(); $('#swGo', body).textContent = 'Start'; };

    // timer
    let tTimer = null;
    $('#tGo', body).onclick = () => {
      if (tTimer){ clearInterval(tTimer); tTimer = null; $('#tGo', body).textContent = 'Start'; return; }
      let left = (+$('#tmin', body).value || 0) * 60 * 1000;
      if (left <= 0) return;
      $('#tGo', body).textContent = 'Pause';
      tTimer = setInterval(() => {
        left -= 1000;
        if (left <= 0){ clearInterval(tTimer); tTimer = null; $('#tLeft', body).textContent = 'Time is up!'; $('#tGo', body).textContent = 'Start'; toast('⏰ Timer', 'Time is up!'); beepTwice(); return; }
        const s = Math.ceil(left / 1000);
        $('#tLeft', body).textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
      }, 1000);
    };
    function beepTwice(){
      try {
        const a = new (window.AudioContext||window.webkitAudioContext)();
        [0,.25].forEach(d => { const o=a.createOscillator(), g=a.createGain(); o.connect(g).connect(a.destination); o.frequency.value=880;
          g.gain.setValueAtTime(.2,a.currentTime+d); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d+.2); o.start(a.currentTime+d); o.stop(a.currentTime+d+.22); });
      } catch(e){}
    }
    return () => { clearInterval(tick); clearInterval(swLoop); clearInterval(swTimer); clearInterval(tTimer); };
  }
};

APPS.colorpicker = {
  name: 'Color Picker', icon: '🎨', w: 520, h: 560, single: true,
  mount(body){
    body.innerHTML = `
      <div class="pad" style="overflow:auto">
        <div class="swatch-big" id="big"></div>
        <div style="display:flex;gap:10px;align-items:center">
          <input type="color" id="cp" value="#0078d4">
          <input class="field mono" id="chex" value="#0078d4" style="flex:1">
          <button class="btn" id="copy">Copy</button>
        </div>
        <div class="card">
          <div class="kv"><span>HEX</span><b class="mono" id="kHex"></b></div>
          <div class="kv"><span>RGB</span><b class="mono" id="kRgb"></b></div>
          <div class="kv"><span>HSL</span><b class="mono" id="kHsl"></b></div>
        </div>
        <h3 class="sect">Tints &amp; shades</h3>
        <div class="swatchrow" id="ramp"></div>
        <h3 class="sect">Harmony</h3>
        <div class="swatchrow" id="harmony"></div>
      </div>`;
    const clamp255 = n => Math.max(0, Math.min(255, Math.round(n)));
    const hexToRgb = h => { h = h.replace('#',''); if (h.length === 3) h = h.split('').map(c=>c+c).join(''); const n = parseInt(h,16); return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 }; };
    const rgbToHex = (r,g,b) => '#' + [r,g,b].map(v => clamp255(v).toString(16).padStart(2,'0')).join('');
    function rgbToHsl(r,g,b){
      r/=255; g/=255; b/=255;
      const mx = Math.max(r,g,b), mn = Math.min(r,g,b); let h = 0, s = 0; const l = (mx+mn)/2;
      if (mx !== mn){ const d = mx-mn; s = l > .5 ? d/(2-mx-mn) : d/(mx+mn);
        h = mx === r ? (g-b)/d + (g < b ? 6 : 0) : mx === g ? (b-r)/d + 2 : (r-g)/d + 4; h /= 6; }
      return { h: Math.round(h*360), s: Math.round(s*100), l: Math.round(l*100) };
    }
    let color = '#0078d4';
    function set(c, fromInput){
      color = c;
      const { r,g,b } = hexToRgb(c);
      const hsl = rgbToHsl(r,g,b);
      $('#big', body).style.background = c;
      $('#kHex', body).textContent = c.toLowerCase();
      $('#kRgb', body).textContent = `rgb(${r}, ${g}, ${b})`;
      $('#kHsl', body).textContent = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
      $('#chex', body).value = c.toLowerCase();
      if (!fromInput) $('#cp', body).value = c.toLowerCase();
      // ramps
      const ramp = $('#ramp', body); ramp.innerHTML = '';
      for (let i = 0; i <= 10; i++){
        const t = i/10;
        const mix = t < .5 ? { r: r + (255-r)*(1-t*2), g: g + (255-g)*(1-t*2), b: b + (255-b)*(1-t*2) }
                           : { r: r*(1-(t-.5)*2), g: g*(1-(t-.5)*2), b: b*(1-(t-.5)*2) };
        ramp.append(swatch(rgbToHex(mix.r,mix.g,mix.b)));
      }
      const har = $('#harmony', body); har.innerHTML = '';
      [0,30,120,180,240,300].forEach(dh => har.append(swatch(hslToHex((hsl.h+dh)%360, hsl.s, hsl.l))));
    }
    function hslToHex(h,s,l){
      s/=100; l/=100;
      const k = n => (n + h/30) % 12;
      const a = s * Math.min(l, 1-l);
      const f = n => l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
      return rgbToHex(f(0)*255, f(8)*255, f(4)*255);
    }
    function swatch(hex){
      const b = el('button', { class: 'csw', title: hex });
      b.style.background = hex;
      b.onclick = () => set(hex);
      return b;
    }
    $('#cp', body).addEventListener('input', e => set(e.target.value, true));
    $('#chex', body).addEventListener('input', e => { if (/^#?[0-9a-f]{3,6}$/i.test(e.target.value.trim())) set(e.target.value.trim().startsWith('#') ? e.target.value.trim() : '#' + e.target.value.trim(), true); });
    $('#copy', body).onclick = () => { copyText($('#chex', body).value); toast('Color Picker', 'Copied ' + $('#chex', body).value); };
    set(color);
  }
};

const NOTE_COLORS = ['#fef3a0','#ffd6e8','#cfe8ff','#d6f5d6','#e4d6ff'];
function renderNotes(){
  const layer = $('#notes'); if (!layer) return;
  layer.innerHTML = '';
  const notes = store.get('stickies', []);
  notes.forEach(n => {
    const persist = () => {
      const all = store.get('stickies', []);
      const i = all.findIndex(x => x.id === n.id);
      if (i >= 0) all[i] = n;
      store.set('stickies', all);
    };
    const el2 = el('div', { class: 'stickynote' });
    el2.style.left = n.x + 'px'; el2.style.top = n.y + 'px'; el2.style.background = n.color;
    const bar = el('div', { class: 'sn-bar' },
      el('button', { class: 'sn-btn', title: 'Colour', onclick: () => { n.color = NOTE_COLORS[(NOTE_COLORS.indexOf(n.color)+1) % NOTE_COLORS.length]; persist(); renderNotes(); } }, '🎨'),
      el('button', { class: 'sn-btn', title: 'Delete', onclick: () => { const a = store.get('stickies', []).filter(x => x.id !== n.id); store.set('stickies', a); renderNotes(); } }, '✕'));
    const ta = el('textarea', { spellcheck: 'false' });
    ta.value = n.text || '';
    ta.addEventListener('input', () => { n.text = ta.value; persist(); });
    el2.append(bar, ta);
    bar.addEventListener('pointerdown', e => {
      if (e.target.closest('.sn-btn')) return;
      const r = el2.getBoundingClientRect();
      const ox = e.clientX - r.left, oy = e.clientY - r.top;
      const sx = n.x, sy = n.y;
      try { bar.setPointerCapture(e.pointerId); } catch(err){}
      const move = ev => {
        n.x = clamp(ev.clientX - ox, 0, innerWidth - 60);
        n.y = clamp(ev.clientY - oy, 0, innerHeight - 90);
        el2.style.left = n.x + 'px'; el2.style.top = n.y + 'px';
      };
      const up = () => {
        bar.removeEventListener('pointermove', move);
        bar.removeEventListener('pointerup', up);
        const spot = placeNoOverlap(el2, n.x, n.y, el2.offsetWidth, el2.offsetHeight, false);
        if (spot){ n.x = Math.round(spot.x); n.y = Math.round(spot.y); }
        else { n.x = sx; n.y = sy; }        // nowhere free — put it back
        el2.style.left = n.x + 'px'; el2.style.top = n.y + 'px';
        persist();
      };
      bar.addEventListener('pointermove', move); bar.addEventListener('pointerup', up);
    });
    layer.append(el2);
    // nudge a freshly rendered note off anything it would overlap
    const fit = placeNoOverlap(el2, n.x, n.y, el2.offsetWidth, el2.offsetHeight, false);
    if (fit && fit.moved){ n.x = Math.round(fit.x); n.y = Math.round(fit.y); el2.style.left = n.x + 'px'; el2.style.top = n.y + 'px'; persist(); }
  });
}

/* --------------------------- usage rate limits ---------------------- *
 * Client-side guard so one person can't burn the whole free quota.
 * Stored per browser — it stops casual overuse, not a determined user.  */
const AI_LIMITS_DEFAULT = { perMin: 20, perDay: 100 };
let AI_LIMITS = Object.assign({}, AI_LIMITS_DEFAULT, store.get('aiLimits', {}) || {});
function aiUsage(){
  const now = Date.now();
  let u = store.get('aiUsage', { t: [] });
  if (!u || !Array.isArray(u.t)) u = { t: [] };
  u.t = u.t.filter(x => typeof x === 'number' && now - x < 86400000);
  return u;
}
function aiRemaining(){ return Math.max(0, AI_LIMITS.perDay - aiUsage().t.length); }
function aiCheckLimit(){
  const now = Date.now(), t = aiUsage().t;
  const lastMin = t.filter(x => now - x < 60000).length;
  if (lastMin >= AI_LIMITS.perMin)
    return { ok: false, msg: 'Slow down — limit is ' + AI_LIMITS.perMin + ' messages per minute. Try again in a few seconds.' };
  if (t.length >= AI_LIMITS.perDay){
    const mins = Math.max(1, Math.round((86400000 - (now - t[0])) / 60000));
    const h = Math.floor(mins / 60), m = mins % 60;
    return { ok: false, msg: 'Daily limit reached (' + AI_LIMITS.perDay + ' messages/day). Resets in about ' + (h ? h + 'h ' : '') + m + 'm.' };
  }
  return { ok: true };
}
function aiRecord(){ const u = aiUsage(); u.t.push(Date.now()); store.set('aiUsage', u); }

function aiFormat(text){
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const blocks = [];
  let out = esc(text).replace(/```[a-zA-Z0-9]*\n?([\s\S]*?)```/g, (m, code) => {
    blocks.push('<pre><code>' + code.replace(/\n$/, '') + '</code></pre>');
    return '\u0000' + (blocks.length - 1) + '\u0000';
  });
  out = out.replace(/`([^`\n]+)`/g, '<code>$1</code>')
           .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
           .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
           .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  out = out.split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
  return out.replace(/\u0000(\d+)\u0000/g, (m, i) => blocks[+i]);
}

        el('div', { style: 'display:flex;gap:10px;flex-wrap:wrap;align-items:center' },
          el('span', { class: 'muted', style: 'font-size:12px' }, 'Max per minute'), minInp,
          el('span', { class: 'muted', style: 'font-size:12px' }, 'per day'), dayInp, applyLim),
        el('div', { style: 'display:flex;gap:10px;flex-wrap:wrap;align-items:center' }, usageTxt, resetUse));
      card.append(limWrap);
      if (AI_KEY) card.append(el('button', { class: 'btn danger', style: 'align-self:flex-start',
        onclick: () => { AI_KEY = ''; try { localStorage.removeItem('uos.aiKey'); localStorage.removeItem('uos.aiBase'); } catch(e){} showSetup('Saved key removed.'); } }, 'Forget saved key'));
      card.append(el('div', { class: 'muted', style: 'font-size:11.5px;line-height:1.65' },
        'Treat a key like a password — anyone who has it can spend on your account. Never paste it into a public file, repo or chat, and revoke any key that leaks.'));
      card.append(el('div', { class: 'muted', style: 'font-size:11.5px;line-height:1.65' },
        'Tested from a real browser: OpenRouter, Groq and Google Gemini allow direct browser calls. api.openai.com and Cerebras do NOT (no CORS header) — for those, point the base URL at your own small proxy that keeps the key on a server.'));
      msgs.append(card);
      setTimeout(() => inp.focus(), 50);
    }

    function startChat(){
      msgs.innerHTML = '';
      history = [];
      input.disabled = false;
      sendBtn.disabled = false;
      setStatus('Ready · ' + modelSel.value + (AI_KEY ? '' : ' · no key') + ' · ' + aiRemaining() + ' left today');
      bubble('assistant', '<p>Hi! I\'m the uOS Assistant. Ask me anything — code, writing, ideas, homework.</p>' +
        (AI_KEY ? '' : '<p class="muted" style="font-size:12px">Running keyless on a free public endpoint — no setup needed. Open <b>Settings</b> if you\'d rather use your own provider.</p>'));
      input.focus();
    }

    async function send(){
      if (busy) return;
      const text = input.value.trim();
      if (!text) return;
      const lim = aiCheckLimit();
      if (!lim.ok){
        bubble('assistant', '<p style="color:#e81123">⏳ ' + lim.msg + '</p>');
        setStatus('Rate limited · ' + aiRemaining() + ' left today');
        toast('AI Assistant', lim.msg);
        return;
      }
      input.value = '';
      input.style.height = 'auto';
      bubble('user', aiFormat(text));
      history.push({ role: 'user', content: text });
      busy = true;
      sendBtn.disabled = true;
      setStatus('Thinking…');
      const out = bubble('assistant', '<span class="cursor"></span>');
      let acc = '';
      const paint = () => { out.innerHTML = aiFormat(acc) + '<span class="cursor"></span>'; msgs.scrollTop = msgs.scrollHeight; };
      try {
        const headers = { 'Content-Type': 'application/json' };
        if (AI_KEY) headers.Authorization = 'Bearer ' + AI_KEY;
        const res = await fetch(AI_BASE + '/chat/completions', {
          method: 'POST',
          headers: headers,
          body: JSON.stringify({
            model: modelSel.value,
            stream: true,
            messages: [{ role: 'system', content: 'You are uOS Assistant, a helpful, concise assistant built into a web operating system. Use Markdown for code and lists.' }].concat(history)
          })
        });
        if (!res.ok){
          const err = await res.json().catch(() => ({}));
          throw new Error((err.error && err.error.message) || ('HTTP ' + res.status));
        }
        aiRecord();
        setStatus(modelSel.value + ' · ' + aiRemaining() + ' left today');
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        for (;;){
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const parts = buf.split('\n');
          buf = parts.pop();
          for (const line of parts){
            const t = line.trim();
            if (!t.startsWith('data:')) continue;
            const data = t.slice(5).trim();
            if (data === '[DONE]') continue;
            try {
              const j = JSON.parse(data);
              const d = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
              if (d){ acc += d; paint(); }
            } catch(e){}
          }
        }
        out.innerHTML = aiFormat(acc || '(no response)');
        history.push({ role: 'assistant', content: acc });
        setStatus('Ready · ' + modelSel.value + ' · ' + aiRemaining() + ' left today');
      } catch (e){
        const msg = String(e && e.message || e);
        const cors = /failed to fetch|load failed|networkerror/i.test(msg);
        out.innerHTML = '<p style="color:#e81123">⚠ ' + msg + '</p>' + (cors
          ? '<p class="muted" style="font-size:12px">The endpoint refused a browser request (CORS). Use an API base URL that allows browser calls, or a small proxy that keeps the key on a server.</p>'
          : '');
        setStatus(cors ? 'Blocked (CORS)' : (/401|invalid|api key|incorrect/i.test(msg) ? 'Invalid key — open Settings' : 'Error'));
      } finally {
        busy = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.onclick = send;
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
    input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 150) + 'px'; });
    $('#aiNew', body).onclick = () => { if (!busy) startChat(); };
    $('#aiSave', body).onclick = () => {
      if (!history.length) return toast('AI', 'Nothing to save yet.');
      const md = history.map(m => '## ' + (m.role === 'user' ? 'You' : 'Assistant') + '\n\n' + m.content).join('\n\n');
      const path = 'Documents/ai-chat-' + Date.now() + '.md';
      fsWrite(path, md);
      toast('AI', 'Saved ' + path);
    };
    $('#aiKeyBtn', body).onclick = () => showSetup('');
    modelSel.onchange = () => { store.set('aiModel', modelSel.value); setStatus((busy ? 'Thinking…' : 'Ready') + ' · ' + modelSel.value + (AI_KEY ? '' : ' · no key')); };

    startChat();   // works with no key (keyless default provider)
    const _aiSetupBtn = $('#aiKeyBtn', body);
    if (_aiSetupBtn) _aiSetupBtn.onclick = () => showSetup('');
  }
};

/* ---------------------------- Recycle Bin --------------------------- */
let TRASH = store.get('trash', []) || [];
function trashChanged(){
  const w = [...windows.values()].find(x => x.appId === 'trash');
  if (w && typeof w.body.__refresh === 'function') { try { w.body.__refresh(); } catch(e){} }
  try { renderDesktopIcons(); } catch(e){}
}
function trashAdd(path){
  const entry = { id: uid(), path, at: Date.now(), node: FS[path] || null, children: {} };
  for (const k of Object.keys(FS)) if (k.startsWith(path + '/')) entry.children[k] = FS[k];
  TRASH.unshift(entry);
  TRASH = TRASH.slice(0, 200);
  store.set('trash', TRASH);
  fsDelete(path);
  trashChanged();
}
function trashRestore(id){
  const i = TRASH.findIndex(e => e.id === id);
  if (i < 0) return;
  const e = TRASH[i];
  if (e.node) FS[e.path] = e.node;
  for (const [k, v] of Object.entries(e.children)) FS[k] = v;
  saveFS();
  TRASH.splice(i, 1); store.set('trash', TRASH);
  trashChanged();
}
function trashRemove(id){ TRASH = TRASH.filter(e => e.id !== id); store.set('trash', TRASH); trashChanged(); }
function trashEmpty(){ TRASH = []; store.set('trash', TRASH); trashChanged(); }

const RUN_ALIASES = {
  files: 'files', explorer: 'files', cmd: 'terminal', terminal: 'terminal', shell: 'terminal',
  notepad: 'notepad', edit: 'notepad', calc: 'calc', calculator: 'calc', paint: 'paint', mspaint: 'paint',
  settings: 'settings', control: 'settings', browser: 'browser', edge: 'browser', nova: 'browser',
  ai: 'ai', chat: 'ai',
  taskmgr: 'taskmgr', task: 'taskmgr', clock: 'clock', calendar: 'calendar', camera: 'viewer',
  media: 'media', code: 'code', run: 'run', trash: 'trash', bin: 'trash', recycle: 'trash',
  clipboard: 'clipboard', sticky: 'sticky', notes: 'sticky', qr: 'qrgen', password: 'passgen', color: 'colorpicker',
  about: 'about', info: 'about', credits: 'about'
};
function runTarget(input){
  const v = (input || '').trim();
  if (!v) return;
  const key = v.toLowerCase().replace(/\.exe$/, '');
  if (RUN_ALIASES[key] && APPS[RUN_ALIASES[key]]){ openApp(RUN_ALIASES[key]); return toast('Run', 'Opening ' + v); }
  const byName = Object.keys(APPS).find(k => APPS[k].name.toLowerCase() === key);
  if (byName){ openApp(byName); return toast('Run', 'Opening ' + v); }
  const normalised = v.replace(/^\\+/, '').replace(/\\/g, '/');
  if (FS[normalised] || Object.keys(FS).some(k => k === normalised)){ openPath(normalised); return toast('Run', 'Opening ' + v); }
  const anyId = Object.keys(APPS).find(k => k === key);
  if (anyId){ openApp(anyId); return toast('Run', 'Opening ' + v); }
  toast('Run', 'Cannot find "' + v + '"');
}

/* ---------------------------- open a file --------------------------- */
function openPath(path){
  const name = String(path).split('/').pop();
  const f = FS[path] || {};
  if (/^data:image/.test(f.content || '') || /\.(png|jpe?g|gif|webp|svg)$/i.test(name)) return openApp('viewer', { file: path });
  if (/\.(mp3|wav|ogg|mp4|webm)$/i.test(name)) return openApp('media', { });
  if (/\.(js|json|html|css)$/i.test(name)) return openApp('code', { file: path });
  if (/\.(txt|csv|md|log)$/i.test(name) || !f.type) return openApp('notepad', { file: path });
  return openApp('notepad', { file: path });
}

    const t = WIDGET_TYPES[wd.type]; if (!t) return;
    const card = el('div', { class: 'widget' });
    card.style.cssText = 'left:' + wd.x + 'px;top:' + wd.y + 'px;width:' + t.w + 'px;';
    const bar = el('div', { class: 'widget-bar' },
      el('span', { class: 'widget-ico' }, t.icon),
      el('span', { class: 'widget-name' }, t.name),
      el('button', { class: 'widget-x', title: 'Remove widget' }, '✕'));
    const bodyEl = el('div', { class: 'widget-body' });
    card.append(bar, bodyEl);
    $('.widget-x', bar).onclick = e => { e.stopPropagation(); removeWidget(wd.id); };
    bar.addEventListener('pointerdown', e => {
      if (e.target.closest('.widget-x')) return;
      const r = $('#desktop').getBoundingClientRect();
      const sx = e.clientX, sy = e.clientY, ox = wd.x, oy = wd.y, w0 = card.offsetWidth, h0 = card.offsetHeight;
      try { bar.setPointerCapture(e.pointerId); } catch(err){}
      const move = ev => {
        wd.x = clamp(ox + ev.clientX - sx, 0, Math.max(0, r.width - w0));
        wd.y = clamp(oy + ev.clientY - sy, 0, Math.max(0, r.height - h0));
        card.style.left = wd.x + 'px'; card.style.top = wd.y + 'px';
      };
      const up = () => {
        bar.removeEventListener('pointermove', move);
        bar.removeEventListener('pointerup', up);
        const spot = placeNoOverlap(card, wd.x, wd.y, card.offsetWidth, card.offsetHeight, false);
        if (spot){ wd.x = Math.round(spot.x); wd.y = Math.round(spot.y); }
        else { wd.x = ox; wd.y = oy; }        // nowhere free — put it back
        card.style.left = wd.x + 'px';
        card.style.top = wd.y + 'px';
        saveWidgets();
      };
      bar.addEventListener('pointermove', move);
      bar.addEventListener('pointerup', up);
    });
    try { t.render(bodyEl, wd); } catch(e){ bodyEl.textContent = 'Widget error'; }
    layer.append(card);
    // whole-widget de-overlap (also tidies saved layouts)
    const fit = placeNoOverlap(card, wd.x, wd.y, card.offsetWidth, card.offsetHeight, false);
    if (fit && fit.moved){ wd.x = Math.round(fit.x); wd.y = Math.round(fit.y); card.style.left = wd.x + 'px'; card.style.top = wd.y + 'px'; saveWidgets(); }
  });
  try { tickWidgets(); } catch(e){}
}
function tickWidgets(){
  const d = new Date();
  const c = clockText(d);
  $$('.w-clock-time').forEach(n => n.textContent = c.time);
  $$('.w-clock-date').forEach(n => n.textContent = d.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' }));
  updateSystemWidgets();
}

async function quickAsk(prompt){
  const lim = aiCheckLimit();
  if (!lim.ok) throw new Error(lim.msg);
  const headers = { 'Content-Type': 'application/json' };
  if (AI_KEY) headers.Authorization = 'Bearer ' + AI_KEY;
  const res = await fetch(AI_BASE + '/chat/completions', {
    method: 'POST', headers: headers,
    body: JSON.stringify({ model: store.get('aiModel', AI_MODELS[0]) || AI_MODELS[0],
      messages: [{ role: 'system', content: 'You are uOS Assistant. Be concise.' }, { role: 'user', content: prompt }] })
  });
  if (!res.ok){ const e = await res.json().catch(() => ({})); throw new Error((e.error && e.error.message) || ('HTTP ' + res.status)); }
  aiRecord();
  const j = await res.json();
  return (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '(no response)';
}

function uniqueName(dir, base, ext){

  let n = base + (ext || ''), i = 2;

  while (taken(n)){ n = base + ' (' + i + ')' + (ext || ''); i++; }
  return n;
}

let pinnedList = store.get('pinned', ['browser', 'files']);
function isPinned(id){ return pinnedList.includes(id); }
function pinApp(id){ if (!isPinned(id)){ pinnedList = pinnedList.concat(id); store.set('pinned', pinnedList); rebuildTaskbar(); } }
function unpinApp(id){ pinnedList = pinnedList.filter(x => x !== id); store.set('pinned', pinnedList); rebuildTaskbar(); }

function makeTaskItem(win){
  const ti = el('button', { class: 'taskitem', title: win.app.name },
    el('span', { class: 'tico', html: iconHTML(win.appId, win.app.icon) }),
    el('span', { class: 'tlabel' }, win.app.name));
  ti.addEventListener('click', () => {
    if (win.minimized) restoreWin(win);
    else if (activeWin === win) minimizeWin(win);
    else focusWin(win);
  });
  ti.addEventListener('contextmenu', e => {
    e.preventDefault(); e.stopPropagation();
    showContext(e.clientX, e.clientY, [
      { label: 'Pin to taskbar', act: () => { pinApp(win.appId); toast('Taskbar', 'Pinned ' + win.app.name); } },
      { sep: true },
      { label: 'Close window', act: () => closeWin(win) }
    ]);
  });

}
function attachTaskEl(win){
  if (win.taskEl && win.taskEl.classList.contains('taskitem') && !isPinned(win.appId)) return;
  if (win.taskEl && win.taskEl.classList.contains('taskitem')) win.taskEl.remove();
  const pin = isPinned(win.appId) ? $('#pinned .pin[data-app="' + win.appId + '"]') : null;
  if (pin){
    win.taskEl = pin;

    if (activeWin === win) pin.classList.add('active');
  } else {
    win.taskEl = makeTaskItem(win);
    $('#taskItems').append(win.taskEl);
  }
}

  [...windows.values()].forEach(attachTaskEl);
  if (activeWin && activeWin.taskEl) activeWin.taskEl.classList.add('active');

const ICON_GRID = { w: 90, h: 96, pad: 10, gap: 2 };
function measureIconCell(){
  const probe = document.createElement('div');
  probe.className = 'dicon';
  probe.setAttribute('style', 'visibility:hidden;left:0;top:0');
  probe.innerHTML = '<div class="ico">' + iconHTML('files', '📁') + '</div><div class="lbl">Nova Browser</div>';
  $('#icons').append(probe);
  ICON_GRID.w = (probe.offsetWidth || 86) + ICON_GRID.gap;
  ICON_GRID.h = (probe.offsetHeight || 90) + ICON_GRID.gap;
  probe.remove();
}
function deskIconSlot(i, h){
  const rows = Math.max(1, Math.floor((h - ICON_GRID.pad) / ICON_GRID.h));
  return { x: ICON_GRID.pad + Math.floor(i / rows) * ICON_GRID.w, y: ICON_GRID.pad + (i % rows) * ICON_GRID.h };
}
/* snap an axis value to the icon grid, clamped so the icon stays fully on screen */
function snapAxis(v, cell, pad, max){
  const maxIdx = Math.max(0, Math.floor((max - pad) / cell));
  const idx = Math.max(0, Math.min(Math.round((v - pad) / cell), maxIdx));
  return pad + idx * cell;
}
/* pull every icon back on-screen (used after the window is resized) */
function clampIconsToScreen(){
  const rect = $('#desktop').getBoundingClientRect();
  const save = store.get('iconPos', {}) || {};
  $$('.dicon').forEach(n => {
    const iw = n.offsetWidth || 86, ih = n.offsetHeight || 90;
    const x = snapAxis(parseFloat(n.style.left) || 0, ICON_GRID.w, ICON_GRID.pad, rect.width - iw);
    const y = snapAxis(parseFloat(n.style.top) || 0, ICON_GRID.h, ICON_GRID.pad, rect.height - ih);
    n.style.left = x + 'px'; n.style.top = y + 'px';
    save[n.dataset.app] = { x, y };
  });
  store.set('iconPos', save);
}
function autoArrangeIcons(){ store.set('iconPos', {}); renderDesktopIcons(); }

/* ---------------- stop desktop things overlapping each other -------- */
function deskArea(){ return $('#desktop').getBoundingClientRect(); }
function objectRects(exclude, noIcons){
  const d = deskArea();
  const out = [];
  $$(noIcons ? '.widget, .stickynote' : '.dicon, .widget, .stickynote').forEach(n => {
    if (n === exclude) return;
    if (exclude && exclude.contains && exclude.contains(n)) return;
    if (!n.isConnected) return;
    const r = n.getBoundingClientRect();
    if (!r.width || !r.height) return;
    out.push({ x: r.left - d.left, y: r.top - d.top, w: r.width, h: r.height });
  });
  return out;
}
function hitsAny(r, list, pad){
  pad = pad || 0;
  for (let i = 0; i < list.length; i++){
    const o = list[i];
    if (!(r.x + r.w + pad <= o.x || r.x >= o.x + o.w + pad || r.y + r.h + pad <= o.y || r.y >= o.y + o.h + pad)) return true;
  }
  return false;
}
/* nearest free spot anywhere on the desktop (rects move in 12px steps) */
function freeSpot(x, y, w, h, list, area, step){
  step = step || 12;
  const maxX = Math.max(0, area.width - w), maxY = Math.max(0, area.height - h);
  const at = function(px, py){
    px = Math.min(Math.max(0, px), maxX); py = Math.min(Math.max(0, py), maxY);
    return hitsAny({ x: px, y: py, w: w, h: h }, list, 0) ? null : { x: px, y: py };
  };
  let hit = at(x, y); if (hit) return hit;
  for (let ring = 1; ring <= 40; ring++){
    for (let dx = -ring; dx <= ring; dx++) for (let dy = -ring; dy <= ring; dy++){
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== ring) continue;
      hit = at(x + dx * step, y + dy * step);
      if (hit) return hit;
    }
  }
  return null;
}
/* same, but locked to the icon grid */
function freeIconSpot(cx, cy, w, h, list, area){
  const maxCX = Math.max(0, Math.floor((area.width - ICON_GRID.pad - w) / ICON_GRID.w));
  const maxCY = Math.max(0, Math.floor((area.height - ICON_GRID.pad - h) / ICON_GRID.h));
  const at = function(a, b){
    if (a < 0 || b < 0 || a > maxCX || b > maxCY) return null;
    const px = ICON_GRID.pad + a * ICON_GRID.w, py = ICON_GRID.pad + b * ICON_GRID.h;
    return hitsAny({ x: px, y: py, w: w, h: h }, list, 0) ? null : { x: px, y: py };
  };
  let hit = at(cx, cy); if (hit) return hit;
  for (let ring = 1; ring <= 25; ring++){
    for (let dx = -ring; dx <= ring; dx++) for (let dy = -ring; dy <= ring; dy++){
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== ring) continue;
      hit = at(cx + dx, cy + dy);
      if (hit) return hit;
    }
  }
  return null;
}
function iconCellOf(node){
  return {
    cx: Math.round(((parseFloat(node.style.left) || 0) - ICON_GRID.pad) / ICON_GRID.w),
    cy: Math.round(((parseFloat(node.style.top) || 0) - ICON_GRID.pad) / ICON_GRID.h)
  };
}
function placeNoOverlap(node, x, y, w, h, isIcon){
  const others = objectRects(node);
  if (!hitsAny({ x: x, y: y, w: w, h: h }, others, 0)) return { x: x, y: y, moved: false };
  const spot = isIcon
    ? freeIconSpot(Math.round((x - ICON_GRID.pad) / ICON_GRID.w), Math.round((y - ICON_GRID.pad) / ICON_GRID.h), w, h, others, deskArea())
    : freeSpot(x, y, w, h, others, deskArea());
  return spot ? { x: spot.x, y: spot.y, moved: true } : null;
}
function renderDesktopIcons(){
  const host = $('#icons');
  host.innerHTML = '';
  const rect = $('#desktop').getBoundingClientRect();
  measureIconCell();
  const saved = store.get('iconPos', {}) || {};
  DESKTOP_ICONS.forEach((id, i) => {
    const a = APPS[id]; if (!a) return;
    const n = el('div', { class: 'dicon', 'data-app': id },
      el('div', { class: 'ico', html: iconHTML(id, a.icon) }),
      el('div', { class: 'lbl' }, a.name));
    /* long single-word names shrink to fit one line instead of splitting
       mid-word and spilling into the icon underneath */
    const lblEl = n.querySelector('.lbl');
    if (lblEl){
      if (!/\s/.test(a.name) && a.name.length > 10){
        lblEl.style.fontSize = Math.max(9, 12 - (a.name.length - 10) * 0.5).toFixed(1) + 'px';
        lblEl.style.whiteSpace = 'nowrap';
      }
      lblEl.style.lineHeight = '1.15';
    }
    if (id === 'trash' && typeof TRASH !== 'undefined' && TRASH.length){
      n.append(el('span', { class: 'dicon-badge' }, String(Math.min(99, TRASH.length))));
    }
    host.append(n);                      // measure it, then place it snapped on-grid
    const iw = n.offsetWidth || 86, ih = n.offsetHeight || 90;
    const src = saved[id] || deskIconSlot(i, rect.height);
    n.style.left = snapAxis(src.x || 0, ICON_GRID.w, ICON_GRID.pad, rect.width - iw) + 'px';
    n.style.top = snapAxis(src.y || 0, ICON_GRID.h, ICON_GRID.pad, rect.height - ih) + 'px';

    n.addEventListener('click', e => {
      if (n.__dragged){ n.__dragged = false; return; }
      if (e.ctrlKey || e.metaKey || e.shiftKey) n.classList.toggle('sel');
      else { $$('.dicon').forEach(x => x.classList.remove('sel')); n.classList.add('sel'); }
    });
    n.addEventListener('dblclick', () => { if (!n.__dragged) openApp(id); });
    n.addEventListener('contextmenu', e => {
      e.preventDefault(); e.stopPropagation();
      if (!n.classList.contains('sel')){ $$('.dicon').forEach(x => x.classList.remove('sel')); n.classList.add('sel'); }
      showContext(e.clientX, e.clientY, [
        { label: 'Open', act: () => openApp(id) },
        { sep: true },
        isPinned(id)
          ? { label: 'Unpin from taskbar', act: () => unpinApp(id) }
          : { label: 'Pin to taskbar', act: () => pinApp(id) },
        { label: 'Auto arrange icons', act: autoArrangeIcons }
      ]);
    });

    /* ---- drag to move (moves the whole selection if several are selected) ---- */
    n.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      const drect = $('#desktop').getBoundingClientRect();
      const sel = $$('.dicon.sel');
      const group = (n.classList.contains('sel') && sel.length > 1) ? sel : [n];
      const start = group.map(g => ({ node: g, x: parseFloat(g.style.left) || 0, y: parseFloat(g.style.top) || 0, w: g.offsetWidth || 92, h: g.offsetHeight || 96 }));
      const sx = e.clientX, sy = e.clientY;
      let moved = false;
      try { n.setPointerCapture(e.pointerId); } catch(err){}
      start.forEach(s => { s.node.style.transition = 'none'; });   // follow the cursor smoothly
      const move = ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!moved && Math.abs(dx) + Math.abs(dy) > 4) moved = true;
        if (!moved) return;
        start.forEach(s => {
          // free movement, but kept on-screen
          s.node.style.left = clamp(s.x + dx, 0, Math.max(0, drect.width - s.w)) + 'px';
          s.node.style.top = clamp(s.y + dy, 0, Math.max(0, drect.height - s.h)) + 'px';
        });
      };
      const up = () => {
        n.removeEventListener('pointermove', move);
        n.removeEventListener('pointerup', up);
        start.forEach(s => { s.node.style.transition = ''; });   // restore the CSS transition
        if (!moved) return;
        n.__dragged = true;
        const save = store.get('iconPos', {}) || {};
        start.forEach(s => {
          let x = snapAxis(parseFloat(s.node.style.left) || 0, ICON_GRID.w, ICON_GRID.pad, drect.width - s.w);
          let y = snapAxis(parseFloat(s.node.style.top) || 0, ICON_GRID.h, ICON_GRID.pad, drect.height - s.h);
          const spot = placeNoOverlap(s.node, x, y, s.w, s.h, true);
          if (spot){ x = spot.x; y = spot.y; }
          else { x = s.x; y = s.y; }          // nothing free — go back where it was
          void s.node.offsetWidth;           // reflow with the transition active…
          s.node.style.left = x + 'px';      // …then animate into the snapped slot
          s.node.style.top = y + 'px';
          save[s.node.dataset.app] = { x, y };
        });
        store.set('iconPos', save);
      };
      n.addEventListener('pointermove', move);
      n.addEventListener('pointerup', up);
    });
  });
  /* never let two icons share a grid cell */
  const usedCells = new Set();
  $$('.dicon').forEach(function(node){
    const w = node.offsetWidth || 86, h = node.offsetHeight || 90;
    const cur = iconCellOf(node);
    const key = cur.cx + ',' + cur.cy;
    if (!usedCells.has(key)){ usedCells.add(key); return; }
    const spot = freeIconSpot(cur.cx, cur.cy, w, h, objectRects(node), $('#desktop').getBoundingClientRect());
    if (spot){
      node.style.left = spot.x + 'px';
      node.style.top = spot.y + 'px';
      usedCells.add(Math.round((spot.x - ICON_GRID.pad) / ICON_GRID.w) + ',' + Math.round((spot.y - ICON_GRID.pad) / ICON_GRID.h));
    }
  });
}

/* ---- desktop: click-and-drag rubber-band selection ---- */
const selbox = $('#selbox');
$('#desktop').addEventListener('pointerdown', e => {
  if (e.target === $('#desktop')) toggleStart(false);
  const empty = e.target === $('#desktop') || e.target === $('#icons') || e.target === selbox;
  if (!empty || e.button !== 0) return;
  const additive = e.ctrlKey || e.metaKey || e.shiftKey;
  const keep = additive ? $$('.dicon.sel') : [];
  if (!additive) $$('.dicon').forEach(x => x.classList.remove('sel'));
  const rect = $('#desktop').getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  selbox.style.display = 'block';
  Object.assign(selbox.style, { left: sx + 'px', top: sy + 'px', width: '0px', height: '0px' });
  const move = ev => {
    const cx = ev.clientX - rect.left, cy = ev.clientY - rect.top;
    const x = Math.min(sx, cx), y = Math.min(sy, cy), w = Math.abs(cx - sx), h = Math.abs(cy - sy);
    Object.assign(selbox.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
    $$('.dicon').forEach(ic => {
      const b = ic.getBoundingClientRect();
      const ix = b.left - rect.left, iy = b.top - rect.top;
      const hit = !(ix + b.width < x || ix > x + w || iy + b.height < y || iy > y + h);
      ic.classList.toggle('sel', hit || keep.includes(ic));
    });
  };
  const up = () => {
    selbox.style.display = 'none';
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
});

    ? { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' }

function lockScreen(){
  toggleStart(false); hideContext(); closeFlyout();

  $('.spinner', ov).style.display = 'none';

      el('div', { class: 'lockclock', id: 'lockTime' }, ''),
      el('div', { class: 'lockdate', id: 'lockDate' }, ''),
      el('div', { class: 'lockuser' }, el('span', { class: 'avatar', html: (settings.user[0] || 'U').toUpperCase() }), el('span', {}, settings.user)),
      el('div', { id: 'lockSplash', style: 'font-size:12px;font-weight:600;color:#c9a45f;opacity:.9;transform:rotate(-2.5deg);max-width:360px;text-align:center' }, randSplash()),

        el('button', { class: 'btn primary', id: 'lockPinGo' }, 'Unlock')));
    ov.append(box);
    $('#lockPinGo', ov).onclick = tryUnlock;
    $('#lockPinInput', ov).addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
  }
  box.style.display = 'flex';

  'greetings from the source code',
  'jarvo says hi',
  'deepseek says hi',
  'this line is load-bearing',
  'you can stop reading these now',
  'unplug the router, it still works',
  'achievement unlocked: reading splash text',
  'the other splashes are jealous'
];
let __splashRare = false;
function randSplash(){
  __splashRare = SPLASHES_RARE.length > 0 && Math.random() < 0.06;   /* ~1 in 16 */
  const list = __splashRare ? SPLASHES_RARE : SPLASHES;
  return list[Math.floor(Math.random() * list.length)];
}
function applySplash(node){
  if (!node) return;
  node.textContent = randSplash();
  node.classList.toggle('rare', __splashRare);
}
let __splashT = null;
function rollSplash(){ applySplash(document.getElementById('splash')); }

/* =====================================================================
   BOOT SEQUENCE
   ===================================================================== */
function boot(){
  if (!settings.boot){
    $('#boot').style.display = 'none';
    setTimeout(() => toast('uOS', 'Right-click the desktop or press Start to begin.'), 500);
    maybeTour();
    return;
  }
  const lines = [
    'uOS firmware v1.00 — initializing',
    'detecting display ................ ' + innerWidth + 'x' + innerHeight,
    'mounting virtual filesystem ...... /',
    'loading window manager ........... ok',
    'loading apps ..................... ' + Object.keys(APPS).length,
    'restoring user profile ........... ' + settings.user,
    'starting services ................ ok',
    'welcome to uOS'
  ];
  rollSplash();
  clearInterval(__splashT);
  __splashT = setInterval(rollSplash, 2000);
  const fill = $('#bootFill'), log = $('#bootLog');
  let i = 0;
  const step = () => {
    if (i < lines.length){
      log.append(el('div', {}, '› ' + lines[i]));
      if (log.children.length > 5) log.firstChild.remove();
      fill.style.width = Math.round(((i + 1) / lines.length) * 100) + '%';
      i++;
      setTimeout(step, i === lines.length ? 420 : 150);
    } else {
      clearInterval(__splashT);
      $('#boot').classList.add('done');
      setTimeout(() => { $('#boot').style.display = 'none'; }, 550);
      setTimeout(() => toast('uOS', 'Right-click the desktop or press Start to begin.'), 900);
      maybeTour();
    }
  };
  setTimeout(step, 220);
}

/* --------------------------- first-run tour ------------------------- */
const TOUR_STEPS = [
  { title: 'Welcome to uOS', text: 'A quick one-minute tour of the main bits. Skip it any time \u2014 you can replay it later from Settings.', sel: null },
  { title: 'Your desktop', text: 'Double-click an icon to open an app. Drag icons to move them \u2014 they snap to a grid and never overlap.', sel: '.dicon', multi: true },
  { title: 'Right-click anywhere', text: 'Right-click the wallpaper for New folder, New text document, sticky notes, widgets and personalisation.', sel: null },
  { title: 'Start menu', text: 'Every app lives behind the Start button. Search apps, files and settings from here.', sel: '#startBtn' },
  { title: 'Taskbar', text: 'Pinned and running apps sit here. Right-click it for Task Manager, Task View and layout options.', sel: '#taskbar' },
  { title: 'System tray', text: 'Wi-Fi, volume, battery, notifications and the clock. The chevron opens quick actions.', sel: '#tray' },
  { title: 'Widgets & notes', text: 'The Widgets app \u2014 or the desktop right-click menu \u2014 drops live cards on your desktop: clock, calendar, to-do, Ask AI.', sel: null },
  { title: 'Keyboard shortcuts', text: 'Alt+Tab switches windows. Ctrl+Alt+T terminal \u00b7 A AI \u00b7 S settings \u00b7 L lock.', sel: null },
  { title: 'That\u2019s it!', text: 'Enjoy uOS. Replay this tour any time from Settings \u2192 About & backup.', sel: null }
];
let __tourEls = null, __tourStep = 0;
function tourEls(){
  if (__tourEls) return __tourEls;
  const wrap = el('div', { id: 'tour' });
  const spot = el('div', { id: 'tourSpot' });
  const card = el('div', { id: 'tourCard' });
  wrap.append(spot, card);
  document.body.append(wrap);
  __tourEls = { wrap: wrap, spot: spot, card: card };
  return __tourEls;
}
function tourTargetRect(step){
  if (!step.sel) return null;
  const nodes = $$(step.sel).filter(function(n){ return n.getBoundingClientRect().width; });
  if (!nodes.length) return null;
  if (step.multi){
    let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
    nodes.forEach(function(n){
      const q = n.getBoundingClientRect();
      l = Math.min(l, q.left); t = Math.min(t, q.top); r = Math.max(r, q.right); b = Math.max(b, q.bottom);
    });
    return { left: l, top: t, right: r, bottom: b, width: r - l, height: b - t };
  }
  return nodes[0].getBoundingClientRect();
}
function renderTour(){
  const T = tourEls(), step = TOUR_STEPS[__tourStep];
  const pad = 6;
  const rect = tourTargetRect(step);
  if (rect){
    const l = Math.max(0, rect.left - pad), t = Math.max(0, rect.top - pad);
    T.spot.style.display = 'block';
    T.spot.style.left = l + 'px';
    T.spot.style.top = t + 'px';
    T.spot.style.width = Math.min(innerWidth - l, rect.width + pad * 2) + 'px';
    T.spot.style.height = Math.min(innerHeight - t, rect.height + pad * 2) + 'px';
  } else {
    T.spot.style.display = 'block';
    T.spot.style.left = '50%'; T.spot.style.top = '46%';
    T.spot.style.width = '0px'; T.spot.style.height = '0px';
  }
  T.card.innerHTML = '';
  T.card.append(
    el('div', { class: 'tour-kicker' }, 'Step ' + (__tourStep + 1) + ' of ' + TOUR_STEPS.length),
    el('h3', {}, step.title),
    el('p', {}, step.text)
  );
  const dots = el('div', { id: 'tourDots' });
  TOUR_STEPS.forEach(function(_, i){ dots.append(el('i', { class: i === __tourStep ? 'on' : '' })); });
  T.card.append(dots);
  const btns = el('div', { id: 'tourBtns' });
  btns.append(el('button', { class: 'btn', onclick: function(){ endTour(); } }, 'Skip'));
  if (__tourStep > 0) btns.append(el('button', { class: 'btn', onclick: function(){ __tourStep--; renderTour(); } }, 'Back'));
  btns.append(el('button', {
    class: 'btn primary',
    onclick: function(){
      if (__tourStep >= TOUR_STEPS.length - 1) endTour();
      else { __tourStep++; renderTour(); }
    }
  }, __tourStep >= TOUR_STEPS.length - 1 ? 'Done' : 'Next'));
  T.card.append(btns);
  // position the card next to the spotlight
  requestAnimationFrame(function(){
    const cw = T.card.offsetWidth, ch = T.card.offsetHeight;
    let left = innerWidth / 2 - cw / 2, top = innerHeight / 2 - ch / 2;
    if (rect && rect.width){
      const cx = rect.left + rect.width / 2;
      left = cx - cw / 2;
      top = (rect.bottom + ch + 24 < innerHeight) ? rect.bottom + 14 : Math.max(12, rect.top - ch - 14);
    }
    T.card.style.left = Math.max(12, Math.min(left, innerWidth - cw - 12)) + 'px';
    T.card.style.top = Math.max(12, Math.min(top, innerHeight - ch - 12)) + 'px';
  });
}
function startTour(from){
  __tourStep = from || 0;
  tourEls().wrap.classList.add('on');
  renderTour();
}
function endTour(){
  tourEls().wrap.classList.remove('on');
  store.set('tourDone', true);
}
function maybeTour(){
  if (settings.showTour === false) return;
  if (store.get('tourDone', false)) return;
  setTimeout(function(){ startTour(0); }, 900);
}
document.addEventListener('keydown', function(e){
  if (!__tourEls || !__tourEls.wrap.classList.contains('on')) return;
  if (e.key === 'Escape'){ endTour(); }
  else if (e.key === 'ArrowRight' || e.key === 'Enter'){ if (__tourStep >= TOUR_STEPS.length - 1) endTour(); else { __tourStep++; renderTour(); } }
  else if (e.key === 'ArrowLeft' && __tourStep > 0){ __tourStep--; renderTour(); }
});

/* ------------------------------ GO ---------------------------------- */
installLogo();
installSystemIcons();
applyTheme();
renderPinned();
/* one-time: make sure the Recycle Bin sits at the top of the desktop.
   Only clears a saved layout if the bin isn't already the top-left icon. */
(function binFirst(){
  if (store.get('iconOrderV', 0) >= 2) return;
  const saved = store.get('iconPos', {}) || {};
  const keys = Object.keys(saved);
  if (!keys.length){ store.set('iconOrderV', 2); return; }
  const top = keys.slice().sort(function(a, b){ return (saved[a].y - saved[b].y) || (saved[a].x - saved[b].x); })[0];
  if (top !== 'trash') store.set('iconPos', {});
  store.set('iconOrderV', 2);
})();
renderDesktopIcons();
renderNotes();
renderWidgets();
updateClock();
renderStartMenu();
renderRecents();
boot();
console.log('%cuOS%c — web operating system loaded. Apps: ' + Object.keys(APPS).length,
  'font-weight:bold;color:#0078d4;font-size:14px', 'color:#888');
</script>
